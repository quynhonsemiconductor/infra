---
# Shape of the LOCAL inventory. Copy to inventory/local/hosts.yml (git-ignored) and put the real
# addresses there; 192.0.2.0/24 is the documentation range. Nothing secret belongs in this file:
# tokens come from the environment of the run (op run), see README.md.
all:
  vars:
    # Docker Hub account used for read-only image pulls (role k3s_registries). A site value in the
    # LOCAL inventory; the token comes from the environment of the run (op run), never this file.
    k3s_registries_docker_hub_username: example-dockerhub-account
    # SSH for people (role ssh_infra + Cloudflare Access for Infrastructure). The CA public key is
    # printed by scripts/owner/cloudflare-ssh-ca.sh; entries are only created on the listed hosts.
    # node_ssh_ca_public_key: "ssh-ed25519 AAAA... "
    # node_admin_users:
    #   - { name: example-admin, sudo: true, hosts: [ai-01] }
  children:
    pve:
      hosts:
        pve01:
          ansible_host: 192.0.2.10
          ansible_user: root
          # Entra OpenID login (roles pve_base and pbs; one "QNSC Proxmox" app). Site values, so they
          # belong in the LOCAL inventory only; the client secret comes from the environment of the run
          # (PROXMOX_OIDC_CLIENT_SECRET), never from this file.
          # proxmox_oidc_issuer_url: "https://login.microsoftonline.com/<tenant>/v2.0"
          # proxmox_oidc_client_id: "<application (client) id>"
          # proxmox_oidc_admin_group_oid: "<object id of grp-qnsc-platform-admins>"
          # Shared admin list for BOTH realms: exact Entra email strings, pre-created as
          # <email>@entra. PVE makes each one a member of the admin group; PBS grants Admin on /.
          # (The old pbs_entra_admin_emails key is still accepted as a fallback.)
          # proxmox_entra_admin_emails: ["<admin1>@<domain>", "<admin2>@<domain>"]
          # OTLP/HTTP endpoint of the in-cluster alloy-otlp-host NodePort; required by pve_monitoring.
          # pve_monitoring_otlp_endpoint: "http://192.0.2.20:30418"
    k3s_server:
      hosts:
        k3s-01:
          ansible_host: 192.0.2.20
          ansible_user: qnsc
          # kernel_pin_version: "7.0.0-38"  # rollback only (docs/runbooks/apparmor-containerd-stacking.md)
    k3s_agent_gpu:
      hosts:
        ai-01:
          ansible_host: 192.0.2.21
          ansible_user: ubuntu
          # where the agent joins (site value, local only)
          k3s_agent_gpu_server_url: https://192.0.2.20:6443
    vlsi:
      hosts:
        vlsi-01:
          ansible_host: 192.0.2.22
          ansible_user: qnsc
          k3s_agent_server_url: https://192.0.2.20:6443
    k3s:
      children:
        k3s_server:
        k3s_agent_gpu:
        vlsi:
