---
- name: Restart k3s for the registry configuration
  ansible.builtin.service:
    name: "{{ k3s_registries_service }}"
    state: restarted
  when: k3s_registries_allow_restart | bool

- name: Report that k3s needs a restart for the registry configuration
  ansible.builtin.debug:
    msg: >-
      /etc/rancher/k3s/registries.yaml changed. {{ k3s_registries_service }} was NOT restarted (a restart
      interrupts every workload on the node). Restart it in a window, or re-run with
      -e k3s_registries_allow_restart=true.
  when: not (k3s_registries_allow_restart | bool)
