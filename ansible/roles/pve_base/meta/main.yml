---
galaxy_info:
  author: QNSC platform
  description: pve_base (see docs/runbooks/host-config-inventory.md)
  license: proprietary
  min_ansible_version: "2.20"
  platforms:
    - name: Debian
      versions: [all]
    - name: Ubuntu
      versions: [all]
# The journald limits are part of "this host is configured", and every host runs exactly one of
# vm_guest (the three VMs) or pve_base (pve01) — a dependency is the one place that cannot be forgotten.
dependencies:
  - role: journald
