---
# PCI ids (vendor:device) of every function of the card, passed to vfio-pci. Set in group_vars/pve.yml.
pve_gpu_ids: []

# systemd-boot + ZFS hosts keep the kernel command line here (proxmox-boot-tool copies it to the ESP).
pve_gpu_cmdline_file: /etc/kernel/cmdline

# After the run, check that vfio-pci really holds the card. A host that has not rebooted yet fails this check:
# false only reports it.
pve_gpu_verify_strict: false
