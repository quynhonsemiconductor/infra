---
# Cloudflare Access for Infrastructure SSH. The node trusts ONE CA; every
# login is a short-lived certificate Cloudflare issues after Access checks the
# Entra group, MFA and the permitted UNIX username.
- name: Cloudflare Access for Infrastructure SSH
  when: ssh_infra_enabled | bool
  tags: [ssh_infra]
  block:
    - name: The CA key and the per-node user list are usable
      ansible.builtin.assert:
        that:
          - ssh_infra_ca_public_key is match('^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp256|sk-ssh-ed25519@openssh.com) AAAA')
          - ssh_infra_admin_users is sequence
          - >-
            alltrue([
              for u in ssh_infra_admin_users :
              u.name is defined and u.name is match('^[a-z_][a-z0-9_-]{0,31}$')
              and u.hosts is defined and u.hosts is sequence
            ])
        fail_msg: >-
          ssh_infra_ca_public_key must be the Gateway SSH CA public key
          (scripts/owner/cloudflare-ssh-ca.sh) and ssh_infra_admin_users entries need
          name + hosts; set them in the LOCAL inventory, or leave the key empty
          to disable this role.
        quiet: true

    # The LOCAL inventory list is global; each node only takes its own entries.
    - name: Select this node's admins
      ansible.builtin.set_fact:
        ssh_infra_host_users: >-
          {{ ssh_infra_admin_users | selectattr('hosts', 'contains', inventory_hostname) | list }}
        ssh_infra_desired_names: >-
          {{ ssh_infra_admin_users | selectattr('hosts', 'contains', inventory_hostname)
             | map(attribute='name') | list }}

    - name: State directory for the managed-account marker
      ansible.builtin.file:
        path: "{{ ssh_infra_managed_users_file | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Read the accounts this role managed on the last run
      ansible.builtin.slurp:
        src: "{{ ssh_infra_managed_users_file }}"
      register: ssh_infra_managed_raw
      failed_when: false

    - name: Keep the accounts this role managed on the last run
      ansible.builtin.set_fact:
        ssh_infra_old_names: >-
          {{ (ssh_infra_managed_raw.content | default('') | b64decode).splitlines()
             | map('trim') | select('match', '^[a-z_][a-z0-9_-]{0,31}$') | list }}
    - name: Work out the removed accounts
      ansible.builtin.set_fact:
        ssh_infra_removed_names: "{{ ssh_infra_old_names | difference(ssh_infra_desired_names) }}"

    - name: Trust the Cloudflare Gateway SSH CA
      ansible.builtin.copy:
        dest: "{{ ssh_infra_ca_file }}"
        content: "{{ ssh_infra_ca_public_key | trim }}\n"
        owner: root
        group: root
        mode: "0644"
      notify: ssh_infra_reload_sshd

    # The CA trust goes in before any cert can appear. PubkeyAuthentication
    # stays on; no AuthorizedKeysFile is removed, the break-glass operator
    # account keeps its key.
    - name: Trust certified keys for every account (sshd drop-in)
      ansible.builtin.copy:
        dest: "{{ ssh_infra_sshd_dropin }}"
        content: |
          # Cloudflare Access for Infrastructure (managed by infra/ansible).
          PubkeyAuthentication yes
          TrustedUserCAKeys {{ ssh_infra_ca_file }}
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: ssh_infra_reload_sshd

    # The MERGED config (drop-ins included) must parse before the reload runs:
    # a bad fragment would otherwise break the next sshd start.
    - name: The merged sshd configuration parses
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
      when: not ansible_check_mode

    - name: Create each listed admin with no password
      ansible.builtin.user:
        name: "{{ item.name }}"
        shell: /bin/bash
        password: "!"
        password_lock: true
        create_home: true
        append: true
        groups: >-
          {{ (item.groups | default([]))
             + (['video', 'render'] if inventory_hostname in (groups['k3s_agent_gpu'] | default([])) else []) }}
        state: present
      loop: "{{ ssh_infra_host_users }}"
      loop_control:
        label: "{{ item.name }}"

    # People SSH ONLY with a short-lived certificate. A personal key left on
    # the node would outlive offboarding, so it is removed, never managed.
    - name: No long-lived authorized_keys for a managed account
      ansible.builtin.file:
        path: "/home/{{ item.name }}/.ssh/authorized_keys"
        state: absent
      loop: "{{ ssh_infra_host_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Sudo without a password (identity + MFA happen at Cloudflare)
      ansible.builtin.copy:
        dest: "{{ ssh_infra_sudoers_dir }}/qnsc-{{ item.name }}"
        content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
      loop: "{{ ssh_infra_host_users | selectattr('sudo', 'defined') | selectattr('sudo') | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: No sudo for an account not granted it
      ansible.builtin.file:
        path: "{{ ssh_infra_sudoers_dir }}/qnsc-{{ item.name }}"
        state: absent
      loop: >-
        {{ (ssh_infra_host_users | rejectattr('sudo', 'defined') | list)
           + (ssh_infra_host_users | selectattr('sudo', 'defined') | rejectattr('sudo') | list) }}
      loop_control:
        label: "{{ item.name }}"

    # Offboarding: removed from ssh_infra_admin_users means locked (expiry in the
    # past) with the home kept. The user is never deleted here.
    - name: Look up each account this node no longer lists
      ansible.builtin.getent:
        database: passwd
        key: "{{ item }}"
        fail_key: false
      loop: "{{ ssh_infra_removed_names }}"

    - name: Lock an offboarded account (home kept)
      ansible.builtin.user:
        name: "{{ item }}"
        expires: 1
        password_lock: true
        state: present
      loop: "{{ ssh_infra_removed_names }}"
      when: getent_passwd[item] | default(none) is not none

    - name: Remove sudo from an offboarded account
      ansible.builtin.file:
        path: "{{ ssh_infra_sudoers_dir }}/qnsc-{{ item }}"
        state: absent
      loop: "{{ ssh_infra_removed_names }}"

    - name: Record the accounts this role manages on this node
      ansible.builtin.copy:
        dest: "{{ ssh_infra_managed_users_file }}"
        content: "{{ (ssh_infra_desired_names | sort | join('\n')) ~ '\n' }}"
        owner: root
        group: root
        mode: "0644"
