---
# Replaces the loaded profile in place: running containers pick up the new rules, k3s is never restarted.
- name: Reload the containerd AppArmor profile
  ansible.builtin.command: apparmor_parser -r /etc/apparmor.d/cri-containerd.apparmor.d
  changed_when: true

- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
