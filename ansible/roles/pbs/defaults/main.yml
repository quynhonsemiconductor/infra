---
# Proxmox Backup Server, co-located on the PVE host. The pool `backup` (mirror of the two HDDs) already exists
# and is never created here: only a dataset on it.
pbs_apt_suite: "{{ ansible_facts['distribution_release'] }}"
pbs_repository_file: /etc/apt/sources.list.d/pbs-no-subscription.sources

# The enterprise sources need a subscription. pbs-enterprise.sources on pve01 made every
# `apt-get update` fail with 401 (so no security updates) until the owner disabled it by hand
# on 2026-11-05; this role keeps it disabled. pve_base disables the PVE and Ceph ones.
pbs_disable_enterprise_repos: true
pbs_enterprise_repo_file: /etc/apt/sources.list.d/pbs-enterprise.sources

pbs_zfs_dataset: backup/pbs
pbs_datastore_name: qnsc
pbs_datastore_path: /backup/pbs

# Calendar events (systemd syntax). Prune before the 01:00 backup window is irrelevant: it only drops snapshots
# outside the keep policy. GC after the backups. A weekly verify re-reads chunks.
pbs_gc_schedule: "03:00"
pbs_prune_job_id: qnsc-prune
pbs_prune_schedule: "daily"
pbs_prune_keep_daily: 7
pbs_prune_keep_weekly: 4
pbs_prune_keep_monthly: 6
pbs_verify_job_id: qnsc-verify
pbs_verify_schedule: "sat 04:00"
pbs_verify_outdated_after_days: 30

# The identity PVE uses: an API token with DatastoreBackup on the datastore only.
pbs_pve_user: backup@pbs
pbs_pve_token_name: pve
pbs_pve_role: DatastoreBackup

# Where the owner stores the token secret (the role prints the command; it never handles the secret itself).
pbs_onepassword_vault: QNSC
pbs_onepassword_item_title: "PBS - pve backup - API token"

# ── Entra OpenID login ──────────────────────────────────────────────────────
# The same "QNSC Proxmox" app as the PVE realm (one client id, one secret). PBS's OpenID realm has NO
# group-claim option: authorization is one ACL per pre-created <email>@<realm> user. The list is the
# SHARED site value `proxmox_entra_admin_emails` (LOCAL inventory, git-ignored) and must mirror the app's
# direct assignments and the platform-admins group. `pbs_entra_admin_emails` is kept as a compat alias:
# an inventory that still sets it wins over this default. The client secret comes from the environment of
# the run:
#   PROXMOX_OIDC_CLIENT_SECRET   (kv-qnsc-admin/admin-proxmox-oidc-secret; ansible/README.md)
# root@pam remains the break-glass account (LAN only, password + TOTP).
pbs_entra_enabled: true
pbs_entra_cli_path: /usr/sbin/proxmox-backup-manager
pbs_entra_realm: entra
pbs_entra_issuer_url: "{{ proxmox_oidc_issuer_url | default('') }}"
pbs_entra_client_id: "{{ proxmox_oidc_client_id | default('') }}"
pbs_entra_client_secret: "{{ lookup('ansible.builtin.env', 'PROXMOX_OIDC_CLIENT_SECRET') }}"
pbs_entra_username_claim: email
pbs_entra_scopes: "openid email profile"
# null = not set. Only the canonical proxmox_entra_admin_emails: [] prunes (it revokes the Admin ACL);
# a leftover legacy pbs_entra_admin_emails: [] is treated as unset, never as a prune request.
pbs_entra_admin_emails: null
# Same precedence as the PVE role: the canonical name wins, the old key is only a fallback. Computed
# separately so an inventory that still sets pbs_entra_admin_emails cannot shadow proxmox_entra_admin_emails.
pbs_entra_admin_emails_effective: >-
  {{ proxmox_entra_admin_emails if proxmox_entra_admin_emails is defined and proxmox_entra_admin_emails is not none
     else (pbs_entra_admin_emails if pbs_entra_admin_emails is defined and pbs_entra_admin_emails is not none
           else []) }}
# True when a list was SUPPLIED (canonical, or a non-empty legacy list). Unset = the role fails; an
# explicit canonical [] = manage and prune.
# PBS accepts the CANONICAL key only. A legacy-only list (empty or not) is not
# a valid configuration here: the assert below fails with the rename message.
pbs_entra_manage_admins: "{{ proxmox_entra_admin_emails is defined and proxmox_entra_admin_emails is not none }}"
# Lowercased ids for the membership match; the original case is kept for the CLI calls.
pbs_entra_desired_userids: >-
  {{ pbs_entra_admin_emails_effective | map('regex_replace', '$', '@' ~ pbs_entra_realm)
     | map('lower') | list }}
# The username claim is fixed at realm creation: a different value stops the role.
pbs_entra_rotate_client_key: false

# ── Off-site copy: an S3-backed datastore on Cloudflare R2 + a weekly local sync ──────────
#
# PBS 4.2 supports S3 object storage as a DATASTORE BACKEND (production support; tech preview in 4.0):
# `s3 endpoint create` + `datastore create <name> <cache-path> --backend type=s3,...`. The off-site store
# is a SECOND DATASTORE on this same PBS, and a weekly LOCAL sync job (source = the `qnsc` datastore,
# no remote needed) copies the latest snapshots into it; the chunks then live in R2.
#
# Two consequences that shape the config:
#   * an S3 datastore needs a LOCAL CACHE ("64 GiB to 128 GiB are recommended"): a ZFS dataset with a
#     quota, never the root filesystem and never the existing datastore path;
#   * R2 needs `path-style true` and `region auto`, and Object Lock / versioning must stay OFF on the
#     bucket (enabling either is the documented way to corrupt an S3 datastore).
#
# Client-side encryption (live/onprem-vm backup.tf) is what makes the off-site copy safe: PBS syncs the
# encrypted chunks as they are, so R2 holds ciphertext. LOSING THE KEY MAKES THE OFF-SITE COPY USELESS.
#
# OFF by default: a full playbook run must never start writing to a cloud bucket.
pbs_offsite_enabled: false
pbs_offsite_store_name: qnsc-offsite
pbs_offsite_cache_dataset: backup/pbs-cache
pbs_offsite_cache_mount: /backup/cache
pbs_offsite_cache_quota: 128G

# The S3 endpoint (Cloudflare R2). The endpoint HOST is a site value (the account id is in it), so it comes
# from the local inventory; the two credentials come from the environment of the run, never from argv:
#   PBS_S3_ACCESS_KEY / PBS_S3_SECRET_KEY   (R2 API token, "Object Read & Write" on the one bucket)
# PBS rejects an endpoint id shorter than 3 characters ("id must be at least 3 characters"), and the
# store config points at it by name: changing it later means recreating the datastore.
pbs_offsite_endpoint_id: r2-offsite
pbs_offsite_endpoint_host: ""
pbs_offsite_bucket: qnsc-pbs-offsite
pbs_offsite_region: auto
pbs_s3_access_key: "{{ lookup('ansible.builtin.env', 'PBS_S3_ACCESS_KEY') }}"
pbs_s3_secret_key: "{{ lookup('ansible.builtin.env', 'PBS_S3_SECRET_KEY') }}"

# Weekly is enough (decision 2026-11-04): the local PBS carries the RPO, this carries the site.
pbs_offsite_sync_job_id: qnsc-offsite-weekly
pbs_offsite_sync_schedule: "Sun 05:00"
pbs_offsite_verify_job_id: qnsc-offsite-verify
pbs_offsite_verify_schedule: "Wed 04:00"
pbs_offsite_gc_schedule: "Mon 03:00"

# sha256 of "<access>:<secret>" from the last run: PBS never shows the stored keys, so this is how a rotation
# (a replacement R2 token in 1Password) is detected and pushed with `s3 endpoint update`.
pbs_offsite_cred_hash_file: /etc/pbs-offsite-endpoint.sha256
