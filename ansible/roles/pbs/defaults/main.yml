---
# Proxmox Backup Server, co-located on the PVE host. The pool `backup` (mirror of the two HDDs) already exists
# and is never created here: only a dataset on it.
pbs_apt_suite: "{{ ansible_facts['distribution_release'] }}"
pbs_repository_file: /etc/apt/sources.list.d/pbs-no-subscription.sources

pbs_zfs_dataset: backup/pbs
pbs_datastore_name: qnsc
pbs_datastore_path: /backup/pbs

# Calendar events (systemd syntax). Prune before the 01:00 backup window is irrelevant: it only drops snapshots
# outside the keep policy. GC after the backups. A weekly verify re-reads chunks.
pbs_gc_schedule: "03:00"
pbs_prune_job_id: qnsc-prune
pbs_prune_schedule: "daily"
pbs_prune_keep_daily: 7
pbs_prune_keep_weekly: 4
pbs_prune_keep_monthly: 6
pbs_verify_job_id: qnsc-verify
pbs_verify_schedule: "sat 04:00"
pbs_verify_outdated_after_days: 30

# The identity PVE uses: an API token with DatastoreBackup on the datastore only.
pbs_pve_user: backup@pbs
pbs_pve_token_name: pve
pbs_pve_role: DatastoreBackup

# Where the owner stores the token secret (the role prints the command; it never handles the secret itself).
pbs_onepassword_vault: QNSC
pbs_onepassword_item_title: "PBS - pve backup - API token"

# ── Entra OpenID login ──────────────────────────────────────────────────────
# The same "QNSC Proxmox" app as the PVE realm (one client id, one secret). PBS's OpenID realm has NO
# group-claim option: authorization is one ACL per pre-created <email>@<realm> user. The list is a site
# value (LOCAL inventory, git-ignored) and must mirror the app's direct assignments and the platform-admins
# group. The client secret comes from the environment of the run:
#   PROXMOX_OIDC_CLIENT_SECRET   (kv-qnsc-admin/admin-proxmox-oidc-secret; ansible/README.md)
# root@pam remains the break-glass account (LAN only, password + TOTP).
pbs_entra_enabled: true
pbs_entra_cli_path: /usr/sbin/proxmox-backup-manager
pbs_entra_realm: entra
pbs_entra_issuer_url: "{{ proxmox_oidc_issuer_url | default('') }}"
pbs_entra_client_id: "{{ proxmox_oidc_client_id | default('') }}"
pbs_entra_client_secret: "{{ lookup('ansible.builtin.env', 'PROXMOX_OIDC_CLIENT_SECRET') }}"
pbs_entra_username_claim: email
pbs_entra_scopes: "openid email profile"
pbs_entra_admin_emails: []
# The username claim is fixed at realm creation: a different value stops the role.
pbs_entra_rotate_client_key: false
