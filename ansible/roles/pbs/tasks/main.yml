---
# ── repositories ────────────────────────────────────────────────────────────
# pve01's apt-get update returned 401 until the owner disabled pbs-enterprise.sources by hand
# (2026-11-05). The no-subscription source below replaces it; the enterprise file stays on disk
# with Enabled: no, the same way pve_base handles pve-enterprise and ceph.
- name: Read the PBS enterprise source
  ansible.builtin.slurp:
    src: "{{ pbs_enterprise_repo_file }}"
  register: pbs_enterprise_file
  failed_when: false
  tags: [pbs_install]

- name: Disable the PBS enterprise source (it needs a subscription)
  ansible.builtin.lineinfile:
    path: "{{ pbs_enterprise_repo_file }}"
    regexp: "^Enabled:"
    line: "Enabled: no"
    insertafter: "^Types:"
    mode: "0644"
  when:
    - pbs_disable_enterprise_repos | bool
    - pbs_enterprise_file.content is defined
    - "'enterprise.proxmox.com' in (pbs_enterprise_file.content | b64decode)"
  notify: Update apt cache for PBS
  tags: [pbs_install]

# A host managed by the GUI may already carry a no-subscription source (deb822 or the older
# .list). Adding a second one makes apt warn on every update, so write ours only when none
# names it yet.
- name: Look for an existing PBS no-subscription source
  ansible.builtin.command: >-
    grep -rlE "pbs-no-subscription" /etc/apt
    --include=sources.list --include=*.list --include=*.sources
  register: pbs_nosub_existing
  changed_when: false
  failed_when: pbs_nosub_existing.rc > 1
  check_mode: false
  tags: [pbs_install]

- name: PBS repository (no-subscription)
  ansible.builtin.copy:
    dest: "{{ pbs_repository_file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pbs
      Suites: {{ pbs_apt_suite }}
      Components: pbs-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
  when: pbs_nosub_existing.rc == 1 or (pbs_repository_file in pbs_nosub_existing.stdout_lines)
  register: pbs_repo
  notify: Update apt cache for PBS
  tags: [pbs_install]

- name: Flush the apt cache update before installing
  ansible.builtin.meta: flush_handlers
  tags: [pbs_install]

# In --check on a host without the repository yet, apt cannot see the package: the install is skipped and the
# tasks below report what they can without the PBS command line.
- name: Install proxmox-backup-server
  ansible.builtin.apt:
    name: proxmox-backup-server
    state: present
  when: not (ansible_check_mode and pbs_repo is changed)
  tags: [pbs_install]

- name: Is the PBS command line available (not in --check on a host without PBS)
  ansible.builtin.stat:
    path: /usr/sbin/proxmox-backup-manager
  register: pbs_cli
  tags: [pbs_install]

- name: PBS services are enabled and running
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - proxmox-backup
    - proxmox-backup-proxy
  when: pbs_cli.stat.exists
  tags: [pbs_install]

# ── Entra OpenID login ──────────────────────────────────────────────────────
# The same "QNSC Proxmox" app as the PVE realm. PBS ignores group claims: its realm creates users but
# grants nothing, so each admin user is created up front and gets Admin on /. root@pam is NOT touched:
# it is the break-glass account, LAN only. The username comes from the token's email claim.
- name: Entra OpenID realm, admin users and ACLs
  when: pbs_entra_enabled | bool
  tags: [pbs_entra]
  block:
    - name: Is the PBS command line available
      ansible.builtin.stat:
        path: "{{ pbs_entra_cli_path }}"
      register: pbs_entra_cli
      check_mode: false

    - name: Refuse to configure a realm without PBS installed
      ansible.builtin.assert:
        that: pbs_entra_cli.stat.exists
        fail_msg: >-
          {{ pbs_entra_cli_path }} is missing: install PBS first
          (`ansible-playbook pve-host.yml --tags pbs_install`), or set pbs_entra_enabled=false.
        quiet: true

    - name: The Entra site values are present (local inventory)
      ansible.builtin.assert:
        that:
          - pbs_entra_issuer_url is match('^https://login\.microsoftonline\.com/[^/]+/v2\.0$')
          - pbs_entra_client_id is match('^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$')
          - pbs_entra_realm is match('^[a-z][a-z0-9]*$')
          - pbs_entra_manage_admins | bool
          - pbs_entra_admin_emails_effective | select('match', '^[^@\s]+@[^@\s]+$') | list | length == pbs_entra_admin_emails_effective | length
        fail_msg: >-
          Set proxmox_oidc_issuer_url and proxmox_oidc_client_id plus proxmox_entra_admin_emails in the
          LOCAL inventory (ansible/README.md, "Entra OpenID login"), or set pbs_entra_enabled=false.
          The canonical list is REQUIRED (exact Entra casing); an explicit [] is allowed. A legacy-only
          pbs_entra_admin_emails (empty or not) is NOT accepted — rename it to proxmox_entra_admin_emails.
        quiet: true

    # Every realm carries its client key in this output: hide it.
    - name: Read the OpenID realms (client keys stay hidden)
      ansible.builtin.command: proxmox-backup-manager openid list --output-format json
      register: pbs_entra_realms
      changed_when: false
      check_mode: false
      no_log: true

    - name: Find the realm among them
      ansible.builtin.set_fact:
        pbs_entra_existing: >-
          {{ (pbs_entra_realms.stdout | from_json)
             | selectattr('realm', 'equalto', pbs_entra_realm) | list }}

    - name: An existing realm must use the fixed username claim
      ansible.builtin.assert:
        that:
          - pbs_entra_existing[0]['username-claim'] | default('') == pbs_entra_username_claim
        fail_msg: >-
          realm "{{ pbs_entra_realm }}" exists with another username claim. It is fixed at creation:
          delete and recreate the realm deliberately (`proxmox-backup-manager openid delete
          {{ pbs_entra_realm }}`), then re-run this role.
        quiet: true
      when: pbs_entra_existing | length == 1

    - name: Read the scopes the realm reports
      ansible.builtin.set_fact:
        pbs_entra_have_scopes_raw: "{{ pbs_entra_existing[0]['scopes'] | default('') }}"
      when: pbs_entra_existing | length == 1

    - name: Work out the drift (the key and the username claim are excluded by design)
      ansible.builtin.set_fact:
        pbs_entra_drift: >-
          {{ pbs_entra_existing[0]['issuer-url'] | default('') != pbs_entra_issuer_url
             or pbs_entra_existing[0]['client-id'] | default('') != pbs_entra_client_id
             or not (pbs_entra_existing[0]['default'] | default(false) | bool)
             or ((pbs_entra_have_scopes_raw | join(' ') if pbs_entra_have_scopes_raw is not string
                  else pbs_entra_have_scopes_raw) | split | sort | join(' '))
                != (pbs_entra_scopes.split() | sort | join(' ')) }}
      when: pbs_entra_existing | length == 1

    - name: Refuse to create or rotate the realm without the client secret
      ansible.builtin.assert:
        that: pbs_entra_client_secret | length > 0
        fail_msg: >-
          PROXMOX_OIDC_CLIENT_SECRET is empty. Run with it exported from
          kv-qnsc-admin/admin-proxmox-oidc-secret (ansible/README.md, "Entra OpenID login").
        quiet: true
      when: >-
        pbs_entra_existing | length == 0
        or pbs_entra_rotate_client_key | bool

    - name: Report the realm creation (check mode)
      ansible.builtin.debug:
        msg: "would create the {{ pbs_entra_realm }} OpenID realm"
      changed_when: true
      when:
        - ansible_check_mode
        - pbs_entra_existing | length == 0

    # Per-user ACLs do the authorization, so autocreate stays off: an unlisted user is refused even if
    # Entra handed out a token. The key is momentarily in the CLI's argv; pve01 is a single-admin host.
    - name: Create the realm (default at login, no autocreate)
      ansible.builtin.command:
        argv:
          - proxmox-backup-manager
          - openid
          - create
          - "{{ pbs_entra_realm }}"
          - --issuer-url
          - "{{ pbs_entra_issuer_url }}"
          - --client-id
          - "{{ pbs_entra_client_id }}"
          - --client-key
          - "{{ pbs_entra_client_secret }}"
          - --username-claim
          - "{{ pbs_entra_username_claim }}"
          - --scopes
          - "{{ pbs_entra_scopes }}"
          - --autocreate
          - "0"
          - --default
          - "1"
          - --comment
          - "Entra grp-qnsc-platform-admins (realm {{ pbs_entra_realm }})"
      no_log: true
      changed_when: true
      when:
        - not ansible_check_mode
        - pbs_entra_existing | length == 0

    - name: Report the realm drift fix (check mode)
      ansible.builtin.debug:
        msg: "would align the {{ pbs_entra_realm }} OpenID realm with the inventory"
      changed_when: true
      when:
        - ansible_check_mode
        - pbs_entra_existing | length == 1
        - pbs_entra_drift | bool

    - name: Align the realm settings (never the key or the username claim)
      ansible.builtin.command:
        argv:
          - proxmox-backup-manager
          - openid
          - update
          - "{{ pbs_entra_realm }}"
          - --issuer-url
          - "{{ pbs_entra_issuer_url }}"
          - --client-id
          - "{{ pbs_entra_client_id }}"
          - --scopes
          - "{{ pbs_entra_scopes }}"
          - --default
          - "1"
      changed_when: true
      when:
        - not ansible_check_mode
        - pbs_entra_existing | length == 1
        - pbs_entra_drift | bool

    - name: Report the client-key rotation (check mode)
      ansible.builtin.debug:
        msg: "would replace the client key of realm {{ pbs_entra_realm }}"
      changed_when: true
      when:
        - ansible_check_mode
        - pbs_entra_existing | length == 1
        - pbs_entra_rotate_client_key | bool

    - name: Rotate the client key
      ansible.builtin.command:
        argv:
          - proxmox-backup-manager
          - openid
          - update
          - "{{ pbs_entra_realm }}"
          - --client-key
          - "{{ pbs_entra_client_secret }}"
      no_log: true
      changed_when: true
      when:
        - not ansible_check_mode
        - pbs_entra_existing | length == 1
        - pbs_entra_rotate_client_key | bool

    - name: Read the PBS users
      ansible.builtin.command: proxmox-backup-manager user list --output-format json
      register: pbs_entra_users
      changed_when: false
      check_mode: false

    - name: Report the Entra user creation (check mode)
      ansible.builtin.debug:
        msg: "would create PBS user {{ item }}@{{ pbs_entra_realm }}"
      changed_when: true
      loop: "{{ pbs_entra_admin_emails_effective }}"
      when:
        - ansible_check_mode
        - (pbs_entra_users.stdout | from_json
           | selectattr('userid', 'search', '(?i)^' ~ (item | regex_escape) ~ '@' ~ pbs_entra_realm ~ '$') | list | length) == 0

    - name: Create the Entra admin users (no password, OpenID only)
      ansible.builtin.command:
        argv:
          - proxmox-backup-manager
          - user
          - create
          - "{{ item }}@{{ pbs_entra_realm }}"
      changed_when: true
      loop: "{{ pbs_entra_admin_emails_effective }}"
      when:
        - not ansible_check_mode
        - (pbs_entra_users.stdout | from_json
           | selectattr('userid', 'search', '(?i)^' ~ (item | regex_escape) ~ '@' ~ pbs_entra_realm ~ '$') | list | length) == 0

    - name: Read the PBS ACLs
      ansible.builtin.command: proxmox-backup-manager acl list --output-format json
      register: pbs_entra_acls
      changed_when: false
      check_mode: false

    - name: Report the Administrator ACLs (check mode)
      ansible.builtin.debug:
        msg: "would grant Admin on / to {{ item }}@{{ pbs_entra_realm }}"
      changed_when: true
      loop: "{{ pbs_entra_admin_emails_effective }}"
      when:
        - ansible_check_mode
        - (pbs_entra_acls.stdout | from_json
           | selectattr('path', 'equalto', '/')
           | selectattr('ugid', 'search', '(?i)^' ~ (item | regex_escape) ~ '@' ~ pbs_entra_realm ~ '$')
           | selectattr('roleid', 'equalto', 'Admin') | list | length) == 0

    - name: Grant Admin on / to each Entra admin
      ansible.builtin.command:
        argv:
          - proxmox-backup-manager
          - acl
          - update
          - /
          - Admin
          - --auth-id
          - "{{ ((pbs_entra_users.stdout | from_json
                 | selectattr('userid', 'search', '(?i)^' ~ (item | regex_escape) ~ '@' ~ pbs_entra_realm ~ '$')
                 | list | default([{}], true) | first).userid | default(item ~ '@' ~ pbs_entra_realm)) }}"
      changed_when: true
      loop: "{{ pbs_entra_admin_emails_effective }}"
      when:
        - not ansible_check_mode
        - (pbs_entra_acls.stdout | from_json
           | selectattr('path', 'equalto', '/')
           | selectattr('ugid', 'search', '(?i)^' ~ (item | regex_escape) ~ '@' ~ pbs_entra_realm ~ '$')
           | selectattr('roleid', 'equalto', 'Admin') | list | length) == 0

    # Prune: a realm user who is no longer in the effective list loses the
    # Admin ACL on /. Same semantics as PVE (an explicitly empty canonical list
    # revokes everyone; an unset/legacy-empty list never prunes).
    - name: Work out the Admin ACLs to revoke
      ansible.builtin.set_fact:
        pbs_entra_revoked_acls: >-
          {{ ((pbs_entra_acls.stdout | from_json)
              | selectattr('path', 'equalto', '/')
              | selectattr('roleid', 'equalto', 'Admin')
              | selectattr('ugid', 'search', '@' ~ pbs_entra_realm ~ '$') | list)
             | zip(((pbs_entra_acls.stdout | from_json)
                    | selectattr('path', 'equalto', '/')
                    | selectattr('roleid', 'equalto', 'Admin')
                    | selectattr('ugid', 'search', '@' ~ pbs_entra_realm ~ '$') | list)
                   | map(attribute='ugid') | map('lower'))
             | rejectattr('1', 'in', pbs_entra_desired_userids)
             | map(attribute='0') | list }}
      when: pbs_entra_manage_admins | bool

    - name: Report the Admin ACL revocations (check mode)
      ansible.builtin.debug:
        msg: "would revoke Admin on / from {{ item.ugid }}"
      changed_when: true
      loop: "{{ pbs_entra_revoked_acls | default([]) }}"
      when: ansible_check_mode

    - name: Revoke Admin on / from an unlisted realm user
      ansible.builtin.command:
        argv:
          - proxmox-backup-manager
          - acl
          - update
          - /
          - Admin
          - --auth-id
          - "{{ item.ugid }}"
          - --delete
      changed_when: true
      loop: "{{ pbs_entra_revoked_acls | default([]) }}"
      when: not ansible_check_mode

    # root@pam is the last door (PAM, LAN): never let the realm work leave it disabled.
    - name: The root@pam account stays enabled (break-glass)
      ansible.builtin.assert:
        that:
          - pbs_entra_users.stdout | from_json
            | selectattr('userid', 'equalto', 'root@pam') | list | length == 1
          - pbs_entra_users.stdout | from_json
            | selectattr('userid', 'equalto', 'root@pam')
            | selectattr('enable', 'defined')
            | selectattr('enable', 'equalto', false) | list | length == 0
        fail_msg: >-
          root@pam is missing or disabled: it is the break-glass account (LAN, password + TOTP).
          Re-enable it before changing the realm.
        quiet: true

# ── storage ─────────────────────────────────────────────────────────────────
- name: ZFS dataset for the datastore (on the existing pool)
  community.general.zfs:
    name: "{{ pbs_zfs_dataset }}"
    state: present
  tags: [pbs_storage]

- name: Look up the backup user (created by the package)
  ansible.builtin.getent:
    database: passwd
    key: backup
    fail_key: false
  tags: [pbs_storage]

- name: The datastore directory belongs to the PBS service user
  ansible.builtin.file:
    path: "{{ pbs_datastore_path }}"
    state: directory
    owner: backup
    group: backup
    mode: "0750"
  when: getent_passwd['backup'] is not none
  tags: [pbs_storage]

# ── datastore, prune, GC, verify ────────────────────────────────────────────
- name: PBS configuration
  when: pbs_cli.stat.exists
  tags: [pbs_config]
  block:
    - name: Read the datastores
      ansible.builtin.command: proxmox-backup-manager datastore list --output-format json
      register: pbs_datastores
      changed_when: false
      check_mode: false

    - name: The datastore path is its own mounted ZFS dataset
      ansible.builtin.command: "findmnt -n -o FSTYPE --mountpoint {{ pbs_datastore_path }}"
      register: pbs_datastore_mount
      changed_when: false
      failed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Refuse to create a datastore on the root filesystem
      ansible.builtin.assert:
        that: pbs_datastore_mount.rc == 0 and pbs_datastore_mount.stdout | trim == 'zfs'
        fail_msg: >-
          {{ pbs_datastore_path }} is not a mounted ZFS dataset (findmnt: '{{ pbs_datastore_mount.stdout | default('') }}',
          rc {{ pbs_datastore_mount.rc | default('?') }}). Import/mount the backup pool first; never let PBS
          create a datastore on the root filesystem.
        quiet: true
      when: not ansible_check_mode

    # Tier B of docs/runbooks/dr.md: after a Proxmox reinstall the datastore CONFIG is gone but its
    # chunks are still on the imported HDD pool. PBS refuses a non-empty directory unless told to
    # reuse it, so detect the existing chunk store and pass --reuse-datastore in that one case.
    - name: Is there an existing datastore at the configured path (a rebuilt host)
      ansible.builtin.stat:
        path: "{{ pbs_datastore_path }}/.chunks"
      register: pbs_existing_chunks
      tags: [pbs_config]

    - name: Create the datastore with its GC schedule
      ansible.builtin.command: >-
        proxmox-backup-manager datastore create {{ pbs_datastore_name }} {{ pbs_datastore_path }}
        {{ '--reuse-datastore' if pbs_existing_chunks.stat.exists else '' }}
        --gc-schedule '{{ pbs_gc_schedule }}'
      when: (pbs_datastores.stdout | from_json | selectattr('name', 'equalto', pbs_datastore_name) | list | length) == 0
      changed_when: true

    - name: Align the GC schedule of an existing datastore
      ansible.builtin.command: >-
        proxmox-backup-manager datastore update {{ pbs_datastore_name }} --gc-schedule '{{ pbs_gc_schedule }}'
      when:
        - (pbs_datastores.stdout | from_json | selectattr('name', 'equalto', pbs_datastore_name) | list | length) == 1
        - >-
          (pbs_datastores.stdout | from_json | selectattr('name', 'equalto', pbs_datastore_name)
          | map(attribute='gc-schedule', default='') | first) != pbs_gc_schedule
      changed_when: true

    - name: Read the prune jobs
      ansible.builtin.command: proxmox-backup-manager prune-job list --output-format json
      register: pbs_prune_jobs
      changed_when: false
      check_mode: false

    - name: Create the prune job (keep-daily / weekly / monthly)
      ansible.builtin.command: >-
        proxmox-backup-manager prune-job create {{ pbs_prune_job_id }} --store {{ pbs_datastore_name }}
        --schedule '{{ pbs_prune_schedule }}' --keep-daily {{ pbs_prune_keep_daily }}
        --keep-weekly {{ pbs_prune_keep_weekly }} --keep-monthly {{ pbs_prune_keep_monthly }}
      when: (pbs_prune_jobs.stdout | from_json | selectattr('id', 'equalto', pbs_prune_job_id) | list | length) == 0
      changed_when: true

    - name: Align an existing prune job
      ansible.builtin.command: >-
        proxmox-backup-manager prune-job update {{ pbs_prune_job_id }} --store {{ pbs_datastore_name }}
        --schedule '{{ pbs_prune_schedule }}' --keep-daily {{ pbs_prune_keep_daily }}
        --keep-weekly {{ pbs_prune_keep_weekly }} --keep-monthly {{ pbs_prune_keep_monthly }}
      vars:
        pbs_prune_current: "{{ pbs_prune_jobs.stdout | from_json | selectattr('id', 'equalto', pbs_prune_job_id) | list | first | default({}) }}"
      when:
        - pbs_prune_current | length > 0
        - >-
          (pbs_prune_current['keep-daily'] | default(0) | int != pbs_prune_keep_daily) or
          (pbs_prune_current['keep-weekly'] | default(0) | int != pbs_prune_keep_weekly) or
          (pbs_prune_current['keep-monthly'] | default(0) | int != pbs_prune_keep_monthly) or
          (pbs_prune_current['schedule'] | default('') != pbs_prune_schedule)
      changed_when: true

    - name: Read the verify jobs
      ansible.builtin.command: proxmox-backup-manager verify-job list --output-format json
      register: pbs_verify_jobs
      changed_when: false
      check_mode: false

    - name: Create the weekly verify job
      ansible.builtin.command: >-
        proxmox-backup-manager verify-job create {{ pbs_verify_job_id }} --store {{ pbs_datastore_name }}
        --schedule '{{ pbs_verify_schedule }}' --ignore-verified true
        --outdated-after {{ pbs_verify_outdated_after_days }}
      when: (pbs_verify_jobs.stdout | from_json | selectattr('id', 'equalto', pbs_verify_job_id) | list | length) == 0
      changed_when: true

# ── the identity PVE uses ───────────────────────────────────────────────────
- name: PBS user, ACLs and API token for PVE
  when: pbs_cli.stat.exists
  tags: [pbs_identity]
  block:
    - name: Read the PBS users
      ansible.builtin.command: proxmox-backup-manager user list --output-format json
      register: pbs_users
      changed_when: false
      check_mode: false

    - name: Create the PBS user with no password, API token only
      ansible.builtin.command: "proxmox-backup-manager user create {{ pbs_pve_user }}"
      when: (pbs_users.stdout | from_json | selectattr('userid', 'equalto', pbs_pve_user) | list | length) == 0
      changed_when: true

    - name: Read the ACLs
      ansible.builtin.command: proxmox-backup-manager acl list --output-format json
      register: pbs_acls
      changed_when: false
      check_mode: false

    - name: Grant DatastoreBackup on the datastore to the user
      ansible.builtin.command: >-
        proxmox-backup-manager acl update /datastore/{{ pbs_datastore_name }} {{ pbs_pve_role }} --auth-id {{ pbs_pve_user }}
      when: >-
        (pbs_acls.stdout | from_json
        | selectattr('path', 'equalto', '/datastore/' ~ pbs_datastore_name)
        | selectattr('ugid', 'equalto', pbs_pve_user)
        | selectattr('roleid', 'equalto', pbs_pve_role) | list | length) == 0
      changed_when: true

    - name: Read the tokens of the user
      ansible.builtin.command: "proxmox-backup-manager user list-tokens {{ pbs_pve_user }} --output-format json"
      register: pbs_tokens
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Is a token still to be created?
      ansible.builtin.set_fact:
        pbs_token_missing: >-
          {{ (pbs_tokens.rc != 0) or
             ((pbs_tokens.stdout | from_json | selectattr('tokenid', 'equalto', pbs_pve_user ~ '!' ~ pbs_pve_token_name) | list | length) == 0) }}

    # The secret exists once, at creation. Ansible never creates it: `op` with 1Password app integration only works
    # in the owner's own terminal, not in a subprocess Ansible starts. The owner runs the printed pipe (PBS API ->
    # jq -> op item create, secret only in memory), then re-runs this role, which grants the ACL.
    - name: Stop until the owner has created the token (ansible/README.md, "PBS API token")
      ansible.builtin.fail:
        msg: >-
          API token {{ pbs_pve_user }}!{{ pbs_pve_token_name }} does not exist. Create it from your own terminal with
          the pipe in ansible/README.md ("PBS API token": PBS API, jq, op item create into vault
          {{ pbs_onepassword_vault }} as "{{ pbs_onepassword_item_title }}"), then re-run this role.
      when:
        - pbs_token_missing | bool
        - not ansible_check_mode

    - name: Grant DatastoreBackup on the datastore to the token
      ansible.builtin.command: >-
        proxmox-backup-manager acl update /datastore/{{ pbs_datastore_name }} {{ pbs_pve_role }}
        --auth-id {{ pbs_pve_user }}!{{ pbs_pve_token_name }}
      # After the token exists: PBS refuses an ACL for a token it does not know ("no such API token").
      when:
        - not (pbs_token_missing | bool)
        - >-
          (pbs_acls.stdout | from_json
            | selectattr('path', 'equalto', '/datastore/' ~ pbs_datastore_name)
            | selectattr('ugid', 'equalto', pbs_pve_user ~ '!' ~ pbs_pve_token_name)
            | selectattr('roleid', 'equalto', pbs_pve_role) | list | length) == 0
      changed_when: true

    - name: Report that a token is still missing (check mode)
      ansible.builtin.debug:
        msg: "API token {{ pbs_pve_user }}!{{ pbs_pve_token_name }} does not exist yet."
      when:
        - pbs_token_missing | bool
        - ansible_check_mode

# ── what OpenTofu needs next ────────────────────────────────────────────────
- name: Read the PBS certificate fingerprint
  ansible.builtin.command: proxmox-backup-manager cert info
  register: pbs_cert_info
  changed_when: false
  check_mode: false
  when: pbs_cli.stat.exists
  tags: [pbs_fingerprint]

- name: Show the fingerprint (not a secret) for the OpenTofu variable
  ansible.builtin.debug:
    msg: "{{ pbs_cert_info.stdout_lines | select('search', '(?i)fingerprint') | list }}"
  when: pbs_cli.stat.exists
  tags: [pbs_fingerprint]
