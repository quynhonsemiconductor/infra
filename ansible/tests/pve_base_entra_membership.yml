---
# Offline regression check for the PVE Entra membership/offboarding expressions.
# It includes the ROLE'S OWN vars/entra_membership.yml (not a re-implementation),
# so the test and the role cannot drift.
#
# The original bug: `selectattr('userid', 'match', '@entra$')` anchors at the
# START (Jinja match == re.match), so it matched nothing and offboarding never
# removed an account. The shared expression uses `search`.
- name: PVE Entra membership selectors
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    pve_base_entra_realm: entra
    pve_base_entra_group_id: g-entra
    pve_base_entra_admin_emails: ["bob@example.com"]
    # alice is no longer listed; bob is; carol is a suffix decoy; root is PAM.
    sim_users:
      - userid: "alice@example.com@entra"
        groups: "g-entra"
      - userid: "bob@example.com@entra"
        groups: "g-entra,other"
      - userid: "carol@example.com@entra-other"
        groups: ""
      - userid: "root@pam"
        groups: ""
    pve_base_entra_users:
      stdout: "{{ sim_users | to_json }}"
  tasks:
    - name: Load the role's own membership expressions
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/pve_base/vars/entra_membership.yml"

    - name: The role's selector matches by suffix and drops the removed admin
      ansible.builtin.assert:
        that:
          - pve_base_entra_realm_users | map(attribute='userid') | list == ['alice@example.com@entra', 'bob@example.com@entra']
          - pve_base_entra_removed_users | map(attribute='userid') | list == ['alice@example.com@entra']
          # the OLD filter (match) selects nothing: this is the regression guard
          - (sim_users | selectattr('userid', 'match', '@' ~ pve_base_entra_realm ~ '$') | list | length) == 0
        quiet: true

    - name: The removed account loses the admin group but keeps other groups
      ansible.builtin.set_fact:
        sim_alice_groups: >-
          {{ (pve_base_entra_removed_users | selectattr('userid', 'equalto', 'alice@example.com@entra') | first).groups
             | split(',') | map('trim') | reject('equalto', '')
             | reject('equalto', pve_base_entra_group_id) | join(',') }}
        sim_bob_groups: >-
          {{ (sim_users | selectattr('userid', 'equalto', 'bob@example.com@entra') | first).groups
             | split(',') | map('trim') | reject('equalto', '')
             | reject('equalto', pve_base_entra_group_id) | join(',') }}

    - name: Group removal leaves alice without the admin group
      ansible.builtin.assert:
        that:
          - pve_base_entra_group_id not in sim_alice_groups.split(',')
          - sim_bob_groups == 'other'
        quiet: true

    # An EXPLICITLY empty list must still prune (unset is different: that is the
    # PVE-only inventory case and is asserted by the role's manage_admins gate).
    - name: An explicit empty admin list prunes every realm user
      ansible.builtin.set_fact:
        pve_base_entra_admin_emails: []
        pve_base_entra_users:
          stdout: "{{ sim_users | to_json }}"

    - name: Re-evaluate the shared expressions with an empty list
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/pve_base/vars/entra_membership.yml"

    - name: Both realm users are now removed from the admin group
      ansible.builtin.assert:
        that:
          - pve_base_entra_removed_users | map(attribute='userid') | list == ['alice@example.com@entra', 'bob@example.com@entra']
        quiet: true
