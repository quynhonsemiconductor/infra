# Ansible for the OS/config layer of the on-prem hosts and VMs (docs/runbooks/host-config-inventory.md).
# Run from this directory. The inventory is a LOCAL, git-ignored file: inventory/example/ shows its shape.
[defaults]
inventory            = inventory/local/hosts.yml
roles_path           = roles
collections_path     = .collections
host_key_checking    = True
retry_files_enabled  = False
interpreter_python   = auto_silent
result_format        = yaml
nocows               = True
forks                = 5
timeout              = 30
# facts are cached for the run only; nothing is written to disk
gathering            = smart

[ssh_connection]
pipelining = True
