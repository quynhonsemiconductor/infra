---
# ai-01: NVIDIA driver and toolkit, k3s agent join. The join token is read from the environment of the run:
#   op run --env-file=<local template> -- ansible-playbook k3s-agent-gpu.yml --check --diff
- name: Join the GPU node to k3s
  hosts: k3s_agent_gpu
  become: true
  gather_facts: true
  serial: 1
  roles:
    - role: k3s_agent_gpu
      tags: [k3s_agent_gpu]
