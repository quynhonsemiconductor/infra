# =============================================================================
# Secret and credential expiry · weekly
#
# The one check the estate cited in three places and never had. It reads Key Vault secret
# METADATA (Key Vault Reader, never a value) and Entra app credential METADATA (Directory Readers),
# with the read-only CI identity that already federates `ref:refs/heads/main`:
#
#   * FAIL (red run) when a prod/platform secret has no expiry, a credential is expired or expires
#     within 7 days, or its end date is unreadable;
#   * WARN (green run, Teams card) when anything expires within 30 days, or a dev vault secret has
#     no expiry yet;
#   * exit 2 (red, "could not run") when a vault or Graph cannot be read: a check that could not run
#     never reads as a check that passed.
#
# The read-only backfill for owners is scripts/owner/backfill-kv-expiry.sh (never run in CI).
# =============================================================================
name: Secret and credential expiry

on:
  schedule:
    # Monday 02:17 UTC = 09:17 Asia/Ho_Chi_Minh, after the nightly jobs and before the workday.
    - cron: '17 2 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/secret_expiry.py'
      - 'scripts/test_secret_expiry.py'
      - 'scripts/owner/backfill-kv-expiry.sh'
      - '.github/workflows/secret-expiry.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/secret_expiry.py'
      - 'scripts/test_secret_expiry.py'
      - 'scripts/owner/backfill-kv-expiry.sh'
      - '.github/workflows/secret-expiry.yml'

permissions:
  contents: read

concurrency:
  group: secret-expiry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests and shellcheck
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Unit tests (stdlib only)
        run: python3 -m unittest scripts/test_secret_expiry.py -v

      - name: shellcheck the owner backfill script
        run: shellcheck scripts/owner/backfill-kv-expiry.sh

  check:
    name: Weekly expiry check
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write     # Azure OIDC: read identity, subject ref:refs/heads/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No azure/login action: one federated token exchange is all this needs, and every `uses:`
      # in this repository is SHA-pinned.
      - name: Azure login (read identity, OIDC)
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_READ }}
          AZURE_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r .value)"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::no federated token"; exit 1
          fi
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none

      - name: Check Key Vault and Entra expiry
        id: check
        continue-on-error: true
        run: python3 scripts/secret_expiry.py --markdown expiry.md --json expiry.json

      - name: Publish the report to the run summary
        if: ${{ always() }}
        env:
          # Passed through the environment, never interpolated into the shell:
          # a step outcome is runner-controlled today, but ${{ }} in a run
          # block is the injection shape zizmor flags (and a future change to
          # a step output would make it real).
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          if [ -f expiry.md ]; then cat expiry.md >> "$GITHUB_STEP_SUMMARY"; else
            echo "## Secret and credential expiry" >> "$GITHUB_STEP_SUMMARY"
            echo "The check did not produce a report (exit ${CHECK_OUTCOME})." >> "$GITHUB_STEP_SUMMARY"
          fi

      # TEAMS_ALERTS_WEBHOOK_URL is a Teams Workflows webhook: the body must be an Adaptive Card
      # (a plain {"text": ...} is silently dropped). The run summary is the durable copy.
      - name: Post findings to the platform Teams channel
        if: ${{ always() }}
        env:
          WEBHOOK: ${{ secrets.TEAMS_ALERTS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK" ]; then echo "::warning::TEAMS_ALERTS_WEBHOOK_URL is not set; only the run summary has this"; exit 0; fi
          payload="$(python3 - <<'PY'
          import json, os
          try:
              report = json.load(open("expiry.json", encoding="utf-8"))
          except Exception:
              report = None
          if report:
              c = report["counts"]
              title = "Credential expiry: attention needed"
              facts = [
                  ("URGENT (<=7d or expired)", str(report.get("urgent", 0))),
                  ("FAIL", str(c["FAIL"])),
                  ("WARN", str(c["WARN"])),
                  ("OK", str(c["OK"])),
              ]
              text = (
                  "A credential is expired or expires within 7 days (FAIL), or within 30 days (WARN), "
                  "or a prod/platform Key Vault secret has no expiry."
              )
          else:
              title = "Credential expiry check could not run"
              facts = [("Result", "no report; see the run")]
              text = "A Key Vault or Graph call failed. An unrun check is not a passing check."
          card = {
              "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
              "type": "AdaptiveCard",
              "version": "1.4",
              "body": [
                  {"type": "TextBlock", "size": "Medium", "weight": "Bolder", "wrap": True, "text": title},
                  {"type": "FactSet", "facts": [{"title": k, "value": v} for k, v in facts]},
                  {"type": "TextBlock", "wrap": True, "isSubtle": True, "text": text},
              ],
              "actions": [{"type": "Action.OpenUrl", "title": "Open the run", "url": os.environ["RUN_URL"]}],
          }
          print(json.dumps({"type": "message",
                            "attachments": [{"contentType": "application/vnd.microsoft.card.adaptive",
                                             "contentUrl": None, "content": card}]}))
          PY
          )"
          # Skip the card on a clean week: every scheduled run posting "0 FAIL" is noise. A missing or
          # unreadable report is NOT clean and still posts (the check could not run).
          if [ -f expiry.json ]; then
            counts="$(python3 -c 'import json; d=json.load(open("expiry.json")); print(d["counts"]["FAIL"] + d["counts"]["WARN"])' 2>/dev/null || echo unknown)"
            if [ "$counts" = "0" ]; then echo "nothing to report"; exit 0; fi
          fi
          curl -fsS --max-time 20 -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK" >/dev/null \
            || echo "::warning::Teams post failed; the run summary still has the findings"

      - name: Fail the run on a FAIL or a collection error
        if: ${{ steps.check.outcome == 'failure' }}
        run: exit 1
