name: ansible-lint

# Lints and syntax-checks ansible/ with the pinned versions in ansible/requirements-dev.txt.
# CI NEVER runs a playbook against a host: it has no inventory, no credentials and no route to the admin door.
# Not a required check until the SA promotes it.
on:
  pull_request:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-lint.yml"
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    name: ansible-lint and syntax-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install the pinned tools and collections
        run: |
          python -m pip install --quiet -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml -p .collections

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax-check every playbook against the example inventory
        run: |
          set -euo pipefail
          for pb in *.yml; do
            case "$pb" in requirements.yml) continue ;; esac
            echo "::group::$pb"
            ansible-playbook -i inventory/example/hosts.yml --syntax-check "$pb"
            echo "::endgroup::"
          done

      # Offline unit check of the PVE Entra offboarding selectors (match vs
      # search: a realm user must actually be selected). No host, no cloud.
      - name: PVE Entra membership selector unit check
        run: ansible-playbook -i localhost, -c local tests/pve_base_entra_membership.yml
      # The LAST listed account being removed must still be offboarded. Runs
      # --check with /tmp paths and asserts the report line; writes nothing.
      - name: SSH offboarding survives an empty admin list (--check)
        shell: bash
        run: |
          set -euo pipefail
          out=$(ansible-playbook -i localhost, -c local --check tests/ssh_infra_last_account.yml)
          printf '%s\n' "$out"
          grep -q "would lock daemon" <<<"$out"

      # Real lifecycle: create -> offboard -> re-add, all through the role.
      # Asserts shadow states (!* then *), expiry, artefacts and sessions.
      - name: SSH lifecycle (create -> offboard -> re-add; real)
        shell: bash
        run: |
          set -euo pipefail
          trap 'sudo userdel -r qnsc-test-admin 2>/dev/null || true; sudo rm -rf /tmp/qnsc-ssh-cycle' EXIT
          sudo rm -rf /tmp/qnsc-ssh-cycle
          if ! out=$(ansible-playbook -i localhost, -c local tests/ssh_infra_cycle.yml 2>&1); then
            printf '%s\n' "$out"; exit 1
          fi
          printf '%s\n' "$out"

      # The LAST listed account being removed must still be offboarded. Runs
      # --check with /tmp paths and asserts the report line; writes nothing.
      - name: SSH offboarding survives an empty admin list (--check)
        shell: bash
        run: |
          set -euo pipefail
          out=$(ansible-playbook -i localhost, -c local --check tests/ssh_infra_last_account.yml)
          printf '%s\n' "$out"
          grep -q "would lock daemon" <<<"$out"

      # Re-adding an offboarded account (locked + expired) must clear the lock
      # and expiry for real. --check first, then a real run on /tmp paths;
      # asserts passwd/chage state and that the account is not locked.
      - name: SSH re-add path (check + real)
        shell: bash
        run: |
          set -euo pipefail
          trap 'sudo userdel -r qnsc-test-admin 2>/dev/null || true; sudo rm -rf /tmp/qnsc-ssh-readd' EXIT
          sudo useradd -m qnsc-test-admin
          sudo usermod -L -e 1 qnsc-test-admin
          sudo mkdir -p /tmp/qnsc-ssh-readd
          printf 'qnsc-test-admin\n' | sudo tee /tmp/qnsc-ssh-readd/marker >/dev/null
          if ! out=$(ansible-playbook -i localhost, -c local --check tests/ssh_infra_readd.yml 2>&1); then
            printf '%s\n' "$out"; exit 1
          fi
          printf '%s\n' "$out"
          if ! out=$(ansible-playbook -i localhost, -c local tests/ssh_infra_readd.yml 2>&1); then
            printf '%s\n' "$out"; exit 1
          fi
          printf '%s\n' "$out"
          shadow=$(sudo getent shadow qnsc-test-admin | cut -d: -f2)
          [ "$shadow" = "*" ] || { echo "shadow field is '$shadow', expected exactly '*'"; exit 1; }
          sudo chage -l qnsc-test-admin | grep -qi '^Account expires.*never' \
            || { sudo chage -l qnsc-test-admin; echo "expiry was not cleared"; exit 1; }
