name: ansible-lint

# Lints and syntax-checks ansible/ with the pinned versions in ansible/requirements-dev.txt.
# CI NEVER runs a playbook against a host: it has no inventory, no credentials and no route to the admin door.
# Not a required check until the SA promotes it.
on:
  pull_request:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-lint.yml"
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    name: ansible-lint and syntax-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install the pinned tools and collections
        run: |
          python -m pip install --quiet -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml -p .collections

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax-check every playbook against the example inventory
        run: |
          set -euo pipefail
          for pb in *.yml; do
            case "$pb" in requirements.yml) continue ;; esac
            echo "::group::$pb"
            ansible-playbook -i inventory/example/hosts.yml --syntax-check "$pb"
            echo "::endgroup::"
          done

      # Offline unit check of the PVE Entra offboarding selectors (match vs
      # search: a realm user must actually be selected). No host, no cloud.
      - name: PVE Entra membership selector unit check
        run: >-
          ansible-playbook -i localhost, -c local
          tests/pve_base_entra_membership.yml tests/pve_base_entra_gate.yml tests/pbs_entra_gate.yml
      # The PBS version read, against the EXACT `versions --output-format json` the PVE host returned: the entry
      # is keyed `Package` and the running version lives in ExtraInfo. The role and this test include the
      # same vars/version.yml.
      - name: PBS version expression (offline test)
        run: ansible-playbook -i localhost, -c local tests/pbs_version.yml

      # A tag must run on its own. `--tags pbs_offsite` died on "pbs_cli is undefined" because the
      # stat task registering it was tagged [pbs_install] only (owner run 2026-11-06). The role is
      # included normally here; the tag filter is on the command line, exactly as the owner runs it.
      - name: pbs role tags run on their own (--check)
        run: |
          set -euo pipefail
          for tag in pbs_offsite pbs_identity pbs_fingerprint; do
            echo "::group::--tags $tag"
            ansible-playbook -i localhost, -c local --check tests/pbs_tagged_run.yml --tags "$tag"
            echo "::endgroup::"
          done

      # The LAST listed account being removed must still be offboarded. Uses a
      # throwaway account (never a system account) and --check only.

      - name: SSH offboarding survives an empty admin list (--check)
        shell: bash
        run: |
          set -euo pipefail
          trap 'sudo userdel -r qnsc-last-account 2>/dev/null || true; sudo rm -rf /tmp/qnsc-ssh-last' EXIT
          sudo useradd -m qnsc-last-account
          sudo mkdir -p /tmp/qnsc-ssh-last
          printf 'qnsc-last-account\n' | sudo tee /tmp/qnsc-ssh-last/marker >/dev/null
          out=$(ansible-playbook -i localhost, -c local --check tests/ssh_infra_last_account.yml 2>&1)
          printf '%s\n' "$out"
          grep -q "would lock qnsc-last-account" <<<"$out"



      # Real lifecycle: create -> offboard -> re-add, all through the role.
      - name: SSH lifecycle (create -> offboard -> re-add; real)
        shell: bash
        run: |
          set -euo pipefail
          trap 'sudo userdel -r qnsc-test-admin 2>/dev/null || true; sudo rm -rf /tmp/qnsc-ssh-cycle' EXIT
          sudo rm -rf /tmp/qnsc-ssh-cycle
          if ! out=$(ansible-playbook -i localhost, -c local tests/ssh_infra_cycle.yml 2>&1); then
            printf '%s\n' "$out"; exit 1
          fi
          printf '%s\n' "$out"
