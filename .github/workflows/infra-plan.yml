# =============================================================================
# Infrastructure · Plan — dry-run on every PR to main.
# (OpenTofu under the hood — named by capability, not tool.)
# A `detect` job diffs the PR and plans only the live/ stacks it touches (a
# change under modules/ or to this workflow plans every stack). A `tofu fmt`
# job gates formatting drift across the whole tree.
# =============================================================================
name: Infrastructure · Plan

on:
  pull_request:
    # NO `branches:` filter here, deliberately — see `push` above, which keeps one.
    #
    # On `pull_request` this filter matches the PR's BASE branch, which is a different
    # question from `push`'s. Set to [main] it means "only run when this PR is aimed at
    # main", so a PR aimed anywhere else — a stacked PR, aimed at the branch below it —
    # got no CI at all, silently, while still reporting green. rova's eight-PR Phase 7
    # stack sat in exactly that state: seven of eight ran nothing but PR-title and labeler.
    #
    # `main` is this repo's only long-lived branch, so the filter skipped nothing anyone
    # wanted skipped. No upside, one silent failure mode.
permissions:
  contents: read

env:
  TOFU_VERSION: "1.9.1"
  AWS_REGION: ap-southeast-1

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Detect which live/ stacks this PR touches → we plan only those. A change
  # under modules/ (shared) or to this workflow plans every stack. Keeps
  # unrelated PRs fast and avoids planning stacks whose inputs aren't wired.
  # ───────────────────────────────────────────────────────────────────────
  detect:
    name: Detect changed stacks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stacks: ${{ steps.changes.outputs.stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute stack matrix
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          CHANGED="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          echo "Changed files:"; echo "$CHANGED"
          # ── THE STACK LIST IS THE DISK, NOT A LITERAL ─────────────────────
          # It used to be a hardcoded list, written twice (here and in
          # infra-apply.yml). SIX stacks on disk were absent from it — cluster-dev,
          # cluster-prod, data-dev, data-prod, kb/dev and `organization`, the last
          # of which predates the EKS work entirely — so a pull request touching
          # only those produced `stacks=[]`, the plan job skipped, and `Plan
          # required` went green with NO PLAN IN IT.
          #
          # That is the failure this workflow's own history names: a required gate
          # that passes by not running is worse than one that fails. Nothing warned,
          # because a list is only wrong relative to a fact nobody compared it to.
          #
          # `-name '*.tf'` is the definition of a stack, so `live/kb/` — a parent
          # holding only subdirectories — is correctly not one, and a nested stack
          # at any depth IS.
          # Portable on purpose — no `-printf` (GNU-only) and no `mapfile` (bash 4+,
          # so absent on a macOS laptop). Someone working out why a stack did not
          # plan should be able to run these three lines by hand, and a debugging
          # aid that only works on the runner is not one.
          FOUND=$(find live -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; \
                    | sed 's|^live/||' | sort -u)

          # Stacks that CANNOT plan yet, each with the reason. A stack is excluded
          # here or it is planned — there is no third state, and the check below
          # makes sure of it.
          #
          # Each entry names what must change to remove it. Every one of these was
          # ALREADY broken — they were simply never planned, so nothing said so.
          #
          # The first two are an APPLY ORDER, not a defect, and reading them in
          # order gives you the order:
          #
          #       cluster-prod  ->  cluster-dev  ->  kb/dev
          #
          #   cluster-dev   reads cluster-prod's state for `argocd_role_arn`. §2
          #                 makes ArgoCD hub-and-spoke — ONE instance, in prod,
          #                 managing both clusters — so prod holds the role and dev
          #                 grants it entry. cluster-prod plans cleanly today and
          #                 has simply never been applied.
          #
          #   kb/dev        reads cluster-dev and data-dev. data-dev plans and
          #                 applies independently; cluster-dev is the one in the
          #                 chain above. §17 migrates one product at a time, so
          #                 this is expected, not broken.
          #
          #   observability `the Grafana client is required for this resource`, on
          #                 grafana_folder.company and data.grafana_data_source
          #                 .prometheus. NOT a missing secret — the plan job has
          #                 passed TF_VAR_grafana_cloud_api_key since before this
          #                 list existed. Those resources use the `grafana.stack`
          #                 provider ALIAS, whose url and auth are
          #                 `grafana_cloud_stack.qnsc.url` and
          #                 `grafana_cloud_stack_service_account_token.alerting.key`
          #                 — attributes of resources in the same stack. Until
          #                 those exist they are unknown, so the aliased provider
          #                 cannot be configured and every resource under it fails.
          #                 A provider configured from a resource it plans
          #                 alongside; the fix is to split the stack or apply in
          #                 two phases, not to add a credential.
          #
          #   organization  AccessDenied on sso:DescribePermissionSet,
          #                 organizations:ListAccounts and
          #                 organizations:DescribePolicy, as qnsc-github-infra-plan.
          #
          #                 CAUSE NOT ESTABLISHED, and stated that way on purpose:
          #                 that role carries AWS-managed ReadOnlyAccess, which
          #                 already allows organizations:List*/Describe* and
          #                 sso:Describe*, so "the role is missing the action" does
          #                 not survive a look at the policy. The SSO message says
          #                 "the resource does not exist in this Region", and both
          #                 Organizations and Identity Center are scoped in ways a
          #                 region-pinned provider can miss — the stack pins
          #                 ap-southeast-1 while an Identity Center instance lives
          #                 in one home region, and some Organizations calls answer
          #                 only in the management account.
          #
          #                 Verifying needs credentials this checkout does not
          #                 have. Naming a cause that turns out to be wrong costs
          #                 the next person an afternoon — see observability above,
          #                 where exactly that happened.
          #
          # Keeping them here rather than dropping the derivation: `data-dev` and
          # `data-prod` plan cleanly today and never did before, any NEW stack is
          # planned by default, and each gap above is now named in code instead of
          # being absent from a list nobody compared to anything.
          NOT_PLANNABLE="kb/dev cluster-dev observability organization"

          SKIPPED=""
          PLANNABLE=""
          for s in $FOUND; do
            skip=0
            for n in $NOT_PLANNABLE; do [ "$s" = "$n" ] && skip=1; done
            if [ "$skip" = 1 ]; then SKIPPED="$SKIPPED $s"; else PLANNABLE="$PLANNABLE $s"; fi
          done
          # An `if`, not `[ -n "$X" ] && echo`: under `set -e` that chain returns 1
          # when SKIPPED is empty and aborts the step — the detector would fail the
          # moment the exclusion list became empty, which is the SUCCESS case.
          if [ -n "$SKIPPED" ]; then
            echo "::notice::not planned (declared unplannable):$SKIPPED"
          fi

          # A shared/module or workflow change affects every stack.
          if echo "$CHANGED" | grep -qE '^(modules/|\.github/workflows/infra-plan\.yml$)'; then
            SEL=""
            for s in $PLANNABLE; do SEL="$SEL\"$s\","; done
            echo "stacks=[${SEL%,}]" >> "$GITHUB_OUTPUT"; exit 0
          fi

          SEL=""
          for s in $PLANNABLE; do
            if echo "$CHANGED" | grep -qE "^live/$s/"; then SEL="$SEL\"$s\","; fi
          done
          echo "stacks=[${SEL%,}]" >> "$GITHUB_OUTPUT"

  fmt:
    # The job NAME is the required-check name on main. It must not change, which
    # is why this uses a COMPOSITE action: a reusable workflow would report as
    # `fmt / <inner job>` and the required check `tofu fmt check` would never
    # report again — and a required check that never reports blocks every merge.
    name: tofu fmt check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # No AWS, and no `id-token: write` above. This job used to assume
      # qnsc-github-infra-plan via setup-tofu-aws in order to run a FORMATTER — a
      # cloud role held by a job that reads no cloud state and calls no cloud API.
      # The credential was granted because the shared setup action requires one,
      # not because the work did. iac-lint installs tofu and nothing else.
      - uses: quynhonsemiconductor/ci/actions/iac-lint@v1
        with:
          tofu-version: ${{ env.TOFU_VERSION }}
          fmt: 'true'

  # ───────────────────────────────────────────────────────────────────────
  # tflint — NOT a required check yet, deliberately.
  #
  # This repo has never run tflint; tf-modules is the only one that has. The
  # findings here are therefore unknown, and making it required in the same
  # change that introduces it would risk blocking main on rules nobody has read.
  # It reports under its own name first; promote it in the ruleset once the
  # output is triaged — the same sequencing the checkov baseline used.
  #
  # `validate` stays OFF here on purpose: this repo's stacks have real backends,
  # so validate needs credentials and already runs beside `tofu plan` in the plan
  # job below. Only the credential-free gates belong in this job.
  # ───────────────────────────────────────────────────────────────────────
  tflint:
    name: tflint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/iac-lint@v1
        with:
          tofu-version: ${{ env.TOFU_VERSION }}
          fmt: 'false'
          tflint: 'true'
          # `live/*/ live/*/*/` reaches a NESTED stack — live/kb/dev, which no CI
          # job had ever seen. The second pattern necessarily also matches
          # live/kb/, a parent holding only subdirectories; iac-lint skips a
          # directory with no *.tf as of ci 1.19.0, which is what makes this
          # expressible at all.
          dirs: 'live/*/ live/*/*/'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  plan:
    name: Plan ${{ matrix.stack }}
    needs: detect
    if: needs.detect.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job needs the OIDC role assume (plan) and PR comment (post
    # plan). detect/fmt stay at the workflow default (contents: read).
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    # NOTE: intentionally NO `environment:` here. The infra-plan role's OIDC
    # trust is scoped to pull_request / main subjects; adding an environment
    # would flip the token subject to `environment:<name>` and break AssumeRole
    # once the current wildcard trust is tightened to the module defaults.
    # Plan is read-only, so no reviewer gate is needed anyway.
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.detect.outputs.stacks) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: module-token
        continue-on-error: true
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          repositories: tf-modules

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@v1
        with:
          role-arn:     arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-plan
          aws-region:   ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}
          git-token:    ${{ steps.module-token.outputs.token }}

      - name: tofu init
        working-directory: live/${{ matrix.stack }}
        run: tofu init -input=false

      - name: tofu validate
        working-directory: live/${{ matrix.stack }}
        run: tofu validate

      - name: tofu plan
        id: plan
        working-directory: live/${{ matrix.stack }}
        run: |
          # The infra-plan OIDC role is read-only and has no DynamoDB write
          # permission, so it cannot acquire the state lock. Plan never mutates
          # state, so run lock-free (apply still locks via the admin apply role).
          # PIPESTATUS[0] captures tofu's real exit past the `tee` pipe.
          set +e
          tofu plan -input=false -lock=false -no-color -detailed-exitcode -out=tfplan 2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          # Stack-specific inputs. Vars a stack doesn't declare are ignored
          # (tofu just warns), so passing the full set to every stack is safe.
          TF_VAR_cloudflare_zone_id:    ${{ vars.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_api_token:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_grafana_cloud_api_key: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
          TF_VAR_teams_webhook_url:     ${{ secrets.TEAMS_ALERTS_WEBHOOK_URL }}

      - name: Post plan comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          STACK: ${{ matrix.stack }}
        with:
          script: |
            const fs = require('fs');
            const stack = process.env.STACK;
            const plan = fs.readFileSync(`live/${stack}/plan.txt`, 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n... (truncated)'
              : plan;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Infrastructure Plan — \`live/${stack}\`\n\`\`\`hcl\n${truncated}\n\`\`\``,
            });

      # -detailed-exitcode: 0=no change, 2=changes (both OK for a PR), 1=error.
      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  # ── The aggregate gate ──────────────────────────────────────────────────────
  # `Plan required` is THE required check for this workflow. It exists because GitHub counts a
  # SKIPPED or CANCELLED required check as PASSING, so naming each job in the ruleset
  # cannot catch a job that never ran — the failure mode behind opshub #110 (a title edit
  # cancelled the real run; the replacement skipped every heavy job and went green) and
  # rova #558-#590 (a base-branch filter skipped both CI workflows for stacked PRs, leaving
  # five PRs on 5/5 green with no tests, build, E2E or security scan).
  #
  # `if: always()` is mandatory — without it the gate skips as soon as a dependency fails
  # and inherits the very bug it closes. A cancelled WORKFLOW cancels the gate rather than
  # failing it, so a run superseded by `cancel-in-progress` leaves no red check behind.
  #
  # `needs` MUST list every job that is expected to run. A job outside `needs` is a job
  # outside the gate.
  #
  # allow-skipped IS set here, and it is the only repo in the org that gets it.
  # `plan` is a matrix job gated on `needs.detect.outputs.stacks != '[]'`, so it
  # legitimately does not run when a PR touches no stack — and its check name is
  # dynamic (`Plan <stack>`), so it can never be a required check on its own.
  # 
  # The trade is deliberate. Including `plan` with allow-skipped means a FAILED
  # plan fails this gate, which is the outcome that matters for infrastructure:
  # without it a broken plan could merge, because no required check carries its
  # name. The cost is that a skipped `detect`/`fmt`/`tflint` would also pass —
  # acceptable only because none of those three is conditional: this workflow has
  # no paths filter and none of them carries an `if:`. If that ever changes, split
  # this into a strict gate over the unconditional jobs plus a lenient one over
  # `plan`, rather than leaving the leniency to cover everything.
  ci-required:
    name: Plan required
    if: always()
    needs: [detect, fmt, tflint, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: quynhonsemiconductor/ci/actions/assert-jobs-succeeded@v1
        with:
          results: ${{ join(needs.*.result, ',') }}
          allow-skipped: 'true'
