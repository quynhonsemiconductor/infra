# =============================================================================
# Security · Leak guard — this repo is PUBLIC ON PURPOSE, and the boundary is
# enforced by pattern, not by memory.
#
# The shared ci action (v1.27.0, deterministic — no model, no network) scans
# the current TREE (not history — gitleaks owns history, for secrets) for the
# names that must never land here: qnsc.vn hostnames and mail addresses, GUIDs,
# private addresses, plus the org's Entra tenant GUID, fed at runtime from org
# variables and reported with the value REDACTED (this repo's Actions logs are
# public). The AWS account id is deliberately NOT armed (policy 2026-10-29:
# the account closes after the AWS cutover; fixtures use 111111111111). The
# Azure subscription id is TIER 1 and armed from vars: a finding can never be
# allowlisted — the value is removed from the tree.
#
# Allowlist: .github/leak-guard-allowlist.txt — v2 entry kinds (key: scopes
# for identifier findings, literal file paths and text regexes for the rest;
# no directory scopes). The triage is in the PRs that added/adapted it;
# anything genuinely internal must be FIXED, never added.
#
# The job NAME is the required-check name on main; it must not change.
# =============================================================================
name: Security · Leak guard

on:
  push:
    branches: [main]
  pull_request:
    # NO `branches:` filter here, deliberately — same reasoning as
    # security.yml: a bare `pull_request:` runs for every PR target, so a
    # stacked PR never sits silently un-checked.

concurrency:
  group: leak-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  leak-guard:
    name: leak-guard (public-repo patterns)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1 # tree scan, not history

      - uses: quynhonsemiconductor/ci/actions/leak-guard@4ab3aaec8d70a2f0fb9a38e8a5a96cebe90e58e5 # v1.27.0
        with:
          entra-tenant-id: ${{ vars.ENTRA_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allowlist: .github/leak-guard-allowlist.txt
