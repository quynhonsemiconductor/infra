# =============================================================================
# Security · Leak guard — this repo is PUBLIC ON PURPOSE, and the boundary is
# enforced by pattern, not by memory.
#
# The shared ci action (v1.26.0, deterministic — no model, no network) scans
# the current TREE (not history — gitleaks owns history, for secrets) for the
# names that must never land here: qnsc.vn hostnames and mail addresses, GUIDs,
# private addresses, plus the org's own Entra tenant GUID and AWS account
# number, which are NOT written down anywhere in this repo or in ci — the
# caller feeds them at runtime from org variables and any finding is reported
# with the value REDACTED (this repo's Actions logs are public).
#
# Allowlist: .github/leak-guard-allowlist.txt — one regex per line for the
# names that are public on purpose (the product edge hostnames this repo's
# live/* configuration publishes, the product mailboxes, RFC1918 allocations,
# Microsoft well-known constants, test fixtures). The baseline triage is in the
# PR that added it; anything genuinely internal must be FIXED, never added.
#
# The job NAME is the required-check name on main; it must not change.
# =============================================================================
name: Security · Leak guard

on:
  push:
    branches: [main]
  pull_request:
    # NO `branches:` filter here, deliberately — same reasoning as
    # security.yml: a bare `pull_request:` runs for every PR target, so a
    # stacked PR never sits silently un-checked.

concurrency:
  group: leak-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  leak-guard:
    name: leak-guard (public-repo patterns)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1 # tree scan, not history

      - uses: quynhonsemiconductor/ci/actions/leak-guard@ae52bdb8f3a5eecfc8d5f2665053ac872d4cb6f0 # v1.26.0
        with:
          entra-tenant-id: ${{ vars.ENTRA_TENANT_ID }}
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          allowlist: .github/leak-guard-allowlist.txt
