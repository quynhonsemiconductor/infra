        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      - name: tofu plan
        id: plan
        working-directory: live/storage-dev
