# =============================================================================
# Infrastructure · Apply — applies changed live/ stacks on push to main.
# (OpenTofu under the hood — named by capability, not tool.)
#
# PLAN FIRST, APPROVE WHAT YOU SAW (README "How an apply works now"):
#
#   detect   which stacks (push: the ones this push touched; dispatch: the `stacks`
#            input, validated; a change to this workflow selects all)
#   plan     one job per stack, NO environment, the read-only identity and tokens
#            infra-plan.yml uses: `tofu plan -detailed-exitcode`. Writes a summary
#            to the job summary (+add ~change -destroy and the resource addresses,
#            never a value) and a fingerprint = sha256 of the sorted
#            "<address> <action>" lines of the plan. Plan files and plan JSON are
#            NEVER uploaded: this repo is public and a plan holds secret values.
#            Only a tiny {stack, has_changes, fingerprint} JSON crosses jobs.
#   gate     collects the plan stage: which stacks have changes, their fingerprints.
#            A plan that errors fails the gate and nothing is applied in this run.
#   apply-*  only for stacks with changes (a stack with none never asks for approval),
#            in environment `production` (the owner approves). It re-plans with the
#            write credentials, recomputes the fingerprint and FAILS WITHOUT APPLYING
#            if it differs from the one that was shown ("plan changed since approval,
#            re-run"). The destructive-guard still runs on that plan.
#
# ORDER: apply-onprem after apply-edge (it reads the edge Access apps),
# observability-alerting after observability.
#
# LEGACY_STACKS (below): stacks whose read-only plan is not comparable to the write
# plan (`observability`: a read-only Grafana token cannot refresh its stack service
# account; `github`: the read app cannot see bypass actors or merge settings; both
# are planned with -refresh=false in infra-plan.yml). They skip the plan stage and
# the fingerprint check: selected means the apply job runs and asks for approval, as
# it did before this flow. Nothing is weakened for them: empty-secret guards and the
# destructive-guard are unchanged. A stack whose read-only inputs differ from its
# write inputs would fail closed on the fingerprint; move it to LEGACY_STACKS.
#
# EVERY apply job runs in the GitHub Environment `production` (audit-infra
# 2026-11-02 C-2/A-4): it is the reviewer gate (the owner), the OIDC trust
# boundary (the Azure apply identity federates only environment:production; the
# state backend is Azure for every stack), and the home of the WRITE tokens
# (environment secrets CLOUDFLARE_API_TOKEN, GRAFANA_CLOUD_API_KEY, ... — PR plans
# and the plan stage only get the *_READONLY ones). A run that has changes therefore
# waits for the owner's approval on the run page; while it waits it holds the apply
# concurrency lock (cancel-in-progress:false), so approve or reject promptly.
#
# storage-prod stays DELIBERATE-ONLY: it runs only via a manual workflow_dispatch
# with apply_prod=true (still gated by the same reviewer).
#
# AWS EXIT (2026-11-02): bootstrap, security-baseline, runtime-dev, runtime-prod
# and organization are RETIRED and are no longer applied here (their state is
# archived; account closure removes what is left). No job in this workflow holds
# AWS credentials: every stack uses the Azure backend and the Entra OIDC
# identity.
# =============================================================================
name: Infrastructure · Apply

on:
  push:
    branches: [main]
    paths:
      - "live/**"
      - ".github/workflows/infra-apply.yml"
  workflow_dispatch:
    inputs:
      apply_prod:
        description: "Also apply the production-tier stack (storage-prod). Still gated by the production environment reviewer."
        type: boolean
        default: false
      stacks:
        description: "Comma-separated stacks to plan and apply (edge, storage-dev, storage-prod, observability, observability-alerting, adaptive-metrics, onprem, github), or `all` (default: every stack except observability, which must be named). Unknown names fail the run."
        type: string
        default: all
      allow_destructive:
        description: "Allow this run to DELETE or REPLACE DNS / identity resources (Cloudflare records, Access apps, tunnels, ...). Read the plan first: see docs/incidents/2026-10-09-edge-dns.md."
        type: boolean
        default: false

# Serialize applies on the same ref so two quick merges can't race the tofu
# state lock. Never cancel a running apply mid-flight.
concurrency:
  group: infra-apply-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TOFU_VERSION: "1.13.2"
  # Stacks whose read-only plan is not comparable to the write plan: no plan stage, no fingerprint
  # check, the apply job asks for approval whenever the stack is selected (see the header).
  LEGACY_STACKS: "observability github"

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Which live/ stacks does this run cover? Push: the stacks the push touched (a change to this
  # workflow selects all). Dispatch: the validated `stacks` input. Downstream jobs gate on these lists.
  # ───────────────────────────────────────────────────────────────────────
  detect:
    name: Detect changed stacks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stacks: ${{ steps.changes.outputs.stacks }}
      plan_stacks: ${{ steps.changes.outputs.plan_stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute the stacks
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          STACKS_INPUT: ${{ inputs.stacks }}
        run: |
          set -euo pipefail
          KNOWN="edge storage-dev storage-prod observability observability-alerting adaptive-metrics onprem github"
          # `observability` is not in the default set: it is selected by a change under live/observability/
          # or by naming it in the dispatch input (it is a LEGACY stack, see the workflow header).
          DEFAULT="edge storage-dev storage-prod observability-alerting adaptive-metrics onprem github"
          sel=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            req=$(printf '%s' "${STACKS_INPUT:-all}" | tr ',' ' ' | xargs)
            if [ -z "$req" ] || [ "$req" = "all" ]; then
              sel="$DEFAULT"
            else
              for t in $req; do
                case " $KNOWN " in
                  *" $t "*) sel="$sel $t" ;;
                  *) echo "::error::unknown stack '$t' in the stacks input. Known: $KNOWN (or all)"; exit 1 ;;
                esac
              done
            fi
          elif [ -z "${BEFORE:-}" ] || [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            sel="$DEFAULT"
          else
            CHANGED="$(git diff --name-only "$BEFORE" "$AFTER")"
            echo "Changed files:"; echo "$CHANGED"
            if echo "$CHANGED" | grep -qE '^\.github/(workflows/infra-apply\.yml|scripts/plan-fingerprint\.sh)$'; then
              sel="$DEFAULT"
            else
              for s in $KNOWN; do
                if echo "$CHANGED" | grep -qE "^live/$s/"; then sel="$sel $s"; fi
              done
            fi
          fi
          # de-duplicate, keep KNOWN order
          out=""
          for s in $KNOWN; do case " $sel " in *" $s "*) out="$out $s" ;; esac; done
          plan=""
          for s in $out; do case " $LEGACY_STACKS " in *" $s "*) ;; *) plan="$plan $s" ;; esac; done
          json() { printf '%s\n' "$@" | sed '/^$/d' | jq -R . | jq -sc .; }
          # shellcheck disable=SC2086  # word splitting of the stack lists is the point
          { echo "stacks=$(json $out)"; echo "plan_stacks=$(json $plan)"; } >> "$GITHUB_OUTPUT"
          echo "selected:$out | planned in the plan stage:$plan | legacy (approval without a fingerprint):$LEGACY_STACKS"

          # ── STACKS THIS PIPELINE DOES NOT APPLY ───────────────────────────
          # Reported, NOT applied, and the distinction is deliberate.
          #
          # The list above is hardcoded. infra-plan.yml derives its list from the filesystem so a
          # stack cannot be silently unplanned. This job does NOT do the same, on purpose: adding a
          # stack here starts APPLYING it on merge to main, which should be a decision, not a side effect.
          #
          # So the gap is printed on every run instead of closed quietly. Silence
          # would let "merged" read as "applied", which for such a stack it is not.
          UNMANAGED=""
          for d in $(find live -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; \
                       | sed 's|^live/||' | sort -u); do
            case " $KNOWN " in
              *" $d "*) ;;
              *) UNMANAGED="$UNMANAGED $d" ;;
            esac
          done
          if [ -n "$UNMANAGED" ]; then
            echo "::warning::on disk but never applied by this pipeline:$UNMANAGED"
          fi

  # ───────────────────────────────────────────────────────────────────────
  # PLAN STAGE — read-only identity and tokens, NO environment (so no approval and no write
  # secret). Same credentials as infra-plan.yml. Summary + fingerprint only; no plan file or
  # plan JSON leaves this job (public repo).
  # ───────────────────────────────────────────────────────────────────────
  plan:
    name: Plan ${{ matrix.stack }}
    needs: [detect]
    if: ${{ needs.detect.outputs.plan_stacks != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.detect.outputs.plan_stacks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/iac-lint@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
        with:
          tofu-version: ${{ env.TOFU_VERSION }}
          fmt: 'false'   # install only

      - name: tofu init
        working-directory: live/${{ matrix.stack }}
        run: tofu init -input=false
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID_READ }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      # Mask the AM host: a runner-injected value, masked via env (same as infra-plan.yml).
      - name: Mask the AM host
        if: matrix.stack == 'adaptive-metrics'
        run: echo "::add-mask::$AM_URL"
        env:
          AM_URL: ${{ vars.AM_METRICS_URL }}

      - name: Refuse to plan away existing SSH targets when the secret is unset
        if: matrix.stack == 'edge'
        working-directory: live/edge
        run: |
          if [ -n "${SSH_INFRA_TARGETS}" ]; then
            printf '%s' "$SSH_INFRA_TARGETS" | jq -r '.. | strings' | while IFS= read -r v; do
              [ -n "$v" ] && echo "::add-mask::$v"
            done
          fi
          if [ -z "${SSH_INFRA_TARGETS}" ] && tofu state list 2>/dev/null | grep -q '^cloudflare_zero_trust_access_infrastructure_target\.'; then
            echo "STOP: SSH_INFRA_TARGETS is unset but state holds access targets; refusing to plan a destroy." >&2
            exit 1
          fi
        env:
          SSH_INFRA_TARGETS: ${{ secrets.SSH_INFRA_TARGETS }}
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC: 'true'

      - name: tofu plan
        id: plan
        working-directory: live/${{ matrix.stack }}
        run: |
          # Lock-free: the read identity cannot take the state lease, and a plan never mutates state.
          # The plan text is NOT printed on success (the summary lists addresses only); on an error it
          # is printed with UUIDs redacted so the failure can be read.
          set +e
          tofu plan -input=false -lock=false -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          ec=$?
          set -e
          if [ "$ec" = "1" ]; then
            sed -E 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/<redacted>/g' plan.txt
            exit 1
          fi
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID_READ }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          # READ-ONLY tokens, exactly the set infra-plan.yml gives a PR plan. The write tokens live in the
          # `production` environment and reach the apply jobs only.
          TF_VAR_cloudflare_zone_id:    ${{ vars.CLOUDFLARE_ZONE_ID }}
          TF_VAR_office_ip:             ${{ vars.OFFICE_IP }}
          TF_VAR_cloudflare_api_token:  ${{ secrets.CLOUDFLARE_API_TOKEN_READONLY }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_grafana_cloud_api_key: ${{ secrets.GRAFANA_CLOUD_API_KEY_READONLY }}
          TF_VAR_teams_webhook_url:     ${{ secrets.TEAMS_ALERTS_WEBHOOK_URL }}
          TF_VAR_admin_hostnames:       ${{ secrets.ADMIN_HOSTNAMES }}
          TF_VAR_tunnels_exist:         ${{ vars.TUNNELS_EXIST }}
          # MCP hub (live/edge/variables.mcp_hub.tf). Flag and ids are repo VARIABLES. `|| 'false'`: an empty value
          # breaks the bool. The two OAuth client SECRETS are NOT passed here: this job holds no environment secret.
          TF_VAR_mcp_hub_enabled:                    ${{ matrix.stack == 'edge' && (vars.MCP_HUB_ENABLED || 'false') || 'false' }}
          TF_VAR_mcp_github_oauth_client_id:         ${{ matrix.stack == 'edge' && vars.MCP_GITHUB_OAUTH_CLIENT_ID || '' }}
          TF_VAR_mcp_grafana_oauth_client_id:        ${{ matrix.stack == 'edge' && vars.MCP_GRAFANA_OAUTH_CLIENT_ID || '' }}
          TF_VAR_mcp_grafana_authorization_endpoint: ${{ matrix.stack == 'edge' && vars.MCP_GRAFANA_AUTHORIZATION_ENDPOINT || '' }}
          TF_VAR_mcp_grafana_token_endpoint:         ${{ matrix.stack == 'edge' && vars.MCP_GRAFANA_TOKEN_ENDPOINT || '' }}
          TF_VAR_grp_platform_admins_id: ${{ vars.ENTRA_GRP_PLATFORM_ADMINS_ID }}
          TF_VAR_grp_developers_id:     ${{ vars.ENTRA_GRP_DEVELOPERS_ID }}
          TF_VAR_grp_dev_users_id:    ${{ vars.ENTRA_GRP_DEV_USERS_ID }}
          TF_VAR_grp_staff_id: ${{ vars.ENTRA_GRP_STAFF_ID }}
          TF_VAR_entra_tenant_id:       ${{ vars.ENTRA_TENANT_ID }}
          TF_VAR_entra_idp_client_id:   ${{ vars.ENTRA_IDP_CLIENT_ID }}
          TF_VAR_entra_idp_client_secret: ${{ secrets.ENTRA_IDP_CLIENT_SECRET }}
          TF_VAR_grafana_sm_token:       ${{ matrix.stack == 'observability-alerting' && secrets.GRAFANA_SM_TOKEN || '' }}
          TF_VAR_adaptive_metrics_api_key: ${{ matrix.stack == 'adaptive-metrics' && secrets.GRAFANA_ADAPTIVE_METRICS_API_TOKEN_READONLY || '' }}
          TF_VAR_adaptive_metrics_url:   ${{ matrix.stack == 'adaptive-metrics' && vars.AM_METRICS_URL || '' }}
          TF_VAR_healthchecks_api_token: ${{ matrix.stack == 'observability-alerting' && secrets.HEALTHCHECKS_API_TOKEN_READONLY || '' }}
          TF_VAR_admin_private_cidr:     ${{ contains(fromJSON('["onprem","edge"]'), matrix.stack) && secrets.ADMIN_PRIVATE_CIDR || '' }}
          TF_VAR_warp_extra_excludes:    ${{ matrix.stack == 'edge' && secrets.WARP_EXTRA_EXCLUDES || '[]' }}
          TF_VAR_ssh_infra_targets:      ${{ matrix.stack == 'edge' && secrets.SSH_INFRA_TARGETS || '{}' }}

      - name: Summary and fingerprint
        id: fp
        working-directory: live/${{ matrix.stack }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/plan-fingerprint.sh" plan "$STACK" "$EXIT_CODE"
        env:
          STACK: ${{ matrix.stack }}
          EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
          FP_JSON: ${{ runner.temp }}/fp-${{ matrix.stack }}.json
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID_READ }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      # Only {stack, has_changes, fingerprint}: three short fields, no plan, no values.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fp-${{ matrix.stack }}
          path: ${{ runner.temp }}/fp-${{ matrix.stack }}.json
          retention-days: 3
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────
  # GATE — which stacks ask for approval, and the fingerprint each approval is for.
  # ───────────────────────────────────────────────────────────────────────
  gate:
    name: Plan summary
    needs: [detect, plan]
    if: ${{ !cancelled() && needs.detect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
      fingerprints: ${{ steps.collect.outputs.fingerprints }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.plan.result != 'skipped' }}
        continue-on-error: true   # every plan leg failed: no artifact, handled below
        with:
          pattern: fp-*
          merge-multiple: true
          path: fp

      - name: Collect
        id: collect
        env:
          STACKS: ${{ needs.detect.outputs.stacks }}
        run: |
          set -euo pipefail
          # A stack whose plan failed is NOT applied (and the run ends red through `plan-verdict`), but it must
          # not hold back an independent stack: onprem reads the Access app that edge creates, so its plan can
          # fail until edge is applied, and edge must still be able to apply first.
          changed='[]'; fps='{}'
          {
            echo "### Plan stage"
            echo
            echo "| stack | changes | fingerprint | asks for approval |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for stack in $(jq -r '.[]' <<<"$STACKS"); do
            case " $LEGACY_STACKS " in
              *" $stack "*)
                changed=$(jq -c --arg s "$stack" '. + [$s]' <<<"$changed")
                echo "| $stack | not planned (legacy) | none | yes, when selected |" >> "$GITHUB_STEP_SUMMARY"
                continue ;;
            esac
            f="fp/fp-${stack}.json"
            if [ ! -s "$f" ]; then
              echo "::warning::no plan result for $stack (its plan failed): not applied in this run"
              echo "| $stack | **plan failed** | | no, not applied |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            has=$(jq -r .has_changes "$f"); fp=$(jq -r .fingerprint "$f")
            if [ "$has" = "true" ]; then
              changed=$(jq -c --arg s "$stack" '. + [$s]' <<<"$changed")
              fps=$(jq -c --arg s "$stack" --arg f "$fp" '. + {($s): $f}' <<<"$fps")
              echo "| $stack | yes | \`${fp:0:12}\` | yes |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $stack | none | | no |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          { echo "changed=$changed"; echo "fingerprints=$fps"; } >> "$GITHUB_OUTPUT"

  # A failed plan leg ends the run red (the gate lets the other stacks go on).
  plan-verdict:
    name: Plan verdict
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "::error::at least one plan failed or errored. That stack was NOT applied; independent stacks were not held back. Read the failed Plan job, fix it, re-run."
          exit 1

  # ───────────────────────────────────────────────────────────────────────
  # The production environment gate is silent outside the run page: the apply for #338 (run
  # 41778707810) waited 2h10m on 2026-11-04. While it waited it held the concurrency group, so
  # later merges queued behind it, and only one of those can be pending at a time. This job
  # watches this run's own jobs through
  # the Actions API and posts one Teams card (stack, commit title, run link) the first time
  # each Apply <stack> job reports status `waiting`. It runs beside the applies, gates nothing,
  # and its only hard failure is its own self-test: a notification problem must never stop an
  # apply. The webhook is the same TEAMS_ALERTS_WEBHOOK_URL alerting-health.yml uses.
  # ───────────────────────────────────────────────────────────────────────
  notify-approval:
    name: Notify approval pending
    needs: [detect, gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.changed != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read   # read this run's jobs to see which apply job is `waiting`

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Self-test the approval card
        run: python3 -m unittest scripts/test_notify_apply_waiting.py

      - name: Post a card when an apply job waits for approval
        env:
          GH_TOKEN: ${{ github.token }}
          TEAMS_ALERTS_WEBHOOK_URL: ${{ secrets.TEAMS_ALERTS_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHANGED: ${{ needs.gate.outputs.changed }}
          HEAD_COMMIT: ${{ github.event.head_commit.message }}
          STACKS_INPUT: ${{ inputs.stacks }}
        run: |
          set -euo pipefail
          title="$(printf '%s' "${HEAD_COMMIT:-}" | head -n 1)"
          if [ -z "$title" ]; then title="manual dispatch: ${STACKS_INPUT:-all}"; fi
          python3 scripts/notify_apply_waiting.py \
            --watch --repo "$REPO" --run-id "$RUN_ID" \
            --expected "$CHANGED" --commit-title "$title" --run-url "$RUN_URL"

  apply-edge:
    name: Apply edge
    needs: [detect, gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' && contains(fromJson(needs.gate.outputs.changed), 'edge') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production   # Cloudflare edge — account/zone-wide
    permissions:
      contents: read
      id-token: write
      pull-requests: read   # destructive-guard reads the PR labels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # tofu only: this stack's state is on Azure, so the job holds no AWS
      # credentials (the apply identity federates environment:production).
      - uses: quynhonsemiconductor/ci/actions/iac-lint@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
        with:
          tofu-version: ${{ env.TOFU_VERSION }}
          fmt: 'false'   # install only

      - name: tofu init
        working-directory: live/edge
        run: tofu init -input=false
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      - name: Refuse to plan away existing SSH targets when the secret is unset
        working-directory: live/edge
        run: |
          if [ -n "${SSH_INFRA_TARGETS}" ]; then
            printf '%s' "$SSH_INFRA_TARGETS" | jq -r '.. | strings' | while IFS= read -r v; do
              [ -n "$v" ] && echo "::add-mask::$v"
            done
          fi
          if [ -z "${SSH_INFRA_TARGETS}" ] && tofu state list 2>/dev/null | grep -q '^cloudflare_zero_trust_access_infrastructure_target\.'; then
            echo "STOP: SSH_INFRA_TARGETS is unset but state holds access targets; refusing to plan a destroy." >&2
            exit 1
          fi
        env:
          SSH_INFRA_TARGETS: ${{ secrets.SSH_INFRA_TARGETS }}
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC: 'true'

      - name: tofu plan
        id: plan
        working-directory: live/edge
        run: |
          set -euo pipefail
          # preflight: refuse placeholder variable values — an apply with
          # SETME/example.invalid/all-zero values would create real Access
          # apps and DNS pointing nowhere
          bad=0
          for v in "GRP_PLATFORM_ADMINS_ID:${TF_VAR_grp_platform_admins_id-}" "GRP_DEVELOPERS_ID:${TF_VAR_grp_developers_id-}" \
                   "ENTRA_TENANT_ID:${TF_VAR_entra_tenant_id-}" "ENTRA_IDP_CLIENT_ID:${TF_VAR_entra_idp_client_id-}" \
                   "ENTRA_IDP_CLIENT_SECRET:${TF_VAR_entra_idp_client_secret-}"; do
            name="${v%%:*}"; value="${v#*:}"
            if [ -z "$value" ] || printf '%s' "$value" | grep -Eq 'SETME|SET-VIA-CI|example\.invalid|^0{8}-|^0+$'; then
              echo "::error::edge apply: $name holds a placeholder or is empty — the owner must set the real value before apply"
              bad=1
            fi
          done
          [ "$bad" = "0" ] || exit 1
          # MCP hub: the empty-secret guard lives HERE (the apply job holds the secrets), not in a precondition of the
          # stack, so that PR plans and drift, which have no environment secret, can still plan with the hub on.
          if [ "${TF_VAR_mcp_hub_enabled:-false}" = "true" ]; then
            if [ -z "${TF_VAR_mcp_github_oauth_client_id:-}" ] || [ -z "${TF_VAR_mcp_github_oauth_client_secret:-}" ]; then
              echo "::error::edge apply: MCP_HUB_ENABLED is true but the GitHub OAuth client id (variable MCP_GITHUB_OAUTH_CLIENT_ID) or secret (environment secret MCP_GITHUB_OAUTH_CLIENT_SECRET) is empty"; exit 1
            fi
            if [ -n "${TF_VAR_mcp_grafana_oauth_client_id:-}" ] && [ -z "${TF_VAR_mcp_grafana_oauth_client_secret:-}" ]; then
              echo "::error::edge apply: a manual Grafana OAuth client id is set but the environment secret MCP_GRAFANA_OAUTH_CLIENT_SECRET is empty"; exit 1
            fi
          fi
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          TF_VAR_cloudflare_api_token:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id:    ${{ vars.CLOUDFLARE_ZONE_ID }}
          # secrets, not vars: admin_hostnames is a sensitive label->hostname map —
          # vars print in job logs / PR text, secrets are masked (edge v5 migration)
          TF_VAR_admin_hostnames: ${{ secrets.ADMIN_HOSTNAMES }}
          # WARP split-tunnel exclude = the default list minus this range. Same secret live/onprem uses.
          TF_VAR_admin_private_cidr: ${{ secrets.ADMIN_PRIVATE_CIDR }}
          # Extra WARP split-tunnel excludes (partner VPN endpoints), JSON list of {address, description}.
          # A secret, not a var: partner addresses must not print in public logs.
          TF_VAR_warp_extra_excludes: ${{ secrets.WARP_EXTRA_EXCLUDES || '[]' }}
          TF_VAR_ssh_infra_targets: ${{ secrets.SSH_INFRA_TARGETS || '{}' }}
          TF_VAR_tunnels_exist: ${{ vars.TUNNELS_EXIST }}
          # MCP hub (live/edge/variables.mcp_hub.tf): flag and ids are repo variables (`|| 'false'`: an empty value breaks the
          # bool); the two OAuth client secrets are ENVIRONMENT secrets of `production`, so only this job has them.
          TF_VAR_mcp_hub_enabled: ${{ vars.MCP_HUB_ENABLED || 'false' }}
          TF_VAR_mcp_github_oauth_client_id: ${{ vars.MCP_GITHUB_OAUTH_CLIENT_ID }}
          TF_VAR_mcp_github_oauth_client_secret: ${{ secrets.MCP_GITHUB_OAUTH_CLIENT_SECRET }}
          TF_VAR_mcp_grafana_oauth_client_id: ${{ vars.MCP_GRAFANA_OAUTH_CLIENT_ID }}
          TF_VAR_mcp_grafana_oauth_client_secret: ${{ secrets.MCP_GRAFANA_OAUTH_CLIENT_SECRET }}
          TF_VAR_mcp_grafana_authorization_endpoint: ${{ vars.MCP_GRAFANA_AUTHORIZATION_ENDPOINT }}
          TF_VAR_mcp_grafana_token_endpoint: ${{ vars.MCP_GRAFANA_TOKEN_ENDPOINT }}
          TF_VAR_grp_platform_admins_id: ${{ vars.ENTRA_GRP_PLATFORM_ADMINS_ID }}
          TF_VAR_grp_developers_id: ${{ vars.ENTRA_GRP_DEVELOPERS_ID }}
          TF_VAR_grp_dev_users_id: ${{ vars.ENTRA_GRP_DEV_USERS_ID }}
          TF_VAR_grp_staff_id: ${{ vars.ENTRA_GRP_STAFF_ID }}
          TF_VAR_entra_tenant_id: ${{ vars.ENTRA_TENANT_ID }}
          TF_VAR_entra_idp_client_id: ${{ vars.ENTRA_IDP_CLIENT_ID }}
          TF_VAR_entra_idp_client_secret: ${{ secrets.ENTRA_IDP_CLIENT_SECRET }}

      # The edge PR comment publishes plan.txt: redact every SSH target value
      # (hostname/IP/username) there, not only in the masked log stream.
      - name: Redact SSH target values from the plan
        working-directory: live/edge
        env:
          SSH_INFRA_TARGETS: ${{ secrets.SSH_INFRA_TARGETS }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          raw = os.environ.get("SSH_INFRA_TARGETS", "")
          if not raw:
              raise SystemExit(0)
          vals = set()
          def walk(x):
              if isinstance(x, str): vals.add(x)
              elif isinstance(x, dict):
                  for v in x.values(): walk(v)
              elif isinstance(x, list):
                  for v in x: walk(v)
          walk(json.loads(raw))
          p = pathlib.Path("plan.txt"); s = p.read_text()
          for v in sorted(vals, key=len, reverse=True):
              if v: s = s.replace(v, "<redacted-ssh-target>")
          p.write_text(s)
          PY

      # APPROVE WHAT YOU SAW: the plan above ran with the write credentials; its fingerprint (sha256 of the sorted
      # "<address> <action>" lines) must equal the one the plan stage showed for approval, else nothing is applied.
      # No approved fingerprint (a legacy stack) means the plan made just now is applied, as before this flow.
      - name: Verify the plan is the one that was approved
        if: steps.plan.outputs.exitcode != '1'
        working-directory: live/edge
        run: bash "$GITHUB_WORKSPACE/.github/scripts/plan-fingerprint.sh" check edge
        env:
          EXPECTED_FP: ${{ fromJson(needs.gate.outputs.fingerprints)['edge'] }}
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      # A provider bump, a lock-file change or an empty variable can turn a plan into "replace every DNS record" (2026-10-09).
      # The plan is applied unreviewed here, so it is read first: deleting or replacing a DNS/identity resource needs the
      # `allow-dns-destroy` label on the merged PR (or the allow_destructive dispatch input).
      - name: Refuse destructive DNS / identity changes
        if: steps.plan.outputs.exitcode == '2'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
        with:
          working-directory: live/edge
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/edge
        run: tofu apply -input=false tfplan
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

  # ───────────────────────────────────────────────────────────────────────
  # Shared observability — the one Grafana Cloud stack every product's
  # already-wired OTel sidecar (tf-modules/modules/observability-agent)
  # pushes to. No VPC, no ALB, no other stack's remote state — this is a
  # standalone Grafana Cloud resource, so it depends on nothing but the
  # Grafana credential. Platform blast radius, same reviewer gate as
  # edge.
  # ───────────────────────────────────────────────────────────────────────
  apply-observability:
    name: Apply observability
    needs: [detect, gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' && contains(fromJson(needs.gate.outputs.changed), 'observability') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production   # platform blast radius — auto-apply on merge (parity with observability-alerting); the PR review is the gate
    permissions:
      contents: read
      id-token: write
      pull-requests: read   # destructive-guard reads the PR labels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # tofu only: this stack's state is on Azure, so the job holds no AWS
      # credentials (the apply identity federates environment:production).
      - uses: quynhonsemiconductor/ci/actions/iac-lint@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
        with:
          tofu-version: ${{ env.TOFU_VERSION }}
          fmt: 'false'   # install only

      - name: tofu init
        working-directory: live/observability
        run: tofu init -input=false
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      # An empty secret reaches the provider as "no token" and fails 20 seconds later with "the Cloud API client is
      # required for this resource" (apply run 41443669230). Say what is wrong instead.
      - name: Require the Grafana Cloud token
        env:
          TOKEN: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::environment secret GRAFANA_CLOUD_API_KEY (environment: production) is empty or unset. It must hold a Cloud Access Policy token with stacks:read, stacks:write and stack-service-accounts:write."; exit 1; }

      - name: tofu plan
        id: plan
        working-directory: live/observability
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          TF_VAR_grafana_cloud_api_key: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
          TF_VAR_teams_webhook_url: ${{ secrets.TEAMS_ALERTS_WEBHOOK_URL }}
          TF_VAR_office_ip: ${{ vars.OFFICE_IP }}

      # APPROVE WHAT YOU SAW: the plan above ran with the write credentials; its fingerprint (sha256 of the sorted
      # "<address> <action>" lines) must equal the one the plan stage showed for approval, else nothing is applied.
      # No approved fingerprint (a legacy stack) means the plan made just now is applied, as before this flow.
      - name: Verify the plan is the one that was approved
        if: steps.plan.outputs.exitcode != '1'
        working-directory: live/observability
        run: bash "$GITHUB_WORKSPACE/.github/scripts/plan-fingerprint.sh" check observability
        env:
          EXPECTED_FP: ${{ fromJson(needs.gate.outputs.fingerprints)['observability'] }}
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      # A provider bump, a lock-file change or an empty variable can turn a plan into "replace every DNS record" (2026-10-09).
      # The plan is applied unreviewed here, so it is read first: deleting or replacing a DNS/identity resource needs the
      # `allow-dns-destroy` label on the merged PR (or the allow_destructive dispatch input).
      - name: Refuse destructive DNS / identity changes
        if: steps.plan.outputs.exitcode == '2'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
        with:
          working-directory: live/observability
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/observability
        run: tofu apply -input=false tfplan
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

  apply-observability-alerting:
    name: Apply observability-alerting
    # After the observability job: this stack reads its state (Grafana url and token).
    needs: [detect, gate, apply-observability]
    if: ${{ !cancelled() && needs.gate.result == 'success' && contains(fromJson(needs.gate.outputs.changed), 'observability-alerting') && needs.apply-observability.result != 'failure' && needs.apply-observability.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production   # platform blast radius — auto-apply on merge (parity with observability-alerting); the PR review is the gate
    permissions:
      contents: read
      id-token: write
      pull-requests: read   # destructive-guard reads the PR labels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # tofu only: this stack's state is on Azure, so the job holds no AWS
      # credentials (the apply identity federates environment:production).
      - uses: quynhonsemiconductor/ci/actions/iac-lint@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
        with:
          tofu-version: ${{ env.TOFU_VERSION }}
          fmt: 'false'   # install only

      - name: tofu init
        working-directory: live/observability-alerting
        run: tofu init -input=false
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      - name: tofu plan
        id: plan
        working-directory: live/observability-alerting
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          TF_VAR_teams_webhook_url: ${{ secrets.TEAMS_ALERTS_WEBHOOK_URL }}
          TF_VAR_office_ip: ${{ vars.OFFICE_IP }}
          # opshub prod monitoring (live/observability-alerting/opshub-prod.tf) —
          # scoped to THIS stack's apply job only; empty until the Stage D2
          # cutover, see that file's header for the flip procedure.
          TF_VAR_grafana_sm_token:       ${{ secrets.GRAFANA_SM_TOKEN }}
          TF_VAR_healthchecks_api_token: ${{ secrets.HEALTHCHECKS_API_TOKEN }}

      # APPROVE WHAT YOU SAW: the plan above ran with the write credentials; its fingerprint (sha256 of the sorted
      # "<address> <action>" lines) must equal the one the plan stage showed for approval, else nothing is applied.
      # No approved fingerprint (a legacy stack) means the plan made just now is applied, as before this flow.
      - name: Verify the plan is the one that was approved
        if: steps.plan.outputs.exitcode != '1'
        working-directory: live/observability-alerting
        run: bash "$GITHUB_WORKSPACE/.github/scripts/plan-fingerprint.sh" check observability-alerting
        env:
          EXPECTED_FP: ${{ fromJson(needs.gate.outputs.fingerprints)['observability-alerting'] }}
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      # A provider bump, a lock-file change or an empty variable can turn a plan into "replace every DNS record" (2026-10-09).
      # The plan is applied unreviewed here, so it is read first: deleting or replacing a DNS/identity resource needs the
      # `allow-dns-destroy` label on the merged PR (or the allow_destructive dispatch input).
      - name: Refuse destructive DNS / identity changes
        if: steps.plan.outputs.exitcode == '2'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
        with:
          working-directory: live/observability-alerting
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/observability-alerting
        run: |
          # UUID redaction: same reason as the plan step — healthchecksio check
          # ids/ping_urls are not sensitive per the provider but ARE working
          # ping URLs (UUID pings stay accepted) and this log is public.
          set -o pipefail
          tofu apply -input=false tfplan 2>&1 \
            | sed -E 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/<redacted>/g' \
            | tee apply.txt
          ec=${PIPESTATUS[0]}
          echo "tofu apply exit: $ec"
          exit "$ec"
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

  apply-adaptive-metrics:
    name: Apply adaptive-metrics
    needs: [detect, gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' && contains(fromJson(needs.gate.outputs.changed), 'adaptive-metrics') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production   # platform blast radius — auto-apply on merge (parity with observability-alerting); the PR review is the gate
    permissions:
      contents: read
      id-token: write
      pull-requests: read   # destructive-guard reads the PR labels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # tofu only: this stack's state is on Azure, so the job holds no AWS
      # credentials (the apply identity federates environment:production).
      - uses: quynhonsemiconductor/ci/actions/iac-lint@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
        with:
          tofu-version: ${{ env.TOFU_VERSION }}
          fmt: 'false'   # install only

      - name: tofu init
        working-directory: live/adaptive-metrics
        run: tofu init -input=false
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      - name: tofu plan
        id: plan
        working-directory: live/adaptive-metrics
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          # The AM provider validates the token at configure (fetches the rule
          # state), so a rejected credential fails HERE — the plan itself is the
          # API-acceptance check for auth; the aggregation strings are proven by
          # the apply below (the API validates them per rule).
          TF_VAR_adaptive_metrics_url:   ${{ vars.AM_METRICS_URL }}
          TF_VAR_adaptive_metrics_api_key: ${{ secrets.GRAFANA_ADAPTIVE_METRICS_API_TOKEN }}

      # APPROVE WHAT YOU SAW: the plan above ran with the write credentials; its fingerprint (sha256 of the sorted
      # "<address> <action>" lines) must equal the one the plan stage showed for approval, else nothing is applied.
      # No approved fingerprint (a legacy stack) means the plan made just now is applied, as before this flow.
      - name: Verify the plan is the one that was approved
        if: steps.plan.outputs.exitcode != '1'
        working-directory: live/adaptive-metrics
        run: bash "$GITHUB_WORKSPACE/.github/scripts/plan-fingerprint.sh" check adaptive-metrics
        env:
          EXPECTED_FP: ${{ fromJson(needs.gate.outputs.fingerprints)['adaptive-metrics'] }}
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      - name: Refuse destructive DNS / identity changes
        if: steps.plan.outputs.exitcode == '2'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
        with:
          working-directory: live/adaptive-metrics
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/adaptive-metrics
        run: |
          set -o pipefail
          tofu apply -input=false tfplan 2>&1 | tee apply.txt
          ec=${PIPESTATUS[0]}
          echo "tofu apply exit: $ec"
          exit "$ec"
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          TF_VAR_adaptive_metrics_url:   ${{ vars.AM_METRICS_URL }}
          TF_VAR_adaptive_metrics_api_key: ${{ secrets.GRAFANA_ADAPTIVE_METRICS_API_TOKEN }}

  # live/github — GitHub organisation config (rulesets, platform repo settings, infra
  # environments). State on Azure like the other stacks. The only credential besides
  # Azure OIDC is a ~1 hour token minted from the WRITE GitHub App (`qnsc-iac-apply`),
  # whose id and private key are environment variable/secret of `production`
  # (IAC_APPLY_APP_ID, IAC_APPLY_APP_KEY). That is why this job pins that environment:
  # the required reviewer is the human gate, and the plan below is what the reviewer
  # approves. The stack has prevent_destroy on every ruleset and repository, so a bad
  # edit fails the plan instead of deleting branch protection.
  #
  # REFRESH IS ON here, on purpose: the read app cannot see repository bypass actors or the
  # merge settings, so PR plans of this stack run with -refresh=false (config vs state) and
  # this job is the first place a real read of the organisation happens. EXCEPTION to the
  # plan-first flow (README "How an apply works now"): `github` is a LEGACY stack (no plan stage, no
  # fingerprint): the plan that counts is the one made INSIDE this production job with the apply app,
  # because no token a PR may hold can produce a faithful one. The monthly github-drift workflow
  # repeats that plan on a schedule (see live/github/README.md).
  apply-github:
    name: Apply github
    needs: [detect, gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' && contains(fromJson(needs.gate.outputs.changed), 'github') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production   # org-wide repository protection — the reviewer gate
    permissions:
      contents: read
      id-token: write
      pull-requests: read   # destructive-guard reads the PR labels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/iac-lint@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
        with:
          tofu-version: ${{ env.TOFU_VERSION }}
          fmt: 'false'   # install only

      - name: Mint the apply GitHub App token
        id: gh-apply
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.IAC_APPLY_APP_ID }}
          private-key: ${{ secrets.IAC_APPLY_APP_KEY }}
          owner: quynhonsemiconductor
          permission-administration: write
          permission-environments: write

      - name: tofu init
        working-directory: live/github
        run: tofu init -input=false
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      - name: tofu plan
        id: plan
        working-directory: live/github
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          TF_VAR_github_token: ${{ steps.gh-apply.outputs.token }}

      # Legacy stack: no approved fingerprint, so this only writes the summary of what is about to be applied.
      - name: Verify the plan is the one that was approved
        if: steps.plan.outputs.exitcode != '1'
        working-directory: live/github
        run: bash "$GITHUB_WORKSPACE/.github/scripts/plan-fingerprint.sh" check github
        env:
          EXPECTED_FP: ${{ fromJson(needs.gate.outputs.fingerprints)['github'] }}
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      - name: Refuse destructive DNS / identity changes
        if: steps.plan.outputs.exitcode == '2'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
        with:
          working-directory: live/github
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/github
        run: |
          set -o pipefail
          tofu apply -input=false tfplan 2>&1 | tee apply.txt
          ec=${PIPESTATUS[0]}
          echo "tofu apply exit: $ec"
          exit "$ec"
