        env:
          EXPECTED_FP: ${{ fromJson(needs.gate.outputs.fingerprints)['storage-dev'] }}
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      # A provider bump, a lock-file change or an empty variable can turn a plan into "replace every DNS record" (2026-10-09).
