# =============================================================================
# Infrastructure · Apply — applies changed live/ stacks on push to main.
# (OpenTofu under the hood — named by capability, not tool.)
#
# A `detect` job diffs the push and selects candidate stacks (a modules/ or
# workflow change selects everything; manual dispatch selects all). Each stack
# then plans to a saved file with -detailed-exitcode and applies ONLY that exact
# file, and ONLY when the plan shows changes (exit 2) — an unchanged stack is
# skipped, so a workflow/module edit never silently re-applies live infra.
# Each stack runs under a GitHub Environment that doubles as the OIDC trust
# boundary AND the reviewer gate, mapped to the three tiers the infra-apply
# role trusts (see tf-modules/modules/iam-oidc infra_apply_subjects):
#   • shared     → bootstrap, security-baseline, edge, observability,
#                  observability-alerting, adaptive-metrics (account/platform-wide)
#   • develop    → runtime-dev, storage-dev
#   • production → runtime-prod, storage-prod (protect with required reviewers)
#
# PROD IS DELIBERATE-ONLY: the production-tier jobs never run on an ordinary
# push to main. On a push they would sit pending on the reviewer gate and, with
# cancel-in-progress:false, hold the apply concurrency lock — blocking every
# later dev apply. They run ONLY via a manual workflow_dispatch with
# apply_prod=true, and are still gated by the production environment's required
# reviewer. A normal merge applies shared + develop only. (Mirrors the
# tag-gated prod model in the product repos.)
#
# NOTE: First-time bootstrap must be run manually (see live/bootstrap/main.tf
# history — the state-backend/OIDC-provider chicken-and-egg). This workflow
# handles subsequent changes and first-time apply of every later stack.
# =============================================================================
name: Infrastructure · Apply

on:
  push:
    branches: [main]
    paths:
      - "live/**"
      - "modules/**"
      - ".github/workflows/infra-apply.yml"
  workflow_dispatch:
    inputs:
      apply_prod:
        description: "Also apply the production-tier stacks (runtime-prod, storage-prod). Still gated by the production environment reviewer."
        type: boolean
        default: false
      allow_destructive:
        description: "Allow this run to DELETE or REPLACE DNS / identity resources (Cloudflare records, SES identities, ACM certificates, ...). Read the plan first: see docs/incidents/2026-10-09-edge-dns.md."
        type: boolean
        default: false

# Serialize applies on the same ref so two quick merges can't race the tofu
# state lock. Never cancel a running apply mid-flight.
concurrency:
  group: infra-apply-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TOFU_VERSION: "1.9.1"
  AWS_REGION: ap-southeast-1

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Which live/ stacks changed in this push? (modules/ or workflow change, or a
  # manual dispatch → apply all.) Downstream jobs gate on this list.
  # ───────────────────────────────────────────────────────────────────────
  detect:
    name: Detect changed stacks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stacks: ${{ steps.changes.outputs.stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute changed stacks
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # `observability` is NOT in this list: it cannot be planned (its state holds grafana_* objects whose provider alias the
          # 2026-09-20 split removed, so every plan fails with "Provider configuration not present ... (orphan)"), and an all-stacks run
          # that includes it is red every time. A change under live/observability/ still selects it below, so that remains visible.
          # Put it back in this list with the state migration: docs/runbooks/observability-state-migration.md.
          ALL='"bootstrap","security-baseline","runtime-dev","runtime-prod","edge","storage-dev","storage-prod","observability-alerting","adaptive-metrics"'
          # Manual dispatch or an unknown/zero base commit → apply everything.
          if [ -z "${BEFORE:-}" ] || [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "stacks=[$ALL]" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED="$(git diff --name-only "$BEFORE" "$AFTER")"
          echo "Changed files:"; echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(modules/|\.github/workflows/infra-apply\.yml$)'; then
            echo "stacks=[$ALL]" >> "$GITHUB_OUTPUT"; exit 0
          fi
          SEL=""
          for s in bootstrap security-baseline runtime-dev runtime-prod edge storage-dev storage-prod observability observability-alerting adaptive-metrics; do
            if echo "$CHANGED" | grep -qE "^live/$s/"; then SEL="$SEL\"$s\","; fi
          done
          echo "stacks=[${SEL%,}]" >> "$GITHUB_OUTPUT"

          # ── STACKS THIS PIPELINE DOES NOT APPLY ───────────────────────────
          # Reported, NOT applied, and the distinction is deliberate.
          #
          # The list above is hardcoded, and `organization` (applied out of band) is not in it.
          # infra-plan.yml derives its list from the filesystem so a stack cannot be silently
          # unplanned. This job does NOT do the same, on purpose: adding a stack
          # here starts APPLYING it on merge to main, which should be a decision, not a side effect.
          #
          # So the gap is printed on every run instead of closed quietly. Silence
          # would let "merged" read as "applied", which for such a stack it is not.
          UNMANAGED=""
          for d in $(find live -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; \
                       | sed 's|^live/||' | sort -u); do
            case " bootstrap security-baseline runtime-dev runtime-prod edge storage-dev storage-prod observability observability-alerting adaptive-metrics " in
              *" $d "*) ;;
              *) UNMANAGED="$UNMANAGED $d" ;;
            esac
          done
          if [ -n "$UNMANAGED" ]; then
            echo "::warning::on disk but never applied by this pipeline:$UNMANAGED"
          fi

  # ───────────────────────────────────────────────────────────────────────
  # shared tier — bootstrap first (everything reads its remote state).
  # ───────────────────────────────────────────────────────────────────────
  apply-bootstrap:
    name: Apply bootstrap
    needs: detect
    if: ${{ contains(fromJson(needs.detect.outputs.stacks), 'bootstrap') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: shared   # platform blast radius — auto-apply on merge (parity with observability-alerting); the PR review is the gate
    permissions:
      contents: read
      id-token: write
      pull-requests: read   # destructive-guard reads the PR labels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@0feca69debe06835300c1e28cf14ac5723577a51 # v1.24.0
        with:
          role-arn:     arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region:   ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: live/bootstrap
        run: tofu init -input=false

      # Plan to a saved file (-detailed-exitcode: 0=no change, 1=error, 2=changes).
      # We apply ONLY that exact file, and only when there are changes — an
      # unchanged stack is skipped, so a workflow/module edit never re-applies it.
      - name: tofu plan
        id: plan
        working-directory: live/bootstrap
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

      # A provider bump, a lock-file change or an empty variable can turn a plan into "replace every DNS record" (2026-10-09).
      # The plan is applied unreviewed here, so it is read first: deleting or replacing a DNS/identity resource needs the
      # `allow-dns-destroy` label on the merged PR (or the allow_destructive dispatch input).
      - name: Refuse destructive DNS / identity changes
        if: steps.plan.outputs.exitcode == '2'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@0feca69debe06835300c1e28cf14ac5723577a51 # v1.24.0
        with:
          working-directory: live/bootstrap
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/bootstrap
        run: tofu apply -input=false tfplan

  apply-security-baseline:
    name: Apply security-baseline
    needs: [detect, apply-bootstrap]
    if: ${{ always() && contains(fromJson(needs.detect.outputs.stacks), 'security-baseline') && needs.apply-bootstrap.result != 'failure' && needs.apply-bootstrap.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: shared   # account-wide audit controls
    permissions:
      contents: read
      id-token: write
      pull-requests: read   # destructive-guard reads the PR labels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@0feca69debe06835300c1e28cf14ac5723577a51 # v1.24.0
        with:
          role-arn:     arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region:   ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: live/security-baseline
        run: tofu init -input=false

      - name: tofu plan
        id: plan
        working-directory: live/security-baseline
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi

      # A provider bump, a lock-file change or an empty variable can turn a plan into "replace every DNS record" (2026-10-09).
      # The plan is applied unreviewed here, so it is read first: deleting or replacing a DNS/identity resource needs the
      # `allow-dns-destroy` label on the merged PR (or the allow_destructive dispatch input).
      - name: Refuse destructive DNS / identity changes
        if: steps.plan.outputs.exitcode == '2'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@0feca69debe06835300c1e28cf14ac5723577a51 # v1.24.0
        with:
          working-directory: live/security-baseline
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/security-baseline
        run: tofu apply -input=false tfplan

  apply-edge:
    name: Apply edge
    needs: [detect, apply-bootstrap]
    if: ${{ always() && contains(fromJson(needs.detect.outputs.stacks), 'edge') && needs.apply-bootstrap.result != 'failure' && needs.apply-bootstrap.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: shared   # Cloudflare edge — account/zone-wide
    permissions:
      contents: read
      id-token: write
      pull-requests: read   # destructive-guard reads the PR labels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@0feca69debe06835300c1e28cf14ac5723577a51 # v1.24.0
        with:
          role-arn:     arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region:   ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: live/edge
        run: tofu init -input=false

      - name: tofu plan
        id: plan
        working-directory: live/edge
        run: |
          set -euo pipefail
          # preflight: refuse placeholder variable values — an apply with
          # SETME/example.invalid/all-zero values would create real Access
          # apps and DNS pointing nowhere
          bad=0
          for v in "ADMIN_HOSTNAMES:${TF_VAR_admin_hostnames-}" "CUTOVER_HOSTS:${TF_VAR_cutover_hosts-}" \
                   "GRP_PLATFORM_ADMINS_ID:${TF_VAR_grp_platform_admins_id-}" "GRP_DEVELOPERS_ID:${TF_VAR_grp_developers_id-}" \
                   "ENTRA_TENANT_ID:${TF_VAR_entra_tenant_id-}" "ENTRA_IDP_CLIENT_ID:${TF_VAR_entra_idp_client_id-}" \
                   "ENTRA_IDP_CLIENT_SECRET:${TF_VAR_entra_idp_client_secret-}"; do
            name="${v%%:*}"; value="${v#*:}"
            if [ -z "$value" ] || printf '%s' "$value" | grep -Eq 'SETME|SET-VIA-CI|example\.invalid|^0{8}-|^0+$'; then
              echo "::error::edge apply: $name holds a placeholder or is empty — the owner must set the real value before apply"
              bad=1
            fi
          done
          [ "$bad" = "0" ] || exit 1
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          TF_VAR_cloudflare_api_token:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id:    ${{ vars.CLOUDFLARE_ZONE_ID }}
          TF_VAR_admin_hostnames: ${{ vars.ADMIN_HOSTNAMES }}
          TF_VAR_cutover_hosts: ${{ vars.CUTOVER_HOSTS }}
          TF_VAR_tunnels_exist: ${{ vars.TUNNELS_EXIST }}
          TF_VAR_grp_platform_admins_id: ${{ vars.ENTRA_GRP_PLATFORM_ADMINS_ID }}
          TF_VAR_grp_developers_id: ${{ vars.ENTRA_GRP_DEVELOPERS_ID }}
          TF_VAR_entra_tenant_id: ${{ vars.ENTRA_TENANT_ID }}
          TF_VAR_entra_idp_client_id: ${{ vars.ENTRA_IDP_CLIENT_ID }}
          TF_VAR_entra_idp_client_secret: ${{ secrets.ENTRA_IDP_CLIENT_SECRET }}

      # A provider bump, a lock-file change or an empty variable can turn a plan into "replace every DNS record" (2026-10-09).
      # The plan is applied unreviewed here, so it is read first: deleting or replacing a DNS/identity resource needs the
      # `allow-dns-destroy` label on the merged PR (or the allow_destructive dispatch input).
      - name: Refuse destructive DNS / identity changes
        if: steps.plan.outputs.exitcode == '2'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@0feca69debe06835300c1e28cf14ac5723577a51 # v1.24.0
        with:
          working-directory: live/edge
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/edge
        run: tofu apply -input=false tfplan

  # ───────────────────────────────────────────────────────────────────────
  # develop / production tiers — shared runtime networking per env.
  # ───────────────────────────────────────────────────────────────────────
  apply-runtime-dev:
    name: Apply runtime-dev
    needs: [detect, apply-bootstrap, apply-edge]
    if: ${{ always() && contains(fromJson(needs.detect.outputs.stacks), 'runtime-dev') && needs.apply-bootstrap.result != 'failure' && needs.apply-bootstrap.result != 'cancelled' && needs.apply-edge.result != 'failure' && needs.apply-edge.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: develop
    permissions:
      contents: read
      id-token: write
      pull-requests: read   # destructive-guard reads the PR labels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@0feca69debe06835300c1e28cf14ac5723577a51 # v1.24.0
        with:
          role-arn:     arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region:   ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: live/runtime-dev
        run: tofu init -input=false

      - name: tofu plan
        id: plan
        working-directory: live/runtime-dev
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi

      # A provider bump, a lock-file change or an empty variable can turn a plan into "replace every DNS record" (2026-10-09).
      # The plan is applied unreviewed here, so it is read first: deleting or replacing a DNS/identity resource needs the
      # `allow-dns-destroy` label on the merged PR (or the allow_destructive dispatch input).
      - name: Refuse destructive DNS / identity changes
        if: steps.plan.outputs.exitcode == '2'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@0feca69debe06835300c1e28cf14ac5723577a51 # v1.24.0
        with:
          working-directory: live/runtime-dev
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/runtime-dev
        run: tofu apply -input=false tfplan

  # ───────────────────────────────────────────────────────────────────────
  # Shared observability — the one Grafana Cloud stack every product's
  # already-wired OTel sidecar (tf-modules/modules/observability-agent)
  # pushes to. No VPC, no ALB, no other stack's remote state — this is a
  # standalone Grafana Cloud resource, so it depends on nothing but the
  # Grafana credential. Platform blast radius, same reviewer gate as
  # bootstrap/edge.
  # ───────────────────────────────────────────────────────────────────────
  apply-observability:
    name: Apply observability
    needs: [detect]
    if: ${{ contains(fromJson(needs.detect.outputs.stacks), 'observability') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: shared   # platform blast radius — auto-apply on merge (parity with observability-alerting); the PR review is the gate
    permissions:
      contents: read
      id-token: write
      pull-requests: read   # destructive-guard reads the PR labels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@0feca69debe06835300c1e28cf14ac5723577a51 # v1.24.0
        with:
          role-arn:     arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region:   ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: live/observability
        run: tofu init -input=false

      - name: tofu plan
        id: plan
        working-directory: live/observability
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          TF_VAR_grafana_cloud_api_key: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
          TF_VAR_teams_webhook_url: ${{ secrets.TEAMS_ALERTS_WEBHOOK_URL }}

      # A provider bump, a lock-file change or an empty variable can turn a plan into "replace every DNS record" (2026-10-09).
      # The plan is applied unreviewed here, so it is read first: deleting or replacing a DNS/identity resource needs the
      # `allow-dns-destroy` label on the merged PR (or the allow_destructive dispatch input).
      - name: Refuse destructive DNS / identity changes
        if: steps.plan.outputs.exitcode == '2'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@0feca69debe06835300c1e28cf14ac5723577a51 # v1.24.0
        with:
          working-directory: live/observability
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/observability
        run: tofu apply -input=false tfplan

  apply-observability-alerting:
    name: Apply observability-alerting
    # After the observability job: this stack reads its state (Grafana url and token).
    needs: [detect, apply-observability]
    if: ${{ always() && contains(fromJson(needs.detect.outputs.stacks), 'observability-alerting') && needs.apply-observability.result != 'failure' && needs.apply-observability.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: shared   # platform blast radius — auto-apply on merge (parity with observability-alerting); the PR review is the gate
    permissions:
      contents: read
      id-token: write
      pull-requests: read   # destructive-guard reads the PR labels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@0feca69debe06835300c1e28cf14ac5723577a51 # v1.24.0
        with:
          role-arn:     arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region:   ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: live/observability-alerting
        run: tofu init -input=false

      - name: tofu plan
        id: plan
        working-directory: live/observability-alerting
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          TF_VAR_teams_webhook_url: ${{ secrets.TEAMS_ALERTS_WEBHOOK_URL }}
          # opshub prod monitoring (live/observability-alerting/opshub-prod.tf) —
          # scoped to THIS stack's apply job only; empty until the Stage D2
          # cutover, see that file's header for the flip procedure.
          TF_VAR_grafana_sm_token:       ${{ secrets.GRAFANA_SM_TOKEN }}
          TF_VAR_healthchecks_api_token: ${{ secrets.HEALTHCHECKS_API_TOKEN }}

      # A provider bump, a lock-file change or an empty variable can turn a plan into "replace every DNS record" (2026-10-09).
      # The plan is applied unreviewed here, so it is read first: deleting or replacing a DNS/identity resource needs the
      # `allow-dns-destroy` label on the merged PR (or the allow_destructive dispatch input).
      - name: Refuse destructive DNS / identity changes
        if: steps.plan.outputs.exitcode == '2'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@0feca69debe06835300c1e28cf14ac5723577a51 # v1.24.0
        with:
          working-directory: live/observability-alerting
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/observability-alerting
        run: |
          # UUID redaction: same reason as the plan step — healthchecksio check
          # ids/ping_urls are not sensitive per the provider but ARE working
          # ping URLs (UUID pings stay accepted) and this log is public.
          set -o pipefail
          tofu apply -input=false tfplan 2>&1 \
            | sed -E 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/<redacted>/g' \
            | tee apply.txt
          ec=${PIPESTATUS[0]}
          echo "tofu apply exit: $ec"
          exit "$ec"

  apply-adaptive-metrics:
    name: Apply adaptive-metrics
    needs: [detect]
    if: ${{ contains(fromJson(needs.detect.outputs.stacks), 'adaptive-metrics') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: shared   # platform blast radius — auto-apply on merge (parity with observability-alerting); the PR review is the gate
    permissions:
      contents: read
      id-token: write
      pull-requests: read   # destructive-guard reads the PR labels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@0feca69debe06835300c1e28cf14ac5723577a51 # v1.24.0
        with:
          role-arn:     arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region:   ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: live/adaptive-metrics
        run: tofu init -input=false

      - name: tofu plan
        id: plan
        working-directory: live/adaptive-metrics
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          # The AM provider validates the token at configure (fetches the rule
          # state), so a rejected credential fails HERE — the plan itself is the
          # API-acceptance check for auth; the aggregation strings are proven by
          # the apply below (the API validates them per rule).
          TF_VAR_adaptive_metrics_url:   ${{ vars.AM_METRICS_URL }}
          TF_VAR_adaptive_metrics_api_key: ${{ secrets.GRAFANA_ADAPTIVE_METRICS_API_TOKEN }}

      - name: Refuse destructive DNS / identity changes
        if: steps.plan.outputs.exitcode == '2'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@0feca69debe06835300c1e28cf14ac5723577a51 # v1.24.0
        with:
          working-directory: live/adaptive-metrics
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/adaptive-metrics
        run: |
          set -o pipefail
          tofu apply -input=false tfplan 2>&1 | tee apply.txt
          ec=${PIPESTATUS[0]}
          echo "tofu apply exit: $ec"
          exit "$ec"
        env:
          TF_VAR_adaptive_metrics_url:   ${{ vars.AM_METRICS_URL }}
          TF_VAR_adaptive_metrics_api_key: ${{ secrets.GRAFANA_ADAPTIVE_METRICS_API_TOKEN }}

  apply-runtime-prod:
    name: Apply runtime-prod
    needs: [detect, apply-bootstrap, apply-edge]
    # Prod is deliberate-only: runs solely on a manual workflow_dispatch with
    # apply_prod=true (then still reviewer-gated). Never queued on a push, so a
    # normal merge can't leave a pending prod job holding the concurrency lock.
    if: ${{ always() && contains(fromJson(needs.detect.outputs.stacks), 'runtime-prod') && needs.apply-bootstrap.result != 'failure' && needs.apply-bootstrap.result != 'cancelled' && needs.apply-edge.result != 'failure' && needs.apply-edge.result != 'cancelled' && github.event_name == 'workflow_dispatch' && inputs.apply_prod }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production   # PROTECT with required reviewers
    permissions:
      contents: read
      id-token: write
      pull-requests: read   # destructive-guard reads the PR labels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@0feca69debe06835300c1e28cf14ac5723577a51 # v1.24.0
        with:
          role-arn:     arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region:   ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: live/runtime-prod
        run: tofu init -input=false

      - name: tofu plan
        id: plan
        working-directory: live/runtime-prod
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi

      # A provider bump, a lock-file change or an empty variable can turn a plan into "replace every DNS record" (2026-10-09).
      # The plan is applied unreviewed here, so it is read first: deleting or replacing a DNS/identity resource needs the
      # `allow-dns-destroy` label on the merged PR (or the allow_destructive dispatch input).
      - name: Refuse destructive DNS / identity changes
        if: steps.plan.outputs.exitcode == '2'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@0feca69debe06835300c1e28cf14ac5723577a51 # v1.24.0
        with:
          working-directory: live/runtime-prod
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/runtime-prod
        run: tofu apply -input=false tfplan

  # ───────────────────────────────────────────────────────────────────────
  # storage tier — Cloudflare R2 attachment buckets (v5 provider), isolated so
  # the v4 product/edge stacks are untouched. Only needs the state backend
  # (bootstrap) + the Cloudflare account/token vars; independent of edge.
