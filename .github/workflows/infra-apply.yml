# =============================================================================
# Infrastructure · Apply — applies changed live/ stacks on push to main.
# (OpenTofu under the hood — named by capability, not tool.)
#
# A `detect` job diffs the push and selects candidate stacks (a change to this
# workflow selects everything; manual dispatch selects all). Each stack
# then plans to a saved file with -detailed-exitcode and applies ONLY that exact
# file, and ONLY when the plan shows changes (exit 2) — an unchanged stack is
# skipped, so a workflow/module edit never silently re-applies live infra.
# EVERY apply job runs in the GitHub Environment `production` (audit-infra
# 2026-11-02 C-2/A-4): it is the reviewer gate (the owner), the OIDC trust
# boundary (the Azure apply identity federates only environment:production; the
# state backend is Azure for every stack), and the home of the WRITE tokens (environment
# secrets CLOUDFLARE_API_TOKEN, GRAFANA_CLOUD_API_KEY, ... — PR plans only get
# the *_READONLY ones). A merge that changes a stack therefore waits for the
# owner's approval on the run page; while it waits it holds the apply
# concurrency lock (cancel-in-progress:false), so approve or reject promptly.
#
# storage-prod stays DELIBERATE-ONLY: it runs only via a manual workflow_dispatch
# with apply_prod=true (still gated by the same reviewer).
#
# AWS EXIT (2026-11-02): bootstrap, security-baseline, runtime-dev, runtime-prod
# and organization are RETIRED and are no longer applied here (their state is
# archived; account closure removes what is left). No job in this workflow holds
# AWS credentials: every stack uses the Azure backend and the Entra OIDC
# identity (environment: production).
# =============================================================================
name: Infrastructure · Apply

on:
  push:
    branches: [main]
    paths:
      - "live/**"
      - ".github/workflows/infra-apply.yml"
  workflow_dispatch:
    inputs:
      apply_prod:
        description: "Also apply the production-tier stack (storage-prod). Still gated by the production environment reviewer."
        type: boolean
        default: false
      allow_destructive:
        description: "Allow this run to DELETE or REPLACE DNS / identity resources (Cloudflare records, Access apps, tunnels, ...). Read the plan first: see docs/incidents/2026-10-09-edge-dns.md."
        type: boolean
        default: false

# Serialize applies on the same ref so two quick merges can't race the tofu
# state lock. Never cancel a running apply mid-flight.
concurrency:
  group: infra-apply-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TOFU_VERSION: "1.9.1"

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Which live/ stacks changed in this push? (workflow change, or a
  # manual dispatch → apply all.) Downstream jobs gate on this list.
  # ───────────────────────────────────────────────────────────────────────
  detect:
    name: Detect changed stacks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stacks: ${{ steps.changes.outputs.stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute changed stacks
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # `observability` is NOT in this list: it cannot be planned (its state holds grafana_* objects whose provider alias the
          # 2026-09-20 split removed, so every plan fails with "Provider configuration not present ... (orphan)"), and an all-stacks run
          # that includes it is red every time. A change under live/observability/ still selects it below, so that remains visible.
          # Put it back in this list with the state migration: docs/runbooks/observability-state-migration.md.
          ALL='"edge","storage-dev","storage-prod","observability-alerting","adaptive-metrics","onprem","github"'
          # Manual dispatch or an unknown/zero base commit → apply everything.
          if [ -z "${BEFORE:-}" ] || [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "stacks=[$ALL]" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED="$(git diff --name-only "$BEFORE" "$AFTER")"
          echo "Changed files:"; echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^\.github/workflows/infra-apply\.yml$'; then
            echo "stacks=[$ALL]" >> "$GITHUB_OUTPUT"; exit 0
          fi
          SEL=""
          for s in edge storage-dev storage-prod observability observability-alerting adaptive-metrics onprem github; do
            if echo "$CHANGED" | grep -qE "^live/$s/"; then SEL="$SEL\"$s\","; fi
          done
          echo "stacks=[${SEL%,}]" >> "$GITHUB_OUTPUT"

          # ── STACKS THIS PIPELINE DOES NOT APPLY ───────────────────────────
          # Reported, NOT applied, and the distinction is deliberate.
          #
          # The list above is hardcoded, and `organization` (applied out of band) is not in it.
          # infra-plan.yml derives its list from the filesystem so a stack cannot be silently
          # unplanned. This job does NOT do the same, on purpose: adding a stack
          # here starts APPLYING it on merge to main, which should be a decision, not a side effect.
          #
          # So the gap is printed on every run instead of closed quietly. Silence
          # would let "merged" read as "applied", which for such a stack it is not.
          UNMANAGED=""
          for d in $(find live -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; \
                       | sed 's|^live/||' | sort -u); do
            case " edge storage-dev storage-prod observability observability-alerting adaptive-metrics onprem github " in
              *" $d "*) ;;
              *) UNMANAGED="$UNMANAGED $d" ;;
            esac
          done
          if [ -n "$UNMANAGED" ]; then
            echo "::warning::on disk but never applied by this pipeline:$UNMANAGED"
          fi

  apply-edge:
    name: Apply edge
    needs: [detect]
    if: ${{ contains(fromJson(needs.detect.outputs.stacks), 'edge') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production   # Cloudflare edge — account/zone-wide
    permissions:
      contents: read
      id-token: write
      pull-requests: read   # destructive-guard reads the PR labels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # tofu only: this stack's state is on Azure, so the job holds no AWS
      # credentials (the apply identity federates environment:production).
      - uses: quynhonsemiconductor/ci/actions/iac-lint@ea2c56bd9b03fb4d52e8fb9fe98dca95fd278638 # v1.24.5
        with:
          tofu-version: ${{ env.TOFU_VERSION }}
          fmt: 'false'   # install only

      - name: tofu init
        working-directory: live/edge
        run: tofu init -input=false
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      - name: tofu plan
        id: plan
        working-directory: live/edge
        run: |
          set -euo pipefail
          # preflight: refuse placeholder variable values — an apply with
          # SETME/example.invalid/all-zero values would create real Access
          # apps and DNS pointing nowhere
          bad=0
          for v in "GRP_PLATFORM_ADMINS_ID:${TF_VAR_grp_platform_admins_id-}" "GRP_DEVELOPERS_ID:${TF_VAR_grp_developers_id-}" \
                   "ENTRA_TENANT_ID:${TF_VAR_entra_tenant_id-}" "ENTRA_IDP_CLIENT_ID:${TF_VAR_entra_idp_client_id-}" \
                   "ENTRA_IDP_CLIENT_SECRET:${TF_VAR_entra_idp_client_secret-}"; do
            name="${v%%:*}"; value="${v#*:}"
            if [ -z "$value" ] || printf '%s' "$value" | grep -Eq 'SETME|SET-VIA-CI|example\.invalid|^0{8}-|^0+$'; then
              echo "::error::edge apply: $name holds a placeholder or is empty — the owner must set the real value before apply"
              bad=1
            fi
          done
          [ "$bad" = "0" ] || exit 1
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          TF_VAR_cloudflare_api_token:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id:    ${{ vars.CLOUDFLARE_ZONE_ID }}
          # secrets, not vars: admin_hostnames is a sensitive label->hostname map —
          # vars print in job logs / PR text, secrets are masked (edge v5 migration)
          TF_VAR_admin_hostnames: ${{ secrets.ADMIN_HOSTNAMES }}
          # WARP split-tunnel exclude = the default list minus this range. Same secret live/onprem uses.
          TF_VAR_admin_private_cidr: ${{ secrets.ADMIN_PRIVATE_CIDR }}
          # Extra WARP split-tunnel excludes (partner VPN endpoints), JSON list of {address, description}.
          # A secret, not a var: partner addresses must not print in public logs.
          TF_VAR_warp_extra_excludes: ${{ secrets.WARP_EXTRA_EXCLUDES || '[]' }}
          TF_VAR_tunnels_exist: ${{ vars.TUNNELS_EXIST }}
          TF_VAR_grp_platform_admins_id: ${{ vars.ENTRA_GRP_PLATFORM_ADMINS_ID }}
          TF_VAR_grp_developers_id: ${{ vars.ENTRA_GRP_DEVELOPERS_ID }}
          TF_VAR_entra_tenant_id: ${{ vars.ENTRA_TENANT_ID }}
          TF_VAR_entra_idp_client_id: ${{ vars.ENTRA_IDP_CLIENT_ID }}
          TF_VAR_entra_idp_client_secret: ${{ secrets.ENTRA_IDP_CLIENT_SECRET }}

      # A provider bump, a lock-file change or an empty variable can turn a plan into "replace every DNS record" (2026-10-09).
      # The plan is applied unreviewed here, so it is read first: deleting or replacing a DNS/identity resource needs the
      # `allow-dns-destroy` label on the merged PR (or the allow_destructive dispatch input).
      - name: Refuse destructive DNS / identity changes
        if: steps.plan.outputs.exitcode == '2'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@ea2c56bd9b03fb4d52e8fb9fe98dca95fd278638 # v1.24.5
        with:
          working-directory: live/edge
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/edge
        run: tofu apply -input=false tfplan
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

  # ───────────────────────────────────────────────────────────────────────
  # Shared observability — the one Grafana Cloud stack every product's
  # already-wired OTel sidecar (tf-modules/modules/observability-agent)
  # pushes to. No VPC, no ALB, no other stack's remote state — this is a
  # standalone Grafana Cloud resource, so it depends on nothing but the
  # Grafana credential. Platform blast radius, same reviewer gate as
  # edge.
  # ───────────────────────────────────────────────────────────────────────
  apply-observability:
    name: Apply observability
    needs: [detect]
    if: ${{ contains(fromJson(needs.detect.outputs.stacks), 'observability') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production   # platform blast radius — auto-apply on merge (parity with observability-alerting); the PR review is the gate
    permissions:
      contents: read
      id-token: write
      pull-requests: read   # destructive-guard reads the PR labels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # tofu only: this stack's state is on Azure, so the job holds no AWS
      # credentials (the apply identity federates environment:production).
      - uses: quynhonsemiconductor/ci/actions/iac-lint@ea2c56bd9b03fb4d52e8fb9fe98dca95fd278638 # v1.24.5
        with:
          tofu-version: ${{ env.TOFU_VERSION }}
          fmt: 'false'   # install only

      - name: tofu init
        working-directory: live/observability
        run: tofu init -input=false
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      - name: tofu plan
        id: plan
        working-directory: live/observability
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          TF_VAR_grafana_cloud_api_key: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
          TF_VAR_teams_webhook_url: ${{ secrets.TEAMS_ALERTS_WEBHOOK_URL }}
          TF_VAR_office_ip: ${{ vars.OFFICE_IP }}

      # A provider bump, a lock-file change or an empty variable can turn a plan into "replace every DNS record" (2026-10-09).
      # The plan is applied unreviewed here, so it is read first: deleting or replacing a DNS/identity resource needs the
      # `allow-dns-destroy` label on the merged PR (or the allow_destructive dispatch input).
      - name: Refuse destructive DNS / identity changes
        if: steps.plan.outputs.exitcode == '2'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@ea2c56bd9b03fb4d52e8fb9fe98dca95fd278638 # v1.24.5
        with:
          working-directory: live/observability
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/observability
        run: tofu apply -input=false tfplan
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

  apply-observability-alerting:
    name: Apply observability-alerting
    # After the observability job: this stack reads its state (Grafana url and token).
    needs: [detect, apply-observability]
    if: ${{ always() && contains(fromJson(needs.detect.outputs.stacks), 'observability-alerting') && needs.apply-observability.result != 'failure' && needs.apply-observability.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production   # platform blast radius — auto-apply on merge (parity with observability-alerting); the PR review is the gate
    permissions:
      contents: read
      id-token: write
      pull-requests: read   # destructive-guard reads the PR labels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # tofu only: this stack's state is on Azure, so the job holds no AWS
      # credentials (the apply identity federates environment:production).
      - uses: quynhonsemiconductor/ci/actions/iac-lint@ea2c56bd9b03fb4d52e8fb9fe98dca95fd278638 # v1.24.5
        with:
          tofu-version: ${{ env.TOFU_VERSION }}
          fmt: 'false'   # install only

      - name: tofu init
        working-directory: live/observability-alerting
        run: tofu init -input=false
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      - name: tofu plan
        id: plan
        working-directory: live/observability-alerting
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          TF_VAR_teams_webhook_url: ${{ secrets.TEAMS_ALERTS_WEBHOOK_URL }}
          TF_VAR_office_ip: ${{ vars.OFFICE_IP }}
          # opshub prod monitoring (live/observability-alerting/opshub-prod.tf) —
          # scoped to THIS stack's apply job only; empty until the Stage D2
          # cutover, see that file's header for the flip procedure.
          TF_VAR_grafana_sm_token:       ${{ secrets.GRAFANA_SM_TOKEN }}
          TF_VAR_healthchecks_api_token: ${{ secrets.HEALTHCHECKS_API_TOKEN }}

      # A provider bump, a lock-file change or an empty variable can turn a plan into "replace every DNS record" (2026-10-09).
      # The plan is applied unreviewed here, so it is read first: deleting or replacing a DNS/identity resource needs the
      # `allow-dns-destroy` label on the merged PR (or the allow_destructive dispatch input).
      - name: Refuse destructive DNS / identity changes
        if: steps.plan.outputs.exitcode == '2'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@ea2c56bd9b03fb4d52e8fb9fe98dca95fd278638 # v1.24.5
        with:
          working-directory: live/observability-alerting
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/observability-alerting
        run: |
          # UUID redaction: same reason as the plan step — healthchecksio check
          # ids/ping_urls are not sensitive per the provider but ARE working
          # ping URLs (UUID pings stay accepted) and this log is public.
          set -o pipefail
          tofu apply -input=false tfplan 2>&1 \
            | sed -E 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/<redacted>/g' \
            | tee apply.txt
          ec=${PIPESTATUS[0]}
          echo "tofu apply exit: $ec"
          exit "$ec"
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

  apply-adaptive-metrics:
    name: Apply adaptive-metrics
    needs: [detect]
    if: ${{ contains(fromJson(needs.detect.outputs.stacks), 'adaptive-metrics') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production   # platform blast radius — auto-apply on merge (parity with observability-alerting); the PR review is the gate
    permissions:
      contents: read
      id-token: write
      pull-requests: read   # destructive-guard reads the PR labels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # tofu only: this stack's state is on Azure, so the job holds no AWS
      # credentials (the apply identity federates environment:production).
      - uses: quynhonsemiconductor/ci/actions/iac-lint@ea2c56bd9b03fb4d52e8fb9fe98dca95fd278638 # v1.24.5
        with:
          tofu-version: ${{ env.TOFU_VERSION }}
          fmt: 'false'   # install only

      - name: tofu init
        working-directory: live/adaptive-metrics
        run: tofu init -input=false
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      - name: tofu plan
        id: plan
        working-directory: live/adaptive-metrics
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          # The AM provider validates the token at configure (fetches the rule
          # state), so a rejected credential fails HERE — the plan itself is the
          # API-acceptance check for auth; the aggregation strings are proven by
          # the apply below (the API validates them per rule).
          TF_VAR_adaptive_metrics_url:   ${{ vars.AM_METRICS_URL }}
          TF_VAR_adaptive_metrics_api_key: ${{ secrets.GRAFANA_ADAPTIVE_METRICS_API_TOKEN }}

      - name: Refuse destructive DNS / identity changes
        if: steps.plan.outputs.exitcode == '2'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@ea2c56bd9b03fb4d52e8fb9fe98dca95fd278638 # v1.24.5
        with:
          working-directory: live/adaptive-metrics
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/adaptive-metrics
        run: |
          set -o pipefail
          tofu apply -input=false tfplan 2>&1 | tee apply.txt
          ec=${PIPESTATUS[0]}
          echo "tofu apply exit: $ec"
          exit "$ec"
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          TF_VAR_adaptive_metrics_url:   ${{ vars.AM_METRICS_URL }}
          TF_VAR_adaptive_metrics_api_key: ${{ secrets.GRAFANA_ADAPTIVE_METRICS_API_TOKEN }}

  # live/github — GitHub organisation config (rulesets, platform repo settings, infra
  # environments). State on Azure like the other stacks; the only credential besides
  # Azure OIDC is the WRITE fine-grained token, an environment secret of `production`
  # (GH_IAC_TOKEN), which is why this job pins that environment: the required reviewer
  # is the human gate, and the plan below is what the reviewer approves. The stack has
  # prevent_destroy on every ruleset and repository, so a bad edit fails the plan
  # instead of deleting branch protection.
  apply-github:
    name: Apply github
    needs: [detect]
    if: ${{ contains(fromJson(needs.detect.outputs.stacks), 'github') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production   # org-wide repository protection — the reviewer gate
    permissions:
      contents: read
      id-token: write
      pull-requests: read   # destructive-guard reads the PR labels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/iac-lint@ea2c56bd9b03fb4d52e8fb9fe98dca95fd278638 # v1.24.5
        with:
          tofu-version: ${{ env.TOFU_VERSION }}
          fmt: 'false'   # install only

      - name: tofu init
        working-directory: live/github
        run: tofu init -input=false
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      - name: tofu plan
        id: plan
        working-directory: live/github
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          TF_VAR_github_token: ${{ secrets.GH_IAC_TOKEN }}

      - name: Refuse destructive DNS / identity changes
        if: steps.plan.outputs.exitcode == '2'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@ea2c56bd9b03fb4d52e8fb9fe98dca95fd278638 # v1.24.5
        with:
          working-directory: live/github
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/github
        run: |
          set -o pipefail
          tofu apply -input=false tfplan 2>&1 | tee apply.txt
          ec=${PIPESTATUS[0]}
          echo "tofu apply exit: $ec"
          exit "$ec"
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          TF_VAR_github_token: ${{ secrets.GH_IAC_TOKEN }}

  # live/onprem — the on-prem doors (Cloudflare Tunnels). Azure OIDC ONLY: the
  # azurerm backend (stqnsctfstate, Entra auth) and the cloudflare provider; the
  # stack holds no AWS resources, so no AWS role is assumed here. The apply
  # identity (vars.AZURE_CLIENT_ID) federates ONLY the `production` environment,
  # which is why this job pins environment: production — its required reviewers
  # are the human gate (the plan output is the PR review).
  apply-onprem:
    name: Apply onprem
    needs: [detect]
    if: ${{ contains(fromJson(needs.detect.outputs.stacks), 'onprem') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production   # PROTECT with required reviewers — the apply identity's OIDC subject
    permissions:
      contents: read
      id-token: write
      pull-requests: read   # destructive-guard reads the PR labels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # tofu only: this stack never touches AWS, so the job
      # must not hold AWS credentials it cannot use.
      - uses: quynhonsemiconductor/ci/actions/iac-lint@ea2c56bd9b03fb4d52e8fb9fe98dca95fd278638 # v1.24.5
        with:
          tofu-version: ${{ env.TOFU_VERSION }}
          fmt: 'false'   # install only — the gates run in the plan workflow

      - name: tofu init
        working-directory: live/onprem
        run: tofu init -input=false
        env:
          # The APPLY identity — environment:production above makes the OIDC
          # subject match its federation. Apply keeps state LOCKING (unlike the
          # lock-free plan/drift paths).
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      - name: tofu plan
        id: plan
        working-directory: live/onprem
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_admin_private_cidr:    ${{ secrets.ADMIN_PRIVATE_CIDR }}
          TF_VAR_admin_hostnames:       ${{ secrets.ADMIN_HOSTNAMES }}

      - name: Refuse destructive DNS / identity changes
        if: steps.plan.outputs.exitcode == '2'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@ea2c56bd9b03fb4d52e8fb9fe98dca95fd278638 # v1.24.5
        with:
          working-directory: live/onprem
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/onprem
        run: |
          set -o pipefail
          tofu apply -input=false tfplan 2>&1 | tee apply.txt
          ec=${PIPESTATUS[0]}
          echo "tofu apply exit: $ec"
          exit "$ec"
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_admin_private_cidr:    ${{ secrets.ADMIN_PRIVATE_CIDR }}
          TF_VAR_admin_hostnames:       ${{ secrets.ADMIN_HOSTNAMES }}

  # ───────────────────────────────────────────────────────────────────────
  # storage tier — Cloudflare R2 attachment buckets (v5 provider), isolated so
  # the v4 product/edge stacks are untouched. Only needs the Cloudflare
  # account/token vars; independent of edge.
  # ───────────────────────────────────────────────────────────────────────
  apply-storage-dev:
    name: Apply storage-dev
    needs: [detect]
    if: ${{ contains(fromJson(needs.detect.outputs.stacks), 'storage-dev') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
      pull-requests: read   # destructive-guard reads the PR labels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # tofu only: this stack's state is on Azure, so the job holds no AWS
      # credentials (the apply identity federates environment:production).
      - uses: quynhonsemiconductor/ci/actions/iac-lint@ea2c56bd9b03fb4d52e8fb9fe98dca95fd278638 # v1.24.5
        with:
          tofu-version: ${{ env.TOFU_VERSION }}
          fmt: 'false'   # install only

      - name: tofu init
        working-directory: live/storage-dev
        run: tofu init -input=false
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      - name: tofu plan
        id: plan
        working-directory: live/storage-dev
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          TF_VAR_cloudflare_api_token:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id:    ${{ vars.CLOUDFLARE_ZONE_ID }}

      # A provider bump, a lock-file change or an empty variable can turn a plan into "replace every DNS record" (2026-10-09).
      # The plan is applied unreviewed here, so it is read first: deleting or replacing a DNS/identity resource needs the
      # `allow-dns-destroy` label on the merged PR (or the allow_destructive dispatch input).
      - name: Refuse destructive DNS / identity changes
        if: steps.plan.outputs.exitcode == '2'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@ea2c56bd9b03fb4d52e8fb9fe98dca95fd278638 # v1.24.5
        with:
          working-directory: live/storage-dev
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/storage-dev
        run: tofu apply -input=false tfplan
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

  apply-storage-prod:
    name: Apply storage-prod
    needs: [detect]
    # Prod is deliberate-only: runs solely on a manual workflow_dispatch with
    # apply_prod=true (then still reviewer-gated). Never queued on a push, so a
    # normal merge can't leave a pending prod job holding the concurrency lock.
    if: ${{ always() && contains(fromJson(needs.detect.outputs.stacks), 'storage-prod') && github.event_name == 'workflow_dispatch' && inputs.apply_prod }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production   # PROTECT with required reviewers
    permissions:
      contents: read
      id-token: write
      pull-requests: read   # destructive-guard reads the PR labels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # tofu only: this stack's state is on Azure, so the job holds no AWS
      # credentials (the apply identity federates environment:production).
      - uses: quynhonsemiconductor/ci/actions/iac-lint@ea2c56bd9b03fb4d52e8fb9fe98dca95fd278638 # v1.24.5
        with:
          tofu-version: ${{ env.TOFU_VERSION }}
          fmt: 'false'   # install only

      - name: tofu init
        working-directory: live/storage-prod
        run: tofu init -input=false
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      - name: tofu plan
        id: plan
        working-directory: live/storage-prod
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          TF_VAR_cloudflare_api_token:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id:    ${{ vars.CLOUDFLARE_ZONE_ID }}

      # A provider bump, a lock-file change or an empty variable can turn a plan into "replace every DNS record" (2026-10-09).
      # The plan is applied unreviewed here, so it is read first: deleting or replacing a DNS/identity resource needs the
      # `allow-dns-destroy` label on the merged PR (or the allow_destructive dispatch input).
      - name: Refuse destructive DNS / identity changes
        if: steps.plan.outputs.exitcode == '2'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@ea2c56bd9b03fb4d52e8fb9fe98dca95fd278638 # v1.24.5
        with:
          working-directory: live/storage-prod
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/storage-prod
        run: tofu apply -input=false tfplan
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
