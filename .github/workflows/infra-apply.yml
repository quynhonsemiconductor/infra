# =============================================================================
# Infrastructure · Apply — applies changed live/ stacks on push to main.
# (OpenTofu under the hood — named by capability, not tool.)
#
# A `detect` job diffs the push and selects candidate stacks (a modules/ or
# workflow change selects everything; manual dispatch selects all). Each stack
# then plans to a saved file with -detailed-exitcode and applies ONLY that exact
# file, and ONLY when the plan shows changes (exit 2) — an unchanged stack is
# skipped, so a workflow/module edit never silently re-applies live infra.
# Each stack runs under a GitHub Environment that doubles as the OIDC trust
# boundary AND the reviewer gate, mapped to the three tiers the infra-apply
# role trusts (see tf-modules/modules/iam-oidc infra_apply_subjects):
#   • shared     → bootstrap, security-baseline, edge, observability (account/platform-wide)
#   • develop    → runtime-dev, storage-dev
#   • production → runtime-prod, storage-prod (protect with required reviewers)
#
# PROD IS DELIBERATE-ONLY: the production-tier jobs never run on an ordinary
# push to main. On a push they would sit pending on the reviewer gate and, with
# cancel-in-progress:false, hold the apply concurrency lock — blocking every
# later dev apply. They run ONLY via a manual workflow_dispatch with
# apply_prod=true, and are still gated by the production environment's required
# reviewer. A normal merge applies shared + develop only. (Mirrors the
# tag-gated prod model in the product repos.)
#
# NOTE: First-time bootstrap must be run manually (see live/bootstrap/main.tf
# history — the state-backend/OIDC-provider chicken-and-egg). This workflow
# handles subsequent changes and first-time apply of every later stack.
# =============================================================================
name: Infrastructure · Apply

on:
  push:
    branches: [main]
    paths:
      - "live/**"
      - "modules/**"
      - ".github/workflows/infra-apply.yml"
  workflow_dispatch:
    inputs:
      apply_prod:
        description: "Also apply the production-tier stacks (runtime-prod, storage-prod). Still gated by the production environment reviewer."
        type: boolean
        default: false

# Serialize applies on the same ref so two quick merges can't race the tofu
# state lock. Never cancel a running apply mid-flight.
concurrency:
  group: infra-apply-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TOFU_VERSION: "1.9.1"
  AWS_REGION: ap-southeast-1

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Which live/ stacks changed in this push? (modules/ or workflow change, or a
  # manual dispatch → apply all.) Downstream jobs gate on this list.
  # ───────────────────────────────────────────────────────────────────────
  detect:
    name: Detect changed stacks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stacks: ${{ steps.changes.outputs.stacks }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute changed stacks
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          ALL='"bootstrap","security-baseline","runtime-dev","runtime-prod","edge","storage-dev","storage-prod","observability"'
          # Manual dispatch or an unknown/zero base commit → apply everything.
          if [ -z "${BEFORE:-}" ] || [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "stacks=[$ALL]" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED="$(git diff --name-only "$BEFORE" "$AFTER")"
          echo "Changed files:"; echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(modules/|\.github/workflows/infra-apply\.yml$)'; then
            echo "stacks=[$ALL]" >> "$GITHUB_OUTPUT"; exit 0
          fi
          SEL=""
          for s in bootstrap security-baseline runtime-dev runtime-prod edge storage-dev storage-prod observability; do
            if echo "$CHANGED" | grep -qE "^live/$s/"; then SEL="$SEL\"$s\","; fi
          done
          echo "stacks=[${SEL%,}]" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────
  # shared tier — bootstrap first (everything reads its remote state).
  # ───────────────────────────────────────────────────────────────────────
  apply-bootstrap:
    name: Apply bootstrap
    needs: detect
    if: ${{ contains(fromJson(needs.detect.outputs.stacks), 'bootstrap') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: shared   # platform blast radius — gate with required reviewers
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@v1
        with:
          role-arn:     arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region:   ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: live/bootstrap
        run: tofu init -input=false

      # Plan to a saved file (-detailed-exitcode: 0=no change, 1=error, 2=changes).
      # We apply ONLY that exact file, and only when there are changes — an
      # unchanged stack is skipped, so a workflow/module edit never re-applies it.
      - name: tofu plan
        id: plan
        working-directory: live/bootstrap
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/bootstrap
        run: tofu apply -input=false tfplan

  apply-security-baseline:
    name: Apply security-baseline
    needs: [detect, apply-bootstrap]
    if: ${{ always() && contains(fromJson(needs.detect.outputs.stacks), 'security-baseline') && needs.apply-bootstrap.result != 'failure' && needs.apply-bootstrap.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: shared   # account-wide audit controls
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@v1
        with:
          role-arn:     arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region:   ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: live/security-baseline
        run: tofu init -input=false

      - name: tofu plan
        id: plan
        working-directory: live/security-baseline
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/security-baseline
        run: tofu apply -input=false tfplan

  apply-edge:
    name: Apply edge
    needs: [detect, apply-bootstrap]
    if: ${{ always() && contains(fromJson(needs.detect.outputs.stacks), 'edge') && needs.apply-bootstrap.result != 'failure' && needs.apply-bootstrap.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: shared   # Cloudflare edge — account/zone-wide
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@v1
        with:
          role-arn:     arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region:   ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: live/edge
        run: tofu init -input=false

      - name: tofu plan
        id: plan
        working-directory: live/edge
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          TF_VAR_cloudflare_api_token:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/edge
        run: tofu apply -input=false tfplan

  # ───────────────────────────────────────────────────────────────────────
  # develop / production tiers — shared runtime networking per env.
  # ───────────────────────────────────────────────────────────────────────
  apply-runtime-dev:
    name: Apply runtime-dev
    needs: [detect, apply-bootstrap, apply-edge]
    if: ${{ always() && contains(fromJson(needs.detect.outputs.stacks), 'runtime-dev') && needs.apply-bootstrap.result != 'failure' && needs.apply-bootstrap.result != 'cancelled' && needs.apply-edge.result != 'failure' && needs.apply-edge.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: develop
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@v1
        with:
          role-arn:     arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region:   ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: live/runtime-dev
        run: tofu init -input=false

      - name: tofu plan
        id: plan
        working-directory: live/runtime-dev
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/runtime-dev
        run: tofu apply -input=false tfplan

  # ───────────────────────────────────────────────────────────────────────
  # Shared observability — the one Grafana Cloud stack every product's
  # already-wired OTel sidecar (tf-modules/modules/observability-agent)
  # pushes to. No VPC, no ALB, no other stack's remote state — this is a
  # standalone Grafana Cloud resource, so it depends on nothing but the
  # Grafana credential. Platform blast radius, same reviewer gate as
  # bootstrap/edge.
  # ───────────────────────────────────────────────────────────────────────
  apply-observability:
    name: Apply observability
    needs: [detect]
    if: ${{ contains(fromJson(needs.detect.outputs.stacks), 'observability') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: shared   # platform blast radius — gate with required reviewers
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@v1
        with:
          role-arn:     arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region:   ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: live/observability
        run: tofu init -input=false

      - name: tofu plan
        id: plan
        working-directory: live/observability
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          TF_VAR_grafana_cloud_api_key: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
          TF_VAR_teams_webhook_url: ${{ secrets.TEAMS_ALERTS_WEBHOOK_URL }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/observability
        run: tofu apply -input=false tfplan

  apply-runtime-prod:
    name: Apply runtime-prod
    needs: [detect, apply-bootstrap, apply-edge]
    # Prod is deliberate-only: runs solely on a manual workflow_dispatch with
    # apply_prod=true (then still reviewer-gated). Never queued on a push, so a
    # normal merge can't leave a pending prod job holding the concurrency lock.
    if: ${{ always() && contains(fromJson(needs.detect.outputs.stacks), 'runtime-prod') && needs.apply-bootstrap.result != 'failure' && needs.apply-bootstrap.result != 'cancelled' && needs.apply-edge.result != 'failure' && needs.apply-edge.result != 'cancelled' && github.event_name == 'workflow_dispatch' && inputs.apply_prod }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production   # PROTECT with required reviewers
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@v1
        with:
          role-arn:     arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region:   ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: live/runtime-prod
        run: tofu init -input=false

      - name: tofu plan
        id: plan
        working-directory: live/runtime-prod
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/runtime-prod
        run: tofu apply -input=false tfplan

  # ───────────────────────────────────────────────────────────────────────
  # storage tier — Cloudflare R2 attachment buckets (v5 provider), isolated so
  # the v4 product/edge stacks are untouched. Only needs the state backend
  # (bootstrap) + the Cloudflare account/token vars; independent of edge.
  # ───────────────────────────────────────────────────────────────────────
  apply-storage-dev:
    name: Apply storage-dev
    needs: [detect, apply-bootstrap]
    if: ${{ always() && contains(fromJson(needs.detect.outputs.stacks), 'storage-dev') && needs.apply-bootstrap.result != 'failure' && needs.apply-bootstrap.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: develop
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@v1
        with:
          role-arn:     arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region:   ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: live/storage-dev
        run: tofu init -input=false

      - name: tofu plan
        id: plan
        working-directory: live/storage-dev
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          TF_VAR_cloudflare_api_token:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/storage-dev
        run: tofu apply -input=false tfplan

  apply-storage-prod:
    name: Apply storage-prod
    needs: [detect, apply-bootstrap]
    # Prod is deliberate-only: runs solely on a manual workflow_dispatch with
    # apply_prod=true (then still reviewer-gated). Never queued on a push, so a
    # normal merge can't leave a pending prod job holding the concurrency lock.
    if: ${{ always() && contains(fromJson(needs.detect.outputs.stacks), 'storage-prod') && needs.apply-bootstrap.result != 'failure' && needs.apply-bootstrap.result != 'cancelled' && github.event_name == 'workflow_dispatch' && inputs.apply_prod }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production   # PROTECT with required reviewers
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@v1
        with:
          role-arn:     arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region:   ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: live/storage-prod
        run: tofu init -input=false

      - name: tofu plan
        id: plan
        working-directory: live/storage-prod
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -out tfplan -no-color 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}   # tofu's real exit, independent of the tee pipe
          echo "tofu plan detailed exit code: $ec (0=no change, 2=changes, 1=error)"
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" = "1" ]; then exit 1; fi
        env:
          TF_VAR_cloudflare_api_token:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: live/storage-prod
        run: tofu apply -input=false tfplan
