# =============================================================================
# Drift detection — nightly comparison of every platform stack against reality.
#
# WHY. An audit on 2026-09-12 found six comments asserting deployed state that was wrong
# ("NOT YET APPLIED" for a stack whose state file exists, "Nothing of opshub is deployed"
# for a deployed product, "opshub uses a per-task Valkey sidecar" for a product with a real
# ElastiCache node). Comments were the only record of what was deployed, and nothing could
# verify a sentence. This job replaces narration with a nightly check.
#
# TWO DIRECTIONS, deliberately, because they are different failures with different fixes:
#
#   1. EXTERNAL DRIFT (`plan -refresh-only`) — reality moved away from state. Someone
#      changed a resource in the console, or AWS changed it. Fix: adopt, revert, or ignore.
#
#   2. UNAPPLIED CONFIG (`plan`) — main moved away from reality. Apply runs on push to main,
#      so a non-empty plan here means an apply failed, was skipped by a path filter, or was
#      never triggered. This is the class that hid rova's missing alarm subscriptions: the
#      correct address sat on main while zero subscriptions existed in AWS.
#
# A plain `plan` alone cannot tell these apart — it returns exit 2 for both — which is why
# the refresh-only pass runs first and is reported separately.
#
# WHAT THIS CANNOT SEE: resources that were never in state. `plan` diffs what OpenTofu
# knows about, so a resource created outside it has no address to compare. That gap is
# covered by unmanaged-resources.yml, which is a different mechanism for a different class.
# Neither replaces the other.
#
# CREDENTIALS. The Cloudflare stacks (edge, storage-*) are planned with a SEPARATE, READ-ONLY token,
# secrets.CLOUDFLARE_API_TOKEN_READONLY, never the write token the apply uses. A detector must not be able to change
# what it detects, and a scheduled job on a PR-less trigger is the wrong place for a token that can edit DNS.
# Scopes (read only): Zone:Read, DNS:Read, Zone WAF:Read (rulesets), Account: Cloudflare Pages:Read, Workers R2
# Storage:Read, Turnstile:Read. If the secret is missing the job FAILS with that message; it does not fall back.
# Before 2026-10-09 this job passed no Cloudflare token at all, so edge and storage-* errored every night
# ("drift job red") and the red had become background noise: nobody saw the destroyed DNS records for three days.
#
# WHAT COUNTS AS A FAILURE. The unapplied-config pass (`plan`) fails the stack on ANY change: main moved away from
# reality. The refresh-only pass fails it only for drift that matters (drift mode of the shared destructive-guard action): a resource DELETED
# outside OpenTofu, or any change to a DNS / edge / mail-identity / certificate / key resource. Other refresh-only drift
# (provider-computed attributes: user_group_ids = [], tags = {}, security-group ingress that separate rule resources
# added) is printed in the summary as informational. Reported nightly it was pure noise on the (since retired) AWS stacks,
# and an alarm that fires every night is one nobody reads.
#
# A FAILED RUN ALERTS. A red scheduled run only emails whoever last touched the cron line. The `alert` job opens (or
# updates) one GitHub issue labelled `drift-detection` and posts to the platform Teams channel, for ANY non-success
# of any stack, including a plan that errored. See docs/incidents/2026-10-09-edge-dns.md.
# =============================================================================
name: Drift detection

on:
  schedule:
    # 07:30 Asia/Ho_Chi_Minh. Cron is UTC-only, hence 00:30. Before the working day, so the
    # first person in reads the result rather than discovering it mid-change. Offset from
    # unmanaged-resources (01:15) and pin-drift (01:00) to spread runner usage.
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  TOFU_VERSION: "1.13.2"

jobs:
  drift:
    name: Drift ${{ matrix.stack }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        # The same stacks infra-apply.yml manages, less observability (below). The AWS stacks
        # (bootstrap, security-baseline, runtime-dev, runtime-prod, organization) were retired on
        # 2026-11-02 (AWS exit; state archived): they are not planned any more.
        #
        # `observability` is EXCLUDED, with a reason: drift detection means a full refresh, and the read-only
        # token cannot do one. Grafana Cloud has no stack-service-accounts:read scope (only :write), so refreshing
        # grafana_cloud_stack_service_account.alerting returns 403 for any read-only key, and the write key must
        # not reach a scheduled read job. Its PR plan therefore runs with -refresh=false (infra-plan.yml) and the
        # real refresh happens in the production apply job. Left in, this entry would be a permanent red every night.
        stack:
          - edge
          - storage-dev
          - storage-prod
          # Included 2026-10-25 with the flip (GRAFANA_ADAPTIVE_METRICS_API_TOKEN +
          # AM_METRICS_URL exist); see live/adaptive-metrics/main.tf for why this
          # stack was previously excluded from planning entirely.
          - adaptive-metrics
          # The on-prem doors: azurerm backend (Entra OIDC, read identity), not
          # the S3 one — the ARM_* env blocks below carry it. Talks to Cloudflare, so the read-only
          # token check applies (contains lists updated with it).
          - onprem
          # github is NOT here: the read app cannot see repository bypass actors or merge settings, so a
          # nightly read-only refresh would be red every night. It has its own monthly job in
          # environment production (.github/workflows/github-drift.yml), planned with the apply app.
          #
          # identity: NEVER planned in infra-plan.yml (owner-only, public plan output), but a
          # REFRESH-ONLY comparison belongs here. It is planned with the same read identity
          # (Directory Readers reads app/group metadata and credential DATES, never values), through
          # the owner apply kit so every required TF_VAR_* comes from read-only lookups. Its plan text
          # is written to a file and NEVER printed, and the destructive-guard classifier is SKIPPED:
          # drift_report.py prints drifted resource ADDRESSES, and the identity for_each keys are user
          # and app object ids. This repo is public; exit 2 is red with a "details withheld" line only. Required repo secrets (owner):
          # IDENTITY_OWNER_OPERATOR_UPN, IDENTITY_SECOND_OWNER_UPN, IDENTITY_PROXMOX_HOST,
          # IDENTITY_PBS_HOST, IDENTITY_KV_AUDIT_EMAIL (added with the Key Vault alerts:
          # live/identity now has a required kv_audit_email with no default).
          - identity

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/iac-lint@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
        with:
          tofu-version: ${{ env.TOFU_VERSION }}
          fmt: 'false'   # install only

      # The identity kit reads Entra through the `az` CLI, so the CLI needs a login
      # of its own: the ARM_* OIDC variables below configure the PROVIDERS, not az.
      # Same one-exchange flow (and the same read identity) as secret-expiry.yml.
      - name: Azure login for the identity kit (read identity, OIDC)
        if: matrix.stack == 'identity'
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_READ }}
          AZURE_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r .value)"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::no federated token"; exit 1
          fi
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none

      - name: tofu init
        working-directory: live/${{ matrix.stack }}
        run: tofu init -input=false
        env:
          # Read identity, lock-free below: a detector never writes state.
          # The `&& … || ''` ternary renders an EMPTY STRING, not an unset
          # variable — harmless here (the azurerm backend and the cloudflare
          # provider only run for onprem), but do not read "" as "absent".
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID_READ }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      # edge carries private SSH target values in state: the guard masks them and refuses an empty secret
      # over a non-empty state. Same script as infra-plan.yml and infra-apply.yml.
      - name: SSH targets guard (edge)
        if: matrix.stack == 'edge'
        working-directory: live/edge
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ssh-targets-guard.sh"
        env:
          SSH_INFRA_TARGETS: ${{ secrets.SSH_INFRA_TARGETS }}
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_READ }}
          ARM_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC: 'true'

      - name: Require the read-only Cloudflare token
        if: ${{ contains(fromJSON('["edge","storage-dev","storage-prod","onprem"]'), matrix.stack) }}
        env:
          HAVE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READONLY != '' }}
        run: |
          if [ "$HAVE_TOKEN" != "true" ]; then
            echo "::error title=Drift cannot see Cloudflare::secrets.CLOUDFLARE_API_TOKEN_READONLY is not set. Create a READ-ONLY Cloudflare API token (scopes in this file's header) and add it as an organisation or repository secret. This job never falls back to the write token."
            exit 1
          fi

      # `-lock=false` because the read identity cannot take the blob lease on the state
      # file. Neither pass mutates state, so running lock-free is safe; apply still
      # locks via the admin role. PIPESTATUS[0] captures tofu's exit past the `tee`.
      - name: Detect external drift (refresh-only)
        id: refresh
        if: matrix.stack != 'identity'
        working-directory: live/${{ matrix.stack }}
        env:
          STACK: ${{ matrix.stack }}
          TF_VAR_cloudflare_zone_id:    ${{ vars.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Read-only token, and only for the stacks that talk to Cloudflare. Empty elsewhere on purpose.
          TF_VAR_cloudflare_api_token:  ${{ contains(fromJSON('["edge","storage-dev","storage-prod","onprem"]'), matrix.stack) && secrets.CLOUDFLARE_API_TOKEN_READONLY || '' }}
          # edge: every variable the stack declares WITHOUT a default (same set
          # infra-plan.yml passes; without them the nightly edge pass is red on
          # "required variable not set"). Secrets where the value is sensitive.
          TF_VAR_admin_hostnames:        ${{ contains(fromJSON('["edge","onprem"]'), matrix.stack) && secrets.ADMIN_HOSTNAMES || '' }}
          TF_VAR_tunnels_exist:          ${{ matrix.stack == 'edge' && vars.TUNNELS_EXIST || '' }}
          # MCP hub (live/edge/variables.mcp_hub.tf): flag and ids only; no client secret in drift (read-only run). `|| 'false'`: empty breaks the bool.
          TF_VAR_mcp_hub_enabled:                    ${{ matrix.stack == 'edge' && (vars.MCP_HUB_ENABLED || 'false') || 'false' }}
          TF_VAR_mcp_github_oauth_client_id:         ${{ matrix.stack == 'edge' && vars.MCP_GITHUB_OAUTH_CLIENT_ID || '' }}
          TF_VAR_mcp_grafana_oauth_client_id:        ${{ matrix.stack == 'edge' && vars.MCP_GRAFANA_OAUTH_CLIENT_ID || '' }}
          TF_VAR_mcp_grafana_authorization_endpoint: ${{ matrix.stack == 'edge' && vars.MCP_GRAFANA_AUTHORIZATION_ENDPOINT || '' }}
          TF_VAR_mcp_grafana_token_endpoint:         ${{ matrix.stack == 'edge' && vars.MCP_GRAFANA_TOKEN_ENDPOINT || '' }}
          TF_VAR_grp_platform_admins_id: ${{ matrix.stack == 'edge' && vars.ENTRA_GRP_PLATFORM_ADMINS_ID || '' }}
          TF_VAR_grp_developers_id:      ${{ matrix.stack == 'edge' && vars.ENTRA_GRP_DEVELOPERS_ID || '' }}
          TF_VAR_grp_dev_users_id:     ${{ matrix.stack == 'edge' && vars.ENTRA_GRP_DEV_USERS_ID || '' }}
          TF_VAR_grp_staff_id: ${{ matrix.stack == 'edge' && vars.ENTRA_GRP_STAFF_ID || '' }}
          TF_VAR_entra_tenant_id:        ${{ matrix.stack == 'edge' && vars.ENTRA_TENANT_ID || '' }}
          TF_VAR_entra_idp_client_id:    ${{ matrix.stack == 'edge' && vars.ENTRA_IDP_CLIENT_ID || '' }}
          TF_VAR_entra_idp_client_secret: ${{ matrix.stack == 'edge' && secrets.ENTRA_IDP_CLIENT_SECRET || '' }}
          # adaptive-metrics: the provider configures by calling the AM API, so the
          # nightly plan needs the token + URL here too (matrix-scoped, same form
          # as infra-plan.yml). Empty for every other stack.
          TF_VAR_adaptive_metrics_url:   ${{ matrix.stack == 'adaptive-metrics' && vars.AM_METRICS_URL || '' }}
          TF_VAR_adaptive_metrics_api_key: ${{ matrix.stack == 'adaptive-metrics' && secrets.GRAFANA_ADAPTIVE_METRICS_API_TOKEN_READONLY || '' }}
          # onprem: Azure OIDC (read identity) for the azurerm backend, and the
          # SAME TF_VAR_admin_* as the config pass — a refresh-only plan still
          # needs every required variable, and a missing one reads as drift. The
          # ternary below renders an empty string, not an unset variable.
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID_READ }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          TF_VAR_admin_private_cidr: ${{ contains(fromJSON('["onprem","edge"]'), matrix.stack) && secrets.ADMIN_PRIVATE_CIDR || '' }}
          TF_VAR_warp_extra_excludes: ${{ matrix.stack == 'edge' && secrets.WARP_EXTRA_EXCLUDES || '[]' }}
          TF_VAR_ssh_infra_targets:   ${{ matrix.stack == 'edge' && secrets.SSH_INFRA_TARGETS || '{}' }}
        run: |
          # edge: never printed — its plan text carries the private SSH target map. File only; the
          # summary below publishes counts, fingerprint and types. Other stacks keep the log stream.
          set +e
          if [ "$STACK" = "edge" ]; then
            tofu plan -refresh-only -input=false -lock=false -no-color -detailed-exitcode -out=refresh.tfplan > refresh.txt 2>&1
            ec=$?
            if [ "$ec" = "1" ]; then sed -n '/^╷/,/^╵/p' refresh.txt >&2; fi
          else
            tofu plan -refresh-only -input=false -lock=false -no-color -detailed-exitcode -out=refresh.tfplan 2>&1 | tee refresh.txt
            ec=${PIPESTATUS[0]}
          fi
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"

      - name: Detect unapplied config
        id: plan
        if: matrix.stack != 'identity'
        working-directory: live/${{ matrix.stack }}
        env:
          STACK: ${{ matrix.stack }}
          TF_VAR_cloudflare_zone_id:    ${{ vars.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Read-only token, and only for the stacks that talk to Cloudflare. Empty elsewhere on purpose.
          TF_VAR_cloudflare_api_token:  ${{ contains(fromJSON('["edge","storage-dev","storage-prod","onprem"]'), matrix.stack) && secrets.CLOUDFLARE_API_TOKEN_READONLY || '' }}
          # edge: every variable the stack declares WITHOUT a default (same set
          # infra-plan.yml passes; without them the nightly edge pass is red on
          # "required variable not set"). Secrets where the value is sensitive.
          TF_VAR_admin_hostnames:        ${{ contains(fromJSON('["edge","onprem"]'), matrix.stack) && secrets.ADMIN_HOSTNAMES || '' }}
          TF_VAR_tunnels_exist:          ${{ matrix.stack == 'edge' && vars.TUNNELS_EXIST || '' }}
          # MCP hub (live/edge/variables.mcp_hub.tf): flag and ids only; no client secret in drift (read-only run). `|| 'false'`: empty breaks the bool.
          TF_VAR_mcp_hub_enabled:                    ${{ matrix.stack == 'edge' && (vars.MCP_HUB_ENABLED || 'false') || 'false' }}
          TF_VAR_mcp_github_oauth_client_id:         ${{ matrix.stack == 'edge' && vars.MCP_GITHUB_OAUTH_CLIENT_ID || '' }}
          TF_VAR_mcp_grafana_oauth_client_id:        ${{ matrix.stack == 'edge' && vars.MCP_GRAFANA_OAUTH_CLIENT_ID || '' }}
          TF_VAR_mcp_grafana_authorization_endpoint: ${{ matrix.stack == 'edge' && vars.MCP_GRAFANA_AUTHORIZATION_ENDPOINT || '' }}
          TF_VAR_mcp_grafana_token_endpoint:         ${{ matrix.stack == 'edge' && vars.MCP_GRAFANA_TOKEN_ENDPOINT || '' }}
          TF_VAR_grp_platform_admins_id: ${{ matrix.stack == 'edge' && vars.ENTRA_GRP_PLATFORM_ADMINS_ID || '' }}
          TF_VAR_grp_developers_id:      ${{ matrix.stack == 'edge' && vars.ENTRA_GRP_DEVELOPERS_ID || '' }}
          TF_VAR_grp_dev_users_id:     ${{ matrix.stack == 'edge' && vars.ENTRA_GRP_DEV_USERS_ID || '' }}
          TF_VAR_grp_staff_id: ${{ matrix.stack == 'edge' && vars.ENTRA_GRP_STAFF_ID || '' }}
          TF_VAR_entra_tenant_id:        ${{ matrix.stack == 'edge' && vars.ENTRA_TENANT_ID || '' }}
          TF_VAR_entra_idp_client_id:    ${{ matrix.stack == 'edge' && vars.ENTRA_IDP_CLIENT_ID || '' }}
          TF_VAR_entra_idp_client_secret: ${{ matrix.stack == 'edge' && secrets.ENTRA_IDP_CLIENT_SECRET || '' }}
          # adaptive-metrics: the provider configures by calling the AM API, so the
          # nightly plan needs the token + URL here too (matrix-scoped, same form
          # as infra-plan.yml). Empty for every other stack.
          TF_VAR_adaptive_metrics_url:   ${{ matrix.stack == 'adaptive-metrics' && vars.AM_METRICS_URL || '' }}
          TF_VAR_adaptive_metrics_api_key: ${{ matrix.stack == 'adaptive-metrics' && secrets.GRAFANA_ADAPTIVE_METRICS_API_TOKEN_READONLY || '' }}
          # onprem: Azure OIDC (read identity) for the azurerm backend, plus the
          # stack's inputs (same secrets the apply job uses).
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID_READ }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          TF_VAR_admin_private_cidr: ${{ contains(fromJSON('["onprem","edge"]'), matrix.stack) && secrets.ADMIN_PRIVATE_CIDR || '' }}
          TF_VAR_warp_extra_excludes: ${{ matrix.stack == 'edge' && secrets.WARP_EXTRA_EXCLUDES || '[]' }}
          TF_VAR_ssh_infra_targets:   ${{ matrix.stack == 'edge' && secrets.SSH_INFRA_TARGETS || '{}' }}
        run: |
          # edge: never printed (private SSH target map). The saved plan is what the summary step below
          # reads; every other stack keeps its log stream and no plan file.
          set +e
          if [ "$STACK" = "edge" ]; then
            tofu plan -input=false -lock=false -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
            ec=$?
            if [ "$ec" = "1" ]; then sed -n '/^╷/,/^╵/p' plan.txt >&2; fi
          else
            tofu plan -input=false -lock=false -no-color -detailed-exitcode 2>&1 | tee plan.txt
            ec=${PIPESTATUS[0]}
          fi
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"

      # edge publishes counts + fingerprint + changed TYPES and nothing else: its plan text carries the
      # private SSH target map. Non-edge stacks show the tail of their plan in the Report step instead.
      - name: Drift summary (edge)
        if: matrix.stack == 'edge' && steps.plan.outputs.exitcode != '1'
        working-directory: live/edge
        run: bash "$GITHUB_WORKSPACE/.github/scripts/plan-fingerprint.sh" plan edge "$EXIT_CODE"
        env:
          EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
          HIDE_ADDRESSES: 'true'
          PLAN_TITLE: 'Unapplied config: live/edge — counts, fingerprint and changed resource types only (the plan carries private SSH targets)'
          FP_HMAC_KEY: ${{ secrets.SSH_INFRA_TARGETS }}
          FP_JSON: ${{ runner.temp }}/fp-edge.json
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID_READ }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'

      # ── identity: same two passes, through the owner kit, output FILE ONLY ──
      # The kit builds every required TF_VAR_* from read-only az lookups, then runs
      # the command in live/identity. Both passes write to live/identity/<file>
      # and never to the log or the step summary: the public-repo rule that keeps
      # identity out of infra-plan.yml applies here too.
      - name: Detect external drift (refresh-only) — identity via the owner kit
        id: refresh_identity
        if: matrix.stack == 'identity'
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID_READ }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          IDENTITY_OWNER_OPERATOR_UPN: ${{ secrets.IDENTITY_OWNER_OPERATOR_UPN }}
          IDENTITY_SECOND_OWNER_UPN:   ${{ secrets.IDENTITY_SECOND_OWNER_UPN }}
          IDENTITY_PROXMOX_HOST:       ${{ secrets.IDENTITY_PROXMOX_HOST }}
          IDENTITY_PBS_HOST:           ${{ secrets.IDENTITY_PBS_HOST }}
          IDENTITY_KV_AUDIT_EMAIL:     ${{ secrets.IDENTITY_KV_AUDIT_EMAIL }}
        run: |
          set +e
          scripts/owner/identity-env/identity-env.sh -- \
            tofu plan -refresh-only -input=false -lock=false -no-color -detailed-exitcode -out=refresh.tfplan \
            >"$GITHUB_WORKSPACE/live/identity/refresh.txt" 2>&1
          rc=$?
          # The kit's OWN failures (a missing input, an ambiguous app) must not
          # masquerade as a clean plan: the kit exits non-zero AND the plan file is
          # absent, which the classifier reports as class=1.
          echo "exitcode=$rc" >> "$GITHUB_OUTPUT"

      - name: Detect unapplied config — identity via the owner kit
        id: plan_identity
        if: matrix.stack == 'identity'
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID_READ }}
          ARM_TENANT_ID:       ${{ vars.ENTRA_TENANT_ID }}
          ARM_USE_OIDC:        'true'
          IDENTITY_OWNER_OPERATOR_UPN: ${{ secrets.IDENTITY_OWNER_OPERATOR_UPN }}
          IDENTITY_SECOND_OWNER_UPN:   ${{ secrets.IDENTITY_SECOND_OWNER_UPN }}
          IDENTITY_PROXMOX_HOST:       ${{ secrets.IDENTITY_PROXMOX_HOST }}
          IDENTITY_PBS_HOST:           ${{ secrets.IDENTITY_PBS_HOST }}
          IDENTITY_KV_AUDIT_EMAIL:     ${{ secrets.IDENTITY_KV_AUDIT_EMAIL }}
        run: |
          set +e
          scripts/owner/identity-env/identity-env.sh -- \
            tofu plan -input=false -lock=false -no-color -detailed-exitcode \
            >"$GITHUB_WORKSPACE/live/identity/plan.txt" 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      # Only when the refresh-only pass found something: classify it. The classifier and the list of protected types live in
      # quynhonsemiconductor/ci/actions/destructive-guard (mode: drift), the same list the plan guard uses.
      # Output `class`: 2 matters, 3 informational, 0 none, 1 could not classify.
      - name: Classify external drift
        id: classify
        if: ${{ matrix.stack != 'identity' && steps.refresh.outputs.exitcode == '2' }}
        uses: quynhonsemiconductor/ci/actions/destructive-guard@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
        with:
          mode: drift
          plan-file: refresh.tfplan
          working-directory: live/${{ matrix.stack }}

      # Exit codes: 0 = no changes, 1 = error, 2 = changes present.
      - name: Report
        working-directory: live/${{ matrix.stack }}
        env:
          # Passed through the environment, never interpolated: the identity step
          # ids are the only outputs not already handled this way in this file, and
          # ${{ }} inside `run` is the template-injection shape zizmor flags.
          REFRESH_IDENTITY: ${{ steps.refresh_identity.outputs.exitcode }}
          PLAN_IDENTITY: ${{ steps.plan_identity.outputs.exitcode }}
          STACK_NAME: ${{ matrix.stack }}
        run: |
          refresh="${{ steps.refresh.outputs.exitcode }}"
          plan="${{ steps.plan.outputs.exitcode }}"
          stack="$STACK_NAME"
          if [ "$stack" = "identity" ]; then
            refresh="$REFRESH_IDENTITY"
            plan="$PLAN_IDENTITY"
          fi
          class="${{ steps.classify.outputs.class }}"   # 2 matters, 3 informational, 0 none, 1 could not classify

          {
            echo "## \`$stack\`"
            echo ""
            if [ "$stack" = "identity" ]; then
              # NEVER print a drifted ADDRESS for identity: the destructive-guard
              # classifier (drift_report.py) prints them, and the identity
              # for_each keys are user/app OBJECT IDS. The step is excluded above.
              # Exit 2 is red with this one line; the owner runs the kit locally.
              if [ "$refresh" = "2" ] || [ "$plan" = "2" ]; then
                echo "- Drift: **detected** — details withheld, this repository is public. Run \`scripts/owner/identity-env/identity-env.sh -- tofu plan\` locally."
              fi
              # An errored pass is not drift and names nothing secret; keep it visible.
              if [ "$refresh" != "0" ] && [ "$refresh" != "2" ]; then
                echo "- External drift: :warning: refresh-only errored (exit $refresh)"
              fi
              if [ "$plan" != "0" ] && [ "$plan" != "2" ]; then
                echo "- Unapplied config: :warning: plan errored (exit $plan)"
              fi
            else
              case "$refresh" in
                0) echo "- External drift: **none**" ;;
                2) case "$class" in
                     3) echo "- External drift: informational only (provider-computed attributes), listed above" ;;
                     *) echo "- External drift: **DETECTED** — reality diverged from state" ;;
                   esac ;;
                *) echo "- External drift: :warning: refresh-only errored (exit $refresh)" ;;
              esac
              case "$plan" in
                0) echo "- Unapplied config: **none** — main matches reality" ;;
                2) echo "- Unapplied config: **DETECTED** — main has changes never applied" ;;
                *) echo "- Unapplied config: :warning: plan errored (exit $plan)" ;;
              esac
              if [ "$refresh" = "2" ] || [ "$plan" = "2" ]; then
                # edge: NO plan text, ever. Its plan carries the private SSH target map; the
                # summary step above already published counts, fingerprint and types.
                if [ "$stack" != "edge" ]; then
                  echo ""
                  echo "<details><summary>plan output</summary>"
                  echo ""
                  echo '```'
                  tail -c 8000 plan.txt 2>/dev/null || true
                  echo '```'
                  echo ""
                  echo "</details>"
                fi
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail so the scheduled run turns red and GitHub notifies. An errored pass (1)
          # also fails — a detector that cannot run is not a passing detector.
          # refresh 2 is a failure unless it was classified as informational (3). A classifier that could not run
          # (1, or no output) counts as a failure: not knowing is not a pass.
          refresh_bad=1
          if [ "$refresh" = "0" ] || { [ "$refresh" = "2" ] && [ "$class" = "3" ]; }; then refresh_bad=0; fi
          if [ "$refresh_bad" = "1" ] || [ "$plan" != "0" ]; then
            echo "::error::$stack — refresh exit $refresh, plan exit $plan"
            exit 1
          fi

  # The Worker in live/onprem-oidc is a trust root for Key Vault (whoever changes its JWKS can mint tokens Entra
  # accepts for the ESO apps). This compares what is SERVED with the stack's non-secret outputs recorded in
  # live/onprem-oidc/jwks-expected.txt. Public fetch only: no credential.
  oidc-served:
    name: Drift onprem-oidc-served
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Served JWKS equals the expected key set
        run: |
          set -euo pipefail
          exp=live/onprem-oidc/jwks-expected.txt
          want_kids=$(sed -n 's/^kids=//p' "$exp"); want_sha=$(sed -n 's/^sha256=//p' "$exp")
          if [ "$want_kids" = "unset" ] || [ "$want_sha" = "unset" ]; then
            echo "::notice::jwks-expected.txt is not set yet (stack not applied): skipping"; exit 0
          fi
          host=$(sed -n '/^variable "oidc_hostname"/,/^}/s/^[[:space:]]*default[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' live/onprem-oidc/variables.tf)
          path=$(sed -n '/^variable "oidc_path"/,/^}/s/^[[:space:]]*default[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' live/onprem-oidc/variables.tf)
          issuer="https://$host/$path"
          disc=$(curl -fsS --max-time 20 "$issuer/.well-known/openid-configuration")
          [ "$(jq -r .issuer <<<"$disc")" = "$issuer" ] || { echo "::error::served issuer differs from $issuer"; exit 1; }
          jwks=$(curl -fsS --max-time 20 "$(jq -r .jwks_uri <<<"$disc")")
          kids=$(jq -r '[.keys[].kid]|sort|join(",")' <<<"$jwks")
          sha=$(jq -S -c . <<<"$jwks" | tr -d '\n' | sha256sum | cut -d' ' -f1)
          [ "$kids" = "$want_kids" ] || { echo "::error::served kid set differs from the expected one"; exit 1; }
          [ "$sha" = "$want_sha" ] || { echo "::error::served JWKS hash differs from the expected one"; exit 1; }
          echo "served JWKS matches (${kids})"

  # Any stack that is not green, including "could not run", raises an alert that does not depend on someone watching Actions.
  alert:
    name: Alert on drift failure
    needs: [drift, oidc-served]
    if: ${{ always() && ((needs.drift.result != 'success' && needs.drift.result != 'skipped') || needs.oidc-served.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read      # lists this run's jobs, to name the failing stacks
    steps:
      - name: Name the failing stacks
        id: failing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          # jobs are named "Drift <stack>"; a lookup failure must not hide the alert, so it degrades to "see the run"
          list="$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name | startswith("Drift ")) | select(.conclusion != "success" and .conclusion != "skipped") | .name | sub("^Drift "; "")' 2>/dev/null | paste -sd, - || true)"
          echo "stacks=${list:-unknown (see the run)}" >> "$GITHUB_OUTPUT"

      - name: Open or update the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STACKS: ${{ steps.failing.outputs.stacks }}
        run: |
          set -euo pipefail
          gh label create drift-detection -R "$REPO" --color D93F0B --description "Nightly drift job did not pass" 2>/dev/null || true
          body="Failing stacks: ${STACKS}. Run: ${RUN_URL}. A stack fails when its plan has unapplied changes, when a plan errors, or when a resource was deleted outside OpenTofu or a DNS/identity resource changed. The per-stack summary is on the run. This issue closes itself on the next fully green run."
          n="$(gh issue list -R "$REPO" --label drift-detection --state open --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then
            gh issue comment "$n" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "Drift detection is failing" --label drift-detection --body "$body"
          fi

      # TEAMS_ALERTS_WEBHOOK_URL is a Teams *Workflows* webhook. It answers 202 to ANY body and posts nothing unless the body
      # is {"type":"message","attachments":[{"contentType":"application/vnd.microsoft.card.adaptive","content":<card>}]};
      # a plain {"text": ...} (the Office 365 connector format) is silently dropped. So the payload is an Adaptive Card.
      # The GitHub issue above is the durable alert; this step only warns when it cannot post.
      - name: Post to the platform Teams channel
        env:
          WEBHOOK: ${{ secrets.TEAMS_ALERTS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STACKS: ${{ steps.failing.outputs.stacks }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "::warning::TEAMS_ALERTS_WEBHOOK_URL is not set; only the GitHub issue was raised"; exit 0; fi
          payload="$(python3 - <<'PY'
          import json, os
          card = {
              "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
              "type": "AdaptiveCard",
              "version": "1.4",
              "body": [
                  {"type": "TextBlock", "size": "Medium", "weight": "Bolder", "wrap": True,
                   "text": "Drift detection failed: qnsc infra"},
                  {"type": "FactSet", "facts": [{"title": "Stacks", "value": os.environ["STACKS"]}]},
                  {"type": "TextBlock", "wrap": True, "isSubtle": True,
                   "text": "Unapplied config, a plan that errored, a resource deleted outside OpenTofu, or a DNS/identity change."},
              ],
              "actions": [{"type": "Action.OpenUrl", "title": "Open the run", "url": os.environ["RUN_URL"]}],
          }
          print(json.dumps({"type": "message",
                            "attachments": [{"contentType": "application/vnd.microsoft.card.adaptive",
                                             "contentUrl": None, "content": card}]}))
          PY
          )"
          curl -fsS --max-time 20 -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK" >/dev/null \
            || echo "::warning::Teams post failed; see the GitHub issue"

  # A green run closes the issue, so an open drift-detection issue always means "failing now".
  resolve:
    name: Close the drift issue
    needs: [drift, oidc-served]
    if: ${{ always() && needs.drift.result == 'success' && needs.oidc-served.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close open drift issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for n in $(gh issue list -R "$REPO" --label drift-detection --state open --json number --jq '.[].number'); do
            gh issue close "$n" -R "$REPO" --comment "Every stack passed in ${RUN_URL}. Closing; it reopens as a new issue if drift returns."
          done
