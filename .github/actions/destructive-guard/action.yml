name: destructive-guard
description: >
  Fail the job when the saved plan DELETES or REPLACES a DNS or identity resource (Cloudflare records, Pages, SES
  identities, ACM certificates, OIDC providers, KMS keys, ...), unless the merged/open PR carries the label
  `allow-dns-destroy` (or a manual dispatch passed allow_destructive). See scripts/destructive_guard.py for why:
  docs/incidents/2026-10-09-edge-dns.md.

  The label is read LIVE from the API, not from the workflow event: re-running a failed job reuses the original event
  payload, so a label added after the failure would otherwise be invisible.

inputs:
  working-directory:
    description: The stack directory holding the saved plan.
    required: true
  plan-file:
    description: The saved plan, relative to the working directory.
    required: false
    default: tfplan
  pr-number:
    description: Pull request number (plan workflow). Empty on a push.
    required: false
    default: ""
  dispatch-allow:
    description: "'true' when a manual dispatch passed allow_destructive."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve the allow label
      id: label
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
        PR: ${{ inputs.pr-number }}
        DISPATCH_ALLOW: ${{ inputs.dispatch-allow }}
        EVENT: ${{ github.event_name }}
      run: |
        set -uo pipefail
        allow=false
        labels=""
        if [ "$EVENT" = workflow_dispatch ]; then
          [ "$DISPATCH_ALLOW" = true ] && allow=true
        elif [ -n "$PR" ]; then
          labels="$(gh api "repos/$REPO/issues/$PR/labels" --jq '[.[].name] | join(",")' 2>/dev/null || true)"
        else
          labels="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[].labels[].name] | join(",")' 2>/dev/null || true)"
        fi
        # an API failure leaves labels empty: the guard then FAILS CLOSED (refuses), never opens
        case ",$labels," in *,allow-dns-destroy,*) allow=true;; esac
        echo "labels: [${labels}]  allow=$allow"
        echo "allow=$allow" >> "$GITHUB_OUTPUT"

    - name: Refuse to delete or replace DNS / identity resources
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PLAN_FILE: ${{ inputs.plan-file }}
        ALLOW: ${{ steps.label.outputs.allow }}
        GUARD: ${{ github.workspace }}/scripts/destructive_guard.py
      run: |
        set -euo pipefail
        flag=""; [ "$ALLOW" = true ] && flag="--allow"
        # straight into the guard: the JSON carries the prior state and is never written to disk
        tofu show -json "$PLAN_FILE" | python3 "$GUARD" $flag
