write-kubeconfig-mode: "0640"
disable: [traefik, servicelb]
secrets-encryption: true
kube-apiserver-arg:
  # ESO workload identity (live/identity/eso.tf, live/onprem-oidc): k3s SIGNS with the first issuer, the
  # URL Entra trusts and live/onprem-oidc publishes; the second is the old default, accepted and never
  # issued, so tokens minted before the restart keep working. Both must stay listed until every pod has
  # restarted or its token has rotated. live/identity/tests/static.sh checks the first against eso.tf.
  - service-account-issuer=https://oidc.qnsc.vn/k3s-onprem
  - service-account-issuer=https://kubernetes.default.svc.cluster.local
